<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="4798" viewBox="0 0 1536 4798" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 3 · Chapter outline</title>
  <desc id="desc">A vertical column of 13 text cards partitions all 22 verses in Exodus 3. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="4798" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 3 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 3:1–22 · 13 source-based reading stages</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses leads the flock</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">to Horeb</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 3:1</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses leads Jethro’s flock</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to Horeb, the mountain of</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">God.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="708" x2="120" y2="708" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="708" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">The bush burns; Moses</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">hides his face</text>
  <text x="150" y="685" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 3:2–6</text>
  <text x="150" y="719" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD calls Moses from a</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">burning bush, tells him to</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">remove his shoes, and Moses</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">hides his face.</text>
  <path d="M335 859V909" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1060" x2="120" y2="1060" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="919" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1060" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="962" fill="#172d27" font-family="Georgia,serif" font-size="30">The LORD sees and</text>
  <text x="150" y="998" fill="#172d27" font-family="Georgia,serif" font-size="30">hears Israel’s sorrow</text>
  <text x="150" y="1037" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 3:7</text>
  <text x="150" y="1071" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD says he has seen</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel’s affliction, heard</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">their cry, and knows their</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sorrows.</text>
  <path d="M335 1211V1261" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1412" x2="120" y2="1412" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1271" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1412" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1314" fill="#172d27" font-family="Georgia,serif" font-size="30">The LORD promises a</text>
  <text x="150" y="1350" fill="#172d27" font-family="Georgia,serif" font-size="30">good land</text>
  <text x="150" y="1389" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 3:8–9</text>
  <text x="150" y="1423" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD promises to bring</text>
  <text x="150" y="1453" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel from Egypt to a good</text>
  <text x="150" y="1483" fill="#59685f" font-family="Arial,sans-serif" font-size="24">land flowing with milk and</text>
  <text x="150" y="1513" fill="#59685f" font-family="Arial,sans-serif" font-size="24">honey.</text>
  <path d="M335 1563V1613" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1764" x2="120" y2="1764" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1623" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1764" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1666" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses is sent to</text>
  <text x="150" y="1702" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh</text>
  <text x="150" y="1741" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 3:10</text>
  <text x="150" y="1775" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD sends Moses to</text>
  <text x="150" y="1805" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh to bring the</text>
  <text x="150" y="1835" fill="#59685f" font-family="Arial,sans-serif" font-size="24">children of Israel out of</text>
  <text x="150" y="1865" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Egypt.</text>
  <path d="M335 1915V1965" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2116" x2="120" y2="2116" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1975" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2116" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2018" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses asks who he is;</text>
  <text x="150" y="2054" fill="#172d27" font-family="Georgia,serif" font-size="30">God promises help</text>
  <text x="150" y="2093" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 3:11–12</text>
  <text x="150" y="2127" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses asks how he can lead</text>
  <text x="150" y="2157" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel; the LORD promises</text>
  <text x="150" y="2187" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to be with him and gives a</text>
  <text x="150" y="2217" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sign at Horeb.</text>
  <path d="M335 2267V2317" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2453" x2="120" y2="2453" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2327" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2453" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2370" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses asks what name</text>
  <text x="150" y="2406" fill="#172d27" font-family="Georgia,serif" font-size="30">he should give Israel</text>
  <text x="150" y="2445" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 3:13</text>
  <text x="150" y="2479" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses asks what name he</text>
  <text x="150" y="2509" fill="#59685f" font-family="Arial,sans-serif" font-size="24">should give if Israel asks</text>
  <text x="150" y="2539" fill="#59685f" font-family="Arial,sans-serif" font-size="24">who sent him.</text>
  <path d="M335 2589V2639" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2775" x2="120" y2="2775" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2649" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2775" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2692" fill="#172d27" font-family="Georgia,serif" font-size="30">“I AM THAT I AM” is</text>
  <text x="150" y="2728" fill="#172d27" font-family="Georgia,serif" font-size="30">given as the message</text>
  <text x="150" y="2767" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 3:14</text>
  <text x="150" y="2801" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Uses the source wording as</text>
  <text x="150" y="2831" fill="#59685f" font-family="Arial,sans-serif" font-size="24">a quoted response, clearly</text>
  <text x="150" y="2861" fill="#59685f" font-family="Arial,sans-serif" font-size="24">separated from explanation.</text>
  <path d="M335 2911V2961" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3097" x2="120" y2="3097" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2971" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3097" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3014" fill="#172d27" font-family="Georgia,serif" font-size="30">The God of Abraham,</text>
  <text x="150" y="3050" fill="#172d27" font-family="Georgia,serif" font-size="30">Isaac, and Jacob</text>
  <text x="150" y="3089" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 3:15</text>
  <text x="150" y="3123" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD names the God of</text>
  <text x="150" y="3153" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Abraham, Isaac, and Jacob</text>
  <text x="150" y="3183" fill="#59685f" font-family="Arial,sans-serif" font-size="24">as his memorial forever.</text>
  <path d="M335 3233V3283" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3434" x2="120" y2="3434" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3293" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3434" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3336" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel’s elders hear</text>
  <text x="150" y="3372" fill="#172d27" font-family="Georgia,serif" font-size="30">the LORD’s message</text>
  <text x="150" y="3411" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 3:16–17</text>
  <text x="150" y="3445" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses tells Israel’s elders</text>
  <text x="150" y="3475" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the LORD has seen their</text>
  <text x="150" y="3505" fill="#59685f" font-family="Arial,sans-serif" font-size="24">affliction and will bring</text>
  <text x="150" y="3535" fill="#59685f" font-family="Arial,sans-serif" font-size="24">them to Canaan.</text>
  <path d="M335 3585V3635" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3804" x2="120" y2="3804" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3645" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3804" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3688" fill="#172d27" font-family="Georgia,serif" font-size="30">Ask Pharaoh for three</text>
  <text x="150" y="3724" fill="#172d27" font-family="Georgia,serif" font-size="30">days’ journey to</text>
  <text x="150" y="3760" fill="#172d27" font-family="Georgia,serif" font-size="30">sacrifice</text>
  <text x="150" y="3799" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 3:18</text>
  <text x="150" y="3833" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses and Israel’s elders</text>
  <text x="150" y="3863" fill="#59685f" font-family="Arial,sans-serif" font-size="24">are to ask Pharaoh for</text>
  <text x="150" y="3893" fill="#59685f" font-family="Arial,sans-serif" font-size="24">three days to sacrifice in</text>
  <text x="150" y="3923" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the wilderness.</text>
  <path d="M335 3973V4023" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="4192" x2="120" y2="4192" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="4033" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="4192" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="4076" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh’s refusal and</text>
  <text x="150" y="4112" fill="#172d27" font-family="Georgia,serif" font-size="30">later release are</text>
  <text x="150" y="4148" fill="#172d27" font-family="Georgia,serif" font-size="30">foretold</text>
  <text x="150" y="4187" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 3:19–20</text>
  <text x="150" y="4221" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD says Egypt’s king</text>
  <text x="150" y="4251" fill="#59685f" font-family="Arial,sans-serif" font-size="24">will not let Israel go,</text>
  <text x="150" y="4281" fill="#59685f" font-family="Arial,sans-serif" font-size="24">then foretells striking</text>
  <text x="150" y="4311" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Egypt with wonders.</text>
  <path d="M335 4361V4411" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="4562" x2="120" y2="4562" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="4421" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="4562" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="4464" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel will leave with</text>
  <text x="150" y="4500" fill="#172d27" font-family="Georgia,serif" font-size="30">Egypt’s goods</text>
  <text x="150" y="4539" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 3:21–22</text>
  <text x="150" y="4573" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD promises favor;</text>
  <text x="150" y="4603" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel’s women will ask</text>
  <text x="150" y="4633" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Egyptians for silver, gold,</text>
  <text x="150" y="4663" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and clothing.</text>
  <text x="120" y="4763" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
