<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1648" viewBox="0 0 1536 1648" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 3 · Chapter outline</title>
  <desc id="desc">A vertical column of 4 text cards partitions all 17 verses in Leviticus 3. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1648" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 3 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Peace Offerings · Leviticus 3:1–17 · 4 source-based units</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">A peace offering from</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">the herd</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 3:1–5</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A male or female from the</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">herd may be offered without</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">blemish; the priest burns the</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">specified fat portions.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="738" x2="120" y2="738" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="738" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">A peace offering from</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">the flock</text>
  <text x="150" y="715" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 3:6–11</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">An unblemished sheep may be</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offered, with the priest</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">burning the specified</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">portions on the altar.</text>
  <path d="M335 889V939" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1075" x2="120" y2="1075" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="949" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1075" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">A peace offering of a</text>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">goat</text>
  <text x="150" y="1067" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 3:12–16</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">For a goat, the priest</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">removes and burns the listed</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">fat portions on the altar.</text>
  <path d="M335 1211V1261" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1412" x2="120" y2="1412" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1271" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1412" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1314" fill="#172d27" font-family="Georgia,serif" font-size="30">Fat and blood are</text>
  <text x="150" y="1350" fill="#172d27" font-family="Georgia,serif" font-size="30">forbidden as food</text>
  <text x="150" y="1389" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 3:17</text>
  <text x="150" y="1423" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel must not eat the fat</text>
  <text x="150" y="1453" fill="#59685f" font-family="Arial,sans-serif" font-size="24">or blood of these animals;</text>
  <text x="150" y="1483" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the restriction is given as a</text>
  <text x="150" y="1513" fill="#59685f" font-family="Arial,sans-serif" font-size="24">lasting statute.</text>
  <text x="120" y="1613" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
