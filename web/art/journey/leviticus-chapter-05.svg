<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1708" viewBox="0 0 1536 1708" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 5 · Chapter outline</title>
  <desc id="desc">A vertical column of 4 text cards partitions all 19 verses in Leviticus 5. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1708" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 5 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Confession and Guilt Offerings · Leviticus 5:1–19 · 4 source-based</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">units</text>
  <line x1="88" y1="401" x2="120" y2="401" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="401" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Confession and a flock</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">offering</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 5:1–6</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The law names failures</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">involving testimony,</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">uncleanness, and rash oaths,</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">then requires confession and</text>
  <text x="150" y="517" fill="#59685f" font-family="Arial,sans-serif" font-size="24">a female lamb or goat.</text>
  <path d="M335 567V617" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="768" x2="120" y2="768" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="627" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="768" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="670" fill="#172d27" font-family="Georgia,serif" font-size="30">Offerings for those</text>
  <text x="150" y="706" fill="#172d27" font-family="Georgia,serif" font-size="30">with less means</text>
  <text x="150" y="745" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 5:7–13</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A person unable to bring a</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">lamb may bring two birds; if</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">unable to bring those, the</text>
  <text x="150" y="869" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offering may be fine flour.</text>
  <path d="M335 919V969" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1120" x2="120" y2="1120" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="979" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1120" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1022" fill="#172d27" font-family="Georgia,serif" font-size="30">Restitution for holy</text>
  <text x="150" y="1058" fill="#172d27" font-family="Georgia,serif" font-size="30">things</text>
  <text x="150" y="1097" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 5:14–16</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">For an inadvertent trespass</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">involving holy things, a ram</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and repayment with an added</text>
  <text x="150" y="1221" fill="#59685f" font-family="Arial,sans-serif" font-size="24">fifth are prescribed.</text>
  <path d="M335 1271V1321" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1472" x2="120" y2="1472" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1331" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1472" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1374" fill="#172d27" font-family="Georgia,serif" font-size="30">A ram for an unknown</text>
  <text x="150" y="1410" fill="#172d27" font-family="Georgia,serif" font-size="30">offense</text>
  <text x="150" y="1449" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 5:17–19</text>
  <text x="150" y="1483" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A person who unknowingly</text>
  <text x="150" y="1513" fill="#59685f" font-family="Arial,sans-serif" font-size="24">violates a command brings a</text>
  <text x="150" y="1543" fill="#59685f" font-family="Arial,sans-serif" font-size="24">ram; the text calls it a</text>
  <text x="150" y="1573" fill="#59685f" font-family="Arial,sans-serif" font-size="24">trespass offering.</text>
  <text x="120" y="1673" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
