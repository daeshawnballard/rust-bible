<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">Family relationships and response</title><desc id="desc">Text-only relationship guide to Dinah, Leah, Jacob, Simeon, and Levi, plus the closing exchange in Genesis 34:30–31. It does not depict the assault or the retaliation described elsewhere in the chapter.</desc><rect width="1536" height="1024" fill="#101615"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b99b59"/></marker></defs><text x="768" y="78" text-anchor="middle" fill="#e8d5a8" font-family="Georgia,serif" font-size="44" font-weight="normal">Family relationships and response</text><text x="768" y="128" text-anchor="middle" fill="#b6aa8e" font-family="Georgia,serif" font-size="30" font-weight="normal">Genesis 34:1, 25, 30–31 · relationship guide, not an assault or retaliation illustration</text><path d="M395 290 C395 330 630 330 700 365 M1140 290 C1140 330 905 330 836 365" fill="none" stroke="#b99b59" stroke-width="3"/><rect x="235" y="190" width="320" height="100" rx="14" fill="#1b211d" stroke="#bb9d61" stroke-width="2"/><text x="395" y="233" text-anchor="middle" fill="#e8d5a8" font-family="Georgia,serif" font-size="38" font-weight="normal">Jacob</text><text x="395" y="272" text-anchor="middle" fill="#c4af7e" font-family="Georgia,serif" font-size="30" font-weight="normal">father · Genesis 34:1</text><rect x="980" y="190" width="320" height="100" rx="14" fill="#1b211d" stroke="#bb9d61" stroke-width="2"/><text x="1140" y="233" text-anchor="middle" fill="#e8d5a8" font-family="Georgia,serif" font-size="38" font-weight="normal">Leah</text><text x="1140" y="272" text-anchor="middle" fill="#c4af7e" font-family="Georgia,serif" font-size="30" font-weight="normal">mother · Genesis 34:1</text><rect x="600" y="355" width="336" height="112" rx="14" fill="#1b211d" stroke="#bb9d61" stroke-width="2"/><text x="768" y="402" text-anchor="middle" fill="#e8d5a8" font-family="Georgia,serif" font-size="40" font-weight="normal">Dinah</text><text x="768" y="445" text-anchor="middle" fill="#c4af7e" font-family="Georgia,serif" font-size="30" font-weight="normal">daughter · 34:1</text><rect x="205" y="535" width="1126" height="186" rx="16" fill="#1b211d" stroke="#bb9d61" stroke-width="2"/><text x="768" y="578" text-anchor="middle" fill="#e8d5a8" font-family="Georgia,serif" font-size="32" font-weight="normal">Dinah’s brothers · sons of Jacob · Genesis 34:25</text><path d="M485 627 H1050" fill="none" stroke="#b99b59" stroke-width="3"/><rect x="230" y="609" width="270" height="76" rx="10" fill="#202722" stroke="#9f8959" stroke-width="2"/><text x="365" y="657" text-anchor="middle" fill="#f0e4ca" font-family="Georgia,serif" font-size="34" font-weight="normal">Dinah</text><rect x="633" y="609" width="270" height="76" rx="10" fill="#202722" stroke="#9f8959" stroke-width="2"/><text x="768" y="657" text-anchor="middle" fill="#f0e4ca" font-family="Georgia,serif" font-size="34" font-weight="normal">Simeon</text><rect x="1035" y="609" width="270" height="76" rx="10" fill="#202722" stroke="#9f8959" stroke-width="2"/><text x="1170" y="657" text-anchor="middle" fill="#f0e4ca" font-family="Georgia,serif" font-size="34" font-weight="normal">Levi</text><text x="768" y="709" text-anchor="middle" fill="#b6aa8e" font-family="Georgia,serif" font-size="30" font-weight="normal">The verse names Simeon and Levi as her brothers.</text><rect x="292" y="770" width="952" height="150" rx="16" fill="#1b211d" stroke="#bb9d61" stroke-width="2"/><text x="768" y="817" text-anchor="middle" fill="#e8d5a8" font-family="Georgia,serif" font-size="36" font-weight="normal">Jacob ↔ Simeon and Levi</text><text x="768" y="865" text-anchor="middle" fill="#c4af7e" font-family="Georgia,serif" font-size="30" font-weight="normal">Jacob’s response and their reply · Genesis 34:30–31</t