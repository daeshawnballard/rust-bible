<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2114" viewBox="0 0 1536 2114" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 20 · Chapter outline</title>
  <desc id="desc">A vertical column of 5 text cards partitions all 27 verses in Leviticus 20. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2114" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 20 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Sanctions and covenant separation · Leviticus 20:1–27 · 5 source-based</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">units</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Molech worship and</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">public complicity</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 20:1–5</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The law condemns giving</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">children to Molech and the</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">community's refusal to act</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">against it.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="720" x2="120" y2="720" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="720" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">Reject spirit mediums</text>
  <text x="150" y="679" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 20:6–8</text>
  <text x="150" y="713" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text warns against</text>
  <text x="150" y="743" fill="#59685f" font-family="Arial,sans-serif" font-size="24">seeking mediums or wizards</text>
  <text x="150" y="773" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and calls Israel to</text>
  <text x="150" y="803" fill="#59685f" font-family="Arial,sans-serif" font-size="24">consecration and obedience.</text>
  <path d="M335 853V903" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1069" x2="120" y2="1069" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="913" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1069" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="956" fill="#172d27" font-family="Georgia,serif" font-size="30">Household and sexual</text>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">laws</text>
  <text x="150" y="1031" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 20:9–16</text>
  <text x="150" y="1065" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Several prohibited acts</text>
  <text x="150" y="1095" fill="#59685f" font-family="Arial,sans-serif" font-size="24">receive distinct penalties,</text>
  <text x="150" y="1125" fill="#59685f" font-family="Arial,sans-serif" font-size="24">including death; the verses</text>
  <text x="150" y="1155" fill="#59685f" font-family="Arial,sans-serif" font-size="24">address family relations and</text>
  <text x="150" y="1185" fill="#59685f" font-family="Arial,sans-serif" font-size="24">animal intercourse.</text>
  <path d="M335 1235V1285" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1451" x2="120" y2="1451" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1295" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1451" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1338" fill="#172d27" font-family="Georgia,serif" font-size="30">Further prohibited</text>
  <text x="150" y="1374" fill="#172d27" font-family="Georgia,serif" font-size="30">relations</text>
  <text x="150" y="1413" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 20:17–21</text>
  <text x="150" y="1447" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text distinguishes</text>
  <text x="150" y="1477" fill="#59685f" font-family="Arial,sans-serif" font-size="24">several prohibited unions and</text>
  <text x="150" y="1507" fill="#59685f" font-family="Arial,sans-serif" font-size="24">assigns consequences</text>
  <text x="150" y="1537" fill="#59685f" font-family="Arial,sans-serif" font-size="24">including removal, guilt, or</text>
  <text x="150" y="1567" fill="#59685f" font-family="Arial,sans-serif" font-size="24">childlessness.</text>
  <path d="M335 1617V1667" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1848" x2="120" y2="1848" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1677" width="430" height="342" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1848" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1720" fill="#172d27" font-family="Georgia,serif" font-size="30">Keep the covenant</text>
  <text x="150" y="1756" fill="#172d27" font-family="Georgia,serif" font-size="30">distinction</text>
  <text x="150" y="1795" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 20:22–27</text>
  <text x="150" y="1829" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel must keep the</text>
  <text x="150" y="1859" fill="#59685f" font-family="Arial,sans-serif" font-size="24">statutes, avoid the displaced</text>
  <text x="150" y="1889" fill="#59685f" font-family="Arial,sans-serif" font-size="24">nations' practices,</text>
  <text x="150" y="1919" fill="#59685f" font-family="Arial,sans-serif" font-size="24">distinguish clean from</text>
  <text x="150" y="1949" fill="#59685f" font-family="Arial,sans-serif" font-size="24">unclean animals, and remain</text>
  <text x="150" y="1979" fill="#59685f" font-family="Arial,sans-serif" font-size="24">holy.</text>
  <text x="120" y="2079" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
