<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="3492" viewBox="0 0 1536 3492" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 26 · Chapter outline</title>
  <desc id="desc">A vertical column of 9 text cards partitions all 46 verses in Leviticus 26. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="3492" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 26 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Covenant blessings and warnings · Leviticus 26:1–46 · 9 source-based</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">units</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Reject idols; keep</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">Sabbaths</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 26:1–2</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Do not make or worship</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">images; keep the Sabbaths and</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">revere the sanctuary.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="723" x2="120" y2="723" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="723" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">Blessings for</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">obedience</text>
  <text x="150" y="685" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 26:3–13</text>
  <text x="150" y="719" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Keeping the statutes is</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">followed by rain, harvest,</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">peace, safety, covenant</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">presence, and remembrance of</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">deliverance.</text>
  <path d="M335 889V939" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1090" x2="120" y2="1090" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="949" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1090" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">First warnings for</text>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">refusal</text>
  <text x="150" y="1067" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 26:14–17</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Refusing the commandments</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">brings illness, failed</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sowing, and defeat before</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">enemies.</text>
  <path d="M335 1241V1291" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1457" x2="120" y2="1457" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1301" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1457" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1344" fill="#172d27" font-family="Georgia,serif" font-size="30">Drought and crop</text>
  <text x="150" y="1380" fill="#172d27" font-family="Georgia,serif" font-size="30">failure</text>
  <text x="150" y="1419" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 26:18–22</text>
  <text x="150" y="1453" fill="#59685f" font-family="Arial,sans-serif" font-size="24">If refusal continues, the</text>
  <text x="150" y="1483" fill="#59685f" font-family="Arial,sans-serif" font-size="24">warning intensifies: rain</text>
  <text x="150" y="1513" fill="#59685f" font-family="Arial,sans-serif" font-size="24">fails, land and trees yield</text>
  <text x="150" y="1543" fill="#59685f" font-family="Arial,sans-serif" font-size="24">little, and wild beasts</text>
  <text x="150" y="1573" fill="#59685f" font-family="Arial,sans-serif" font-size="24">threaten the population.</text>
  <path d="M335 1623V1673" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1824" x2="120" y2="1824" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1683" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1824" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1726" fill="#172d27" font-family="Georgia,serif" font-size="30">Sword, plague, and</text>
  <text x="150" y="1762" fill="#172d27" font-family="Georgia,serif" font-size="30">rationed bread</text>
  <text x="150" y="1801" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 26:23–26</text>
  <text x="150" y="1835" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Further refusal is answered</text>
  <text x="150" y="1865" fill="#59685f" font-family="Arial,sans-serif" font-size="24">with sword and pestilence,</text>
  <text x="150" y="1895" fill="#59685f" font-family="Arial,sans-serif" font-size="24">followed by scarce food</text>
  <text x="150" y="1925" fill="#59685f" font-family="Arial,sans-serif" font-size="24">measured out by weight.</text>
  <path d="M335 1975V2025" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2191" x2="120" y2="2191" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2035" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2191" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2078" fill="#172d27" font-family="Georgia,serif" font-size="30">Severe famine and</text>
  <text x="150" y="2114" fill="#172d27" font-family="Georgia,serif" font-size="30">desolation</text>
  <text x="150" y="2153" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 26:27–33</text>
  <text x="150" y="2187" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The final warning describes</text>
  <text x="150" y="2217" fill="#59685f" font-family="Arial,sans-serif" font-size="24">extreme famine, destroyed</text>
  <text x="150" y="2247" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sanctuaries and cities, and</text>
  <text x="150" y="2277" fill="#59685f" font-family="Arial,sans-serif" font-size="24">scattering among other</text>
  <text x="150" y="2307" fill="#59685f" font-family="Arial,sans-serif" font-size="24">nations.</text>
  <path d="M335 2357V2407" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2573" x2="120" y2="2573" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2417" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2573" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2460" fill="#172d27" font-family="Georgia,serif" font-size="30">The land rests in</text>
  <text x="150" y="2496" fill="#172d27" font-family="Georgia,serif" font-size="30">desolation</text>
  <text x="150" y="2535" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 26:34–39</text>
  <text x="150" y="2569" fill="#59685f" font-family="Arial,sans-serif" font-size="24">During exile, the land enjoys</text>
  <text x="150" y="2599" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the Sabbaths it missed;</text>
  <text x="150" y="2629" fill="#59685f" font-family="Arial,sans-serif" font-size="24">survivors live in fear and</text>
  <text x="150" y="2659" fill="#59685f" font-family="Arial,sans-serif" font-size="24">waste away among their</text>
  <text x="150" y="2689" fill="#59685f" font-family="Arial,sans-serif" font-size="24">enemies.</text>
  <path d="M335 2739V2789" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2940" x2="120" y2="2940" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2799" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2940" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2842" fill="#172d27" font-family="Georgia,serif" font-size="30">Confession and</text>
  <text x="150" y="2878" fill="#172d27" font-family="Georgia,serif" font-size="30">covenant remembrance</text>
  <text x="150" y="2917" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 26:40–45</text>
  <text x="150" y="2951" fill="#59685f" font-family="Arial,sans-serif" font-size="24">If Israel confesses and</text>
  <text x="150" y="2981" fill="#59685f" font-family="Arial,sans-serif" font-size="24">humbles itself, God remembers</text>
  <text x="150" y="3011" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the covenants and will not</text>
  <text x="150" y="3041" fill="#59685f" font-family="Arial,sans-serif" font-size="24">destroy the people utterly.</text>
  <path d="M335 3091V3141" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3274" x2="120" y2="3274" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3151" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3274" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3194" fill="#172d27" font-family="Georgia,serif" font-size="30">Closing summary</text>
  <text x="150" y="3233" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 26:46</text>
  <text x="150" y="3267" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The chapter closes by</text>
  <text x="150" y="3297" fill="#59685f" font-family="Arial,sans-serif" font-size="24">identifying these statutes,</text>
  <text x="150" y="3327" fill="#59685f" font-family="Arial,sans-serif" font-size="24">judgments, and laws as made</text>
  <text x="150" y="3357" fill="#59685f" font-family="Arial,sans-serif" font-size="24">through Moses at Sinai.</text>
  <text x="120" y="3457" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
