<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1982" viewBox="0 0 1536 1982" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 32 · Chapter outline</title>
  <desc id="desc">A vertical column of 5 text cards partitions all 35 verses in Exodus 32. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1982" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 32 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 32:1–35 · 5 source-based reading stages</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Golden calf, altar,</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">and announced feast</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 32:1–6</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">While Moses delays, the</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">people ask Aaron for gods;</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">he makes a calf and feast.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="711" x2="120" y2="711" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="711" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">The LORD’s judgment</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">announced and Moses’</text>
  <text x="150" y="682" fill="#172d27" font-family="Georgia,serif" font-size="30">appeal</text>
  <text x="150" y="721" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 32:7–14</text>
  <text x="150" y="755" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses recalls exodus and</text>
  <text x="150" y="785" fill="#59685f" font-family="Arial,sans-serif" font-size="24">promises; the LORD relents</text>
  <text x="150" y="815" fill="#59685f" font-family="Arial,sans-serif" font-size="24">from judgment.</text>
  <path d="M335 865V915" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1066" x2="120" y2="1066" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="925" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1066" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="968" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses breaks tablets</text>
  <text x="150" y="1004" fill="#172d27" font-family="Georgia,serif" font-size="30">after seeing the calf</text>
  <text x="150" y="1043" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 32:15–20</text>
  <text x="150" y="1077" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses breaks the tablets,</text>
  <text x="150" y="1107" fill="#59685f" font-family="Arial,sans-serif" font-size="24">burns and grinds the calf,</text>
  <text x="150" y="1137" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and scatters it on water</text>
  <text x="150" y="1167" fill="#59685f" font-family="Arial,sans-serif" font-size="24">for Israel to drink.</text>
  <path d="M335 1217V1267" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1403" x2="120" y2="1403" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1277" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1403" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1320" fill="#172d27" font-family="Georgia,serif" font-size="30">Aaron’s account and</text>
  <text x="150" y="1356" fill="#172d27" font-family="Georgia,serif" font-size="30">the Levites’ action</text>
  <text x="150" y="1395" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 32:21–29</text>
  <text x="150" y="1429" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron recounts his actions;</text>
  <text x="150" y="1459" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the Levites act against the</text>
  <text x="150" y="1489" fill="#59685f" font-family="Arial,sans-serif" font-size="24">camp as commanded.</text>
  <path d="M335 1539V1589" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1743" x2="120" y2="1743" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1599" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1743" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1642" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses seeks</text>
  <text x="150" y="1678" fill="#172d27" font-family="Georgia,serif" font-size="30">forgiveness; judgment</text>
  <text x="150" y="1714" fill="#172d27" font-family="Georgia,serif" font-size="30">follows</text>
  <text x="150" y="1753" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 32:30–35</text>
  <text x="150" y="1787" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses seeks forgiveness;</text>
  <text x="150" y="1817" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the LORD speaks of sin, and</text>
  <text x="150" y="1847" fill="#59685f" font-family="Arial,sans-serif" font-size="24">a plague follows.</text>
  <text x="120" y="1947" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
