<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2262" viewBox="0 0 1536 2262" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 16 · Chapter outline</title>
  <desc id="desc">A vertical column of 6 text cards partitions all 36 verses in Exodus 16. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2262" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 16 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 16:1–36 · 6 source-based reading stages</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Hunger in the</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">wilderness</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 16:1–3</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Hungry in the wilderness,</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel complains and longs</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">for Egypt’s food.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="708" x2="120" y2="708" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="708" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">Manna announced, not</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">yet received</text>
  <text x="150" y="685" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 16:4–12</text>
  <text x="150" y="719" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD announces daily</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">bread from heaven and a</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">double portion on the sixth</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">day.</text>
  <path d="M335 859V909" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1045" x2="120" y2="1045" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="919" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1045" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="962" fill="#172d27" font-family="Georgia,serif" font-size="30">Quail and measured</text>
  <text x="150" y="998" fill="#172d27" font-family="Georgia,serif" font-size="30">manna</text>
  <text x="150" y="1037" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 16:13–18</text>
  <text x="150" y="1071" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Quail arrive; manna appears</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">after the dew, and each</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">gathers a measured share.</text>
  <path d="M335 1181V1231" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1367" x2="120" y2="1367" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1241" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1367" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1284" fill="#172d27" font-family="Georgia,serif" font-size="30">Manna left overnight</text>
  <text x="150" y="1320" fill="#172d27" font-family="Georgia,serif" font-size="30">spoils</text>
  <text x="150" y="1359" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 16:19–21</text>
  <text x="150" y="1393" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses forbids leaving manna</text>
  <text x="150" y="1423" fill="#59685f" font-family="Arial,sans-serif" font-size="24">overnight; some do, and it</text>
  <text x="150" y="1453" fill="#59685f" font-family="Arial,sans-serif" font-size="24">spoils.</text>
  <path d="M335 1503V1553" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1704" x2="120" y2="1704" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1563" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1704" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1606" fill="#172d27" font-family="Georgia,serif" font-size="30">Sabbath gathering and</text>
  <text x="150" y="1642" fill="#172d27" font-family="Georgia,serif" font-size="30">rest</text>
  <text x="150" y="1681" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 16:22–30</text>
  <text x="150" y="1715" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A double portion is kept</text>
  <text x="150" y="1745" fill="#59685f" font-family="Arial,sans-serif" font-size="24">for Sabbath; those seeking</text>
  <text x="150" y="1775" fill="#59685f" font-family="Arial,sans-serif" font-size="24">manna on day seven find</text>
  <text x="150" y="1805" fill="#59685f" font-family="Arial,sans-serif" font-size="24">none.</text>
  <path d="M335 1855V1905" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2041" x2="120" y2="2041" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1915" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2041" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1958" fill="#172d27" font-family="Georgia,serif" font-size="30">Manna kept as a</text>
  <text x="150" y="1994" fill="#172d27" font-family="Georgia,serif" font-size="30">memorial</text>
  <text x="150" y="2033" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 16:31–36</text>
  <text x="150" y="2067" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel names manna; Moses</text>
  <text x="150" y="2097" fill="#59685f" font-family="Arial,sans-serif" font-size="24">orders an omer kept for</text>
  <text x="150" y="2127" fill="#59685f" font-family="Arial,sans-serif" font-size="24">future generations.</text>
  <text x="120" y="2227" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
