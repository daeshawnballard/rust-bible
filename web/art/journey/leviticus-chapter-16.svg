<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="3630" viewBox="0 0 1536 3630" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 16 · Chapter outline</title>
  <desc id="desc">A vertical column of 9 text cards partitions all 34 verses in Leviticus 16. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="3630" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 16 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Annual atonement service · Leviticus 16:1–34 · 9 source-based units</text>
  <line x1="88" y1="401" x2="120" y2="401" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="401" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Restricted entry to</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">the holy place</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 16:1–2</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">After Aaron's sons die, the</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">LORD limits when Aaron may</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">enter behind the veil and</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">describes the cloud over the</text>
  <text x="150" y="517" fill="#59685f" font-family="Arial,sans-serif" font-size="24">mercy seat.</text>
  <path d="M335 567V617" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="765" x2="120" y2="765" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="627" width="430" height="276" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="765" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="670" fill="#172d27" font-family="Georgia,serif" font-size="30">Garments and offerings</text>
  <text x="150" y="709" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 16:3–5</text>
  <text x="150" y="743" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron is instructed to wash</text>
  <text x="150" y="773" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and wear linen garments and</text>
  <text x="150" y="803" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to bring a bull, ram, two</text>
  <text x="150" y="833" fill="#59685f" font-family="Arial,sans-serif" font-size="24">goats, and another ram from</text>
  <text x="150" y="863" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the congregation.</text>
  <path d="M335 913V963" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1129" x2="120" y2="1129" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="973" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1129" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1016" fill="#172d27" font-family="Georgia,serif" font-size="30">Aaron and the two</text>
  <text x="150" y="1052" fill="#172d27" font-family="Georgia,serif" font-size="30">goats</text>
  <text x="150" y="1091" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 16:6–10</text>
  <text x="150" y="1125" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron offers for himself and</text>
  <text x="150" y="1155" fill="#59685f" font-family="Arial,sans-serif" font-size="24">his household, presents two</text>
  <text x="150" y="1185" fill="#59685f" font-family="Arial,sans-serif" font-size="24">goats, casts lots, and</text>
  <text x="150" y="1215" fill="#59685f" font-family="Arial,sans-serif" font-size="24">assigns one for the LORD and</text>
  <text x="150" y="1245" fill="#59685f" font-family="Arial,sans-serif" font-size="24">one for release.</text>
  <path d="M335 1295V1345" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1511" x2="120" y2="1511" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1355" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1511" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1398" fill="#172d27" font-family="Georgia,serif" font-size="30">Incense and blood</text>
  <text x="150" y="1434" fill="#172d27" font-family="Georgia,serif" font-size="30">rites</text>
  <text x="150" y="1473" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 16:11–17</text>
  <text x="150" y="1507" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron makes atonement for</text>
  <text x="150" y="1537" fill="#59685f" font-family="Arial,sans-serif" font-size="24">himself and his house, brings</text>
  <text x="150" y="1567" fill="#59685f" font-family="Arial,sans-serif" font-size="24">incense beyond the veil,</text>
  <text x="150" y="1597" fill="#59685f" font-family="Arial,sans-serif" font-size="24">applies blood, and serves</text>
  <text x="150" y="1627" fill="#59685f" font-family="Arial,sans-serif" font-size="24">alone inside the tent.</text>
  <path d="M335 1677V1727" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1875" x2="120" y2="1875" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1737" width="430" height="276" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1875" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1780" fill="#172d27" font-family="Georgia,serif" font-size="30">Atonement at the altar</text>
  <text x="150" y="1819" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 16:18–19</text>
  <text x="150" y="1853" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron puts blood on the</text>
  <text x="150" y="1883" fill="#59685f" font-family="Arial,sans-serif" font-size="24">altar's horns and sprinkles</text>
  <text x="150" y="1913" fill="#59685f" font-family="Arial,sans-serif" font-size="24">it seven times, cleansing and</text>
  <text x="150" y="1943" fill="#59685f" font-family="Arial,sans-serif" font-size="24">hallowing it as the text</text>
  <text x="150" y="1973" fill="#59685f" font-family="Arial,sans-serif" font-size="24">directs.</text>
  <path d="M335 2023V2073" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2221" x2="120" y2="2221" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2083" width="430" height="276" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2221" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2126" fill="#172d27" font-family="Georgia,serif" font-size="30">Live goat released</text>
  <text x="150" y="2165" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 16:20–22</text>
  <text x="150" y="2199" fill="#59685f" font-family="Arial,sans-serif" font-size="24">After the place, tent, and</text>
  <text x="150" y="2229" fill="#59685f" font-family="Arial,sans-serif" font-size="24">altar are addressed, Aaron</text>
  <text x="150" y="2259" fill="#59685f" font-family="Arial,sans-serif" font-size="24">confesses Israel's sins over</text>
  <text x="150" y="2289" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the live goat, and a fit man</text>
  <text x="150" y="2319" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sends it into the wilderness.</text>
  <path d="M335 2369V2419" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2585" x2="120" y2="2585" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2429" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2585" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2472" fill="#172d27" font-family="Georgia,serif" font-size="30">Return and burnt</text>
  <text x="150" y="2508" fill="#172d27" font-family="Georgia,serif" font-size="30">offerings</text>
  <text x="150" y="2547" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 16:23–25</text>
  <text x="150" y="2581" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron changes garments,</text>
  <text x="150" y="2611" fill="#59685f" font-family="Arial,sans-serif" font-size="24">washes, offers burnt</text>
  <text x="150" y="2641" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offerings for himself and the</text>
  <text x="150" y="2671" fill="#59685f" font-family="Arial,sans-serif" font-size="24">people, and burns the fat as</text>
  <text x="150" y="2701" fill="#59685f" font-family="Arial,sans-serif" font-size="24">instructed.</text>
  <path d="M335 2751V2801" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2967" x2="120" y2="2967" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2811" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2967" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2854" fill="#172d27" font-family="Georgia,serif" font-size="30">Washing after handling</text>
  <text x="150" y="2890" fill="#172d27" font-family="Georgia,serif" font-size="30">offerings</text>
  <text x="150" y="2929" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 16:26–28</text>
  <text x="150" y="2963" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The person who releases the</text>
  <text x="150" y="2993" fill="#59685f" font-family="Arial,sans-serif" font-size="24">goat and those who burn the</text>
  <text x="150" y="3023" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offerings wash clothes and</text>
  <text x="150" y="3053" fill="#59685f" font-family="Arial,sans-serif" font-size="24">bodies before reentering the</text>
  <text x="150" y="3083" fill="#59685f" font-family="Arial,sans-serif" font-size="24">camp.</text>
  <path d="M335 3133V3183" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3364" x2="120" y2="3364" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3193" width="430" height="342" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3364" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3236" fill="#172d27" font-family="Georgia,serif" font-size="30">Annual Day of</text>
  <text x="150" y="3272" fill="#172d27" font-family="Georgia,serif" font-size="30">Atonement</text>
  <text x="150" y="3311" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 16:29–34</text>
  <text x="150" y="3345" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The seventh-month observance</text>
  <text x="150" y="3375" fill="#59685f" font-family="Arial,sans-serif" font-size="24">includes rest and</text>
  <text x="150" y="3405" fill="#59685f" font-family="Arial,sans-serif" font-size="24">self-denial; the priest makes</text>
  <text x="150" y="3435" fill="#59685f" font-family="Arial,sans-serif" font-size="24">atonement yearly for</text>
  <text x="150" y="3465" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sanctuary, tent, altar,</text>
  <text x="150" y="3495" fill="#59685f" font-family="Arial,sans-serif" font-size="24">priests, and people.</text>
  <text x="120" y="3595" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
