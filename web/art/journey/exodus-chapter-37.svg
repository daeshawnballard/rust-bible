<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1630" viewBox="0 0 1536 1630" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 37 · Chapter outline</title>
  <desc id="desc">A vertical column of 4 text cards partitions all 29 verses in Exodus 37. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1630" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 37 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 37:1–29 · 4 source-based reading stages</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Ark, poles, mercy</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">seat, and cherubim</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 37:1–9</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Bezalel makes the</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">gold-covered ark, poles,</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">mercy seat, and cherubim.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="711" x2="120" y2="711" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="711" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">Table, border, rings,</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">poles, and vessels are</text>
  <text x="150" y="682" fill="#172d27" font-family="Georgia,serif" font-size="30">made</text>
  <text x="150" y="721" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 37:10–16</text>
  <text x="150" y="755" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The table, border, rings,</text>
  <text x="150" y="785" fill="#59685f" font-family="Arial,sans-serif" font-size="24">poles, and gold vessels are</text>
  <text x="150" y="815" fill="#59685f" font-family="Arial,sans-serif" font-size="24">made.</text>
  <path d="M335 865V915" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1069" x2="120" y2="1069" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="925" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1069" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="968" fill="#172d27" font-family="Georgia,serif" font-size="30">Lampstand, branches,</text>
  <text x="150" y="1004" fill="#172d27" font-family="Georgia,serif" font-size="30">lamps, and utensils</text>
  <text x="150" y="1040" fill="#172d27" font-family="Georgia,serif" font-size="30">are made</text>
  <text x="150" y="1079" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 37:17–24</text>
  <text x="150" y="1113" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The beaten-gold lampstand,</text>
  <text x="150" y="1143" fill="#59685f" font-family="Arial,sans-serif" font-size="24">branches, lamps, and</text>
  <text x="150" y="1173" fill="#59685f" font-family="Arial,sans-serif" font-size="24">utensils are made.</text>
  <path d="M335 1223V1273" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1409" x2="120" y2="1409" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1283" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1409" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1326" fill="#172d27" font-family="Georgia,serif" font-size="30">Incense altar, oil,</text>
  <text x="150" y="1362" fill="#172d27" font-family="Georgia,serif" font-size="30">and incense are made</text>
  <text x="150" y="1401" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 37:25–29</text>
  <text x="150" y="1435" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The incense altar,</text>
  <text x="150" y="1465" fill="#59685f" font-family="Arial,sans-serif" font-size="24">anointing oil, and holy</text>
  <text x="150" y="1495" fill="#59685f" font-family="Arial,sans-serif" font-size="24">incense are made.</text>
  <text x="120" y="1595" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
