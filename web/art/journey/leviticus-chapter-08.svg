<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="3050" viewBox="0 0 1536 3050" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 8 · Chapter outline</title>
  <desc id="desc">A vertical column of 8 text cards partitions all 36 verses in Leviticus 8. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="3050" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 8 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Aaron and His Sons Consecrated · Leviticus 8:1–36 · 8 source-based</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">units</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">The congregation</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">gathers</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 8:1–5</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses gathers Aaron, his</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sons, the garments, oil,</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offerings, and the assembly</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">as commanded.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="738" x2="120" y2="738" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="738" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">Aaron is washed and</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">dressed</text>
  <text x="150" y="715" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 8:6–9</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses washes Aaron and puts</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">on the priestly garments,</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">breastplate, Urim and</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Thummim, and holy crown.</text>
  <path d="M335 889V939" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1090" x2="120" y2="1090" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="949" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1090" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">The tabernacle and</text>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">priests are anointed</text>
  <text x="150" y="1067" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 8:10–13</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses anoints the tabernacle</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">furnishings and Aaron, then</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">clothes Aaron’s sons in</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">priestly garments.</text>
  <path d="M335 1241V1291" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1442" x2="120" y2="1442" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1301" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1442" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1344" fill="#172d27" font-family="Georgia,serif" font-size="30">The sin offering</text>
  <text x="150" y="1380" fill="#172d27" font-family="Georgia,serif" font-size="30">purifies the altar</text>
  <text x="150" y="1419" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 8:14–17</text>
  <text x="150" y="1453" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses performs the prescribed</text>
  <text x="150" y="1483" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sin offering and purifies the</text>
  <text x="150" y="1513" fill="#59685f" font-family="Arial,sans-serif" font-size="24">altar; the remaining bullock</text>
  <text x="150" y="1543" fill="#59685f" font-family="Arial,sans-serif" font-size="24">is burned outside the camp.</text>
  <path d="M335 1593V1643" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1779" x2="120" y2="1779" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1653" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1779" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1696" fill="#172d27" font-family="Georgia,serif" font-size="30">The burnt offering is</text>
  <text x="150" y="1732" fill="#172d27" font-family="Georgia,serif" font-size="30">presented</text>
  <text x="150" y="1771" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 8:18–21</text>
  <text x="150" y="1805" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses presents the ram as a</text>
  <text x="150" y="1835" fill="#59685f" font-family="Arial,sans-serif" font-size="24">burnt offering and burns it</text>
  <text x="150" y="1865" fill="#59685f" font-family="Arial,sans-serif" font-size="24">whole upon the altar.</text>
  <path d="M335 1915V1965" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2116" x2="120" y2="2116" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1975" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2116" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2018" fill="#172d27" font-family="Georgia,serif" font-size="30">The ram of</text>
  <text x="150" y="2054" fill="#172d27" font-family="Georgia,serif" font-size="30">consecration</text>
  <text x="150" y="2093" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 8:22–29</text>
  <text x="150" y="2127" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses applies blood to the</text>
  <text x="150" y="2157" fill="#59685f" font-family="Arial,sans-serif" font-size="24">priests’ right ears, thumbs,</text>
  <text x="150" y="2187" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and toes, then waves portions</text>
  <text x="150" y="2217" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and bread before the LORD.</text>
  <path d="M335 2267V2317" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2450" x2="120" y2="2450" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2327" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2450" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2370" fill="#172d27" font-family="Georgia,serif" font-size="30">The consecration meal</text>
  <text x="150" y="2409" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 8:30–32</text>
  <text x="150" y="2443" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses sprinkles oil and altar</text>
  <text x="150" y="2473" fill="#59685f" font-family="Arial,sans-serif" font-size="24">blood on the priests and</text>
  <text x="150" y="2503" fill="#59685f" font-family="Arial,sans-serif" font-size="24">garments; Aaron and his sons</text>
  <text x="150" y="2533" fill="#59685f" font-family="Arial,sans-serif" font-size="24">eat the consecration meal.</text>
  <path d="M335 2583V2633" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2799" x2="120" y2="2799" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2643" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2799" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2686" fill="#172d27" font-family="Georgia,serif" font-size="30">Seven days at the</text>
  <text x="150" y="2722" fill="#172d27" font-family="Georgia,serif" font-size="30">tabernacle</text>
  <text x="150" y="2761" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 8:33–36</text>
  <text x="150" y="2795" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron and his sons must</text>
  <text x="150" y="2825" fill="#59685f" font-family="Arial,sans-serif" font-size="24">remain at the tabernacle</text>
  <text x="150" y="2855" fill="#59685f" font-family="Arial,sans-serif" font-size="24">entrance for seven days; the</text>
  <text x="150" y="2885" fill="#59685f" font-family="Arial,sans-serif" font-size="24">text says they did as</text>
  <text x="150" y="2915" fill="#59685f" font-family="Arial,sans-serif" font-size="24">commanded.</text>
  <text x="120" y="3015" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
