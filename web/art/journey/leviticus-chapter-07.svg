<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2824" viewBox="0 0 1536 2824" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 7 · Chapter outline</title>
  <desc id="desc">A vertical column of 7 text cards partitions all 38 verses in Leviticus 7. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2824" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 7 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Priestly Shares and Peace Offerings · Leviticus 7:1–38 · 7</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">source-based units</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">The guilt offering and</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">priestly portions</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 7:1–7</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The priest burns specified</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">portions; males among the</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">priests eat the remaining</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offering in a holy place.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="753" x2="120" y2="753" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="753" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">Shares from other</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">offerings</text>
  <text x="150" y="715" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 7:8–10</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The priest receives the burnt</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offering’s skin and certain</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">grain offerings; other grain</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offerings are shared among</text>
  <text x="150" y="869" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron’s sons.</text>
  <path d="M335 919V969" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1120" x2="120" y2="1120" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="979" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1120" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1022" fill="#172d27" font-family="Georgia,serif" font-size="30">A thanksgiving peace</text>
  <text x="150" y="1058" fill="#172d27" font-family="Georgia,serif" font-size="30">offering</text>
  <text x="150" y="1097" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 7:11–15</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Thanksgiving offerings</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">include breads and a priestly</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">portion; the meat is eaten on</text>
  <text x="150" y="1221" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the day it is offered.</text>
  <path d="M335 1271V1321" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1487" x2="120" y2="1487" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1331" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1487" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1374" fill="#172d27" font-family="Georgia,serif" font-size="30">Vow offerings and</text>
  <text x="150" y="1410" fill="#172d27" font-family="Georgia,serif" font-size="30">clean eating</text>
  <text x="150" y="1449" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 7:16–21</text>
  <text x="150" y="1483" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A vow or voluntary offering</text>
  <text x="150" y="1513" fill="#59685f" font-family="Arial,sans-serif" font-size="24">may be eaten through the next</text>
  <text x="150" y="1543" fill="#59685f" font-family="Arial,sans-serif" font-size="24">day; third-day remains are</text>
  <text x="150" y="1573" fill="#59685f" font-family="Arial,sans-serif" font-size="24">burned, and uncleanness bars</text>
  <text x="150" y="1603" fill="#59685f" font-family="Arial,sans-serif" font-size="24">eating.</text>
  <path d="M335 1653V1703" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1854" x2="120" y2="1854" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1713" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1854" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1756" fill="#172d27" font-family="Georgia,serif" font-size="30">Do not eat the fat or</text>
  <text x="150" y="1792" fill="#172d27" font-family="Georgia,serif" font-size="30">blood</text>
  <text x="150" y="1831" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 7:22–27</text>
  <text x="150" y="1865" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel is forbidden to eat</text>
  <text x="150" y="1895" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sacrificial fat or blood; fat</text>
  <text x="150" y="1925" fill="#59685f" font-family="Arial,sans-serif" font-size="24">from animals found dead or</text>
  <text x="150" y="1955" fill="#59685f" font-family="Arial,sans-serif" font-size="24">torn may be used otherwise.</text>
  <path d="M335 2005V2055" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2221" x2="120" y2="2221" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2065" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2221" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2108" fill="#172d27" font-family="Georgia,serif" font-size="30">The breast and right</text>
  <text x="150" y="2144" fill="#172d27" font-family="Georgia,serif" font-size="30">shoulder</text>
  <text x="150" y="2183" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 7:28–36</text>
  <text x="150" y="2217" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The worshipper presents the</text>
  <text x="150" y="2247" fill="#59685f" font-family="Arial,sans-serif" font-size="24">breast and fat; the wave</text>
  <text x="150" y="2277" fill="#59685f" font-family="Arial,sans-serif" font-size="24">breast and right shoulder are</text>
  <text x="150" y="2307" fill="#59685f" font-family="Arial,sans-serif" font-size="24">assigned to Aaron and his</text>
  <text x="150" y="2337" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sons.</text>
  <path d="M335 2387V2437" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2588" x2="120" y2="2588" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2447" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2588" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2490" fill="#172d27" font-family="Georgia,serif" font-size="30">Summary of offering</text>
  <text x="150" y="2526" fill="#172d27" font-family="Georgia,serif" font-size="30">laws</text>
  <text x="150" y="2565" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 7:37–38</text>
  <text x="150" y="2599" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The closing list names the</text>
  <text x="150" y="2629" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offering laws and locates</text>
  <text x="150" y="2659" fill="#59685f" font-family="Arial,sans-serif" font-size="24">their command at Sinai in the</text>
  <text x="150" y="2689" fill="#59685f" font-family="Arial,sans-serif" font-size="24">wilderness.</text>
  <text x="120" y="2789" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
