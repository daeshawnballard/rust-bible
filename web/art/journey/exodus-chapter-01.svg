<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2364" viewBox="0 0 1536 2364" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 1 · Chapter outline</title>
  <desc id="desc">A vertical column of 6 text cards partitions all 22 verses in Exodus 1. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2364" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 1 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 1:1–22 · 6 source-based reading stages</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel grows; Joseph’s</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">generation dies</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 1:1–7</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Jacob’s sons enter Egypt</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">with their households;</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Joseph and his generation</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">die, and Israel multiplies.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="738" x2="120" y2="738" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="738" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">A new king fears</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel’s growth</text>
  <text x="150" y="715" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 1:8–10</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A new king fears Israel’s</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">growth and proposes</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">measures to keep them from</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">joining Egypt’s enemies.</text>
  <path d="M335 889V939" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1090" x2="120" y2="1090" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="949" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1090" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">Taskmasters build</text>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">Pithom and Raamses</text>
  <text x="150" y="1067" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 1:11</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Taskmasters set over Israel</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">force them to build</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh’s store cities,</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pithom and Raamses.</text>
  <path d="M335 1241V1291" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1427" x2="120" y2="1427" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1301" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1427" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1344" fill="#172d27" font-family="Georgia,serif" font-size="30">Affliction increases,</text>
  <text x="150" y="1380" fill="#172d27" font-family="Georgia,serif" font-size="30">but Israel multiplies</text>
  <text x="150" y="1419" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 1:12–14</text>
  <text x="150" y="1453" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Shows the stated contrast</text>
  <text x="150" y="1483" fill="#59685f" font-family="Arial,sans-serif" font-size="24">between hard service and</text>
  <text x="150" y="1513" fill="#59685f" font-family="Arial,sans-serif" font-size="24">continued growth.</text>
  <path d="M335 1563V1613" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1752" x2="120" y2="1752" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1623" width="430" height="258" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1752" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1666" fill="#172d27" font-family="Georgia,serif" font-size="30">Shiphrah and Puah</text>
  <text x="150" y="1702" fill="#172d27" font-family="Georgia,serif" font-size="30">refuse the king’s</text>
  <text x="150" y="1738" fill="#172d27" font-family="Georgia,serif" font-size="30">command</text>
  <text x="150" y="1777" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 1:15–21</text>
  <text x="150" y="1811" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Midwives refuse the order;</text>
  <text x="150" y="1841" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the king questions them.</text>
  <path d="M335 1891V1941" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2110" x2="120" y2="2110" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1951" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2110" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1994" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh orders Hebrew</text>
  <text x="150" y="2030" fill="#172d27" font-family="Georgia,serif" font-size="30">sons cast into the</text>
  <text x="150" y="2066" fill="#172d27" font-family="Georgia,serif" font-size="30">Nile</text>
  <text x="150" y="2105" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 1:22</text>
  <text x="150" y="2139" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh orders every son</text>
  <text x="150" y="2169" fill="#59685f" font-family="Arial,sans-serif" font-size="24">born to the Hebrews cast</text>
  <text x="150" y="2199" fill="#59685f" font-family="Arial,sans-serif" font-size="24">into the river, while every</text>
  <text x="150" y="2229" fill="#59685f" font-family="Arial,sans-serif" font-size="24">daughter is to live.</text>
  <text x="120" y="2329" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
