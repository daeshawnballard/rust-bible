<text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">The rod becomes a serpent and a rod again</text>
<text x="120" y="145" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 4:2–4 · selected text relationships</text>
