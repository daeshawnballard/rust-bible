<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1868" viewBox="0 0 1536 1868" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 18 · Chapter outline</title>
  <desc id="desc">A vertical column of 5 text cards partitions all 27 verses in Exodus 18. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1868" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 18 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 18:1–27 · 5 source-based reading stages</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Jethro arrives with</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses' family</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 18:1–6</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Jethro brings Zipporah and</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses’s two sons after</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">hearing what God has done.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="708" x2="120" y2="708" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="708" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">Reunion, report, and</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">shared meal</text>
  <text x="150" y="685" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 18:7–12</text>
  <text x="150" y="719" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses reports deliverance;</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Jethro blesses the LORD and</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">shares a meal with the</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">elders.</text>
  <path d="M335 859V909" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1027" x2="120" y2="1027" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="919" width="430" height="216" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1027" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="962" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses hears cases</text>
  <text x="150" y="1001" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 18:13–16</text>
  <text x="150" y="1035" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses judges disputes from</text>
  <text x="150" y="1065" fill="#59685f" font-family="Arial,sans-serif" font-size="24">morning to evening and</text>
  <text x="150" y="1095" fill="#59685f" font-family="Arial,sans-serif" font-size="24">teaches God’s statutes.</text>
  <path d="M335 1145V1195" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1346" x2="120" y2="1346" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1205" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1346" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1248" fill="#172d27" font-family="Georgia,serif" font-size="30">Jethro proposes shared</text>
  <text x="150" y="1284" fill="#172d27" font-family="Georgia,serif" font-size="30">judging</text>
  <text x="150" y="1323" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 18:17–23</text>
  <text x="150" y="1357" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Jethro calls Moses’s load</text>
  <text x="150" y="1387" fill="#59685f" font-family="Arial,sans-serif" font-size="24">too heavy and advises</text>
  <text x="150" y="1417" fill="#59685f" font-family="Arial,sans-serif" font-size="24">appointing judges if God</text>
  <text x="150" y="1447" fill="#59685f" font-family="Arial,sans-serif" font-size="24">commands.</text>
  <path d="M335 1497V1547" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1665" x2="120" y2="1665" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1557" width="430" height="216" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1665" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1600" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses appoints rulers</text>
  <text x="150" y="1639" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 18:24–27</text>
  <text x="150" y="1673" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses appoints judges; they</text>
  <text x="150" y="1703" fill="#59685f" font-family="Arial,sans-serif" font-size="24">hear smaller cases, while</text>
  <text x="150" y="1733" fill="#59685f" font-family="Arial,sans-serif" font-size="24">difficult cases go to him.</text>
  <text x="120" y="1833" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
