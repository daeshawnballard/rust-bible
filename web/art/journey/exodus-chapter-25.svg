<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1654" viewBox="0 0 1536 1654" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 25 · Chapter outline</title>
  <desc id="desc">A vertical column of 4 text cards partitions all 40 verses in Exodus 25. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1654" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 25 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 25:1–40 · 4 source-based reading stages</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Willing materials and</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">sanctuary purpose</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 25:1–9</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD requests willing</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">gifts to build a sanctuary</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and gives Moses its</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">pattern.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="738" x2="120" y2="738" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="738" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">Ark, testimony, mercy</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">seat, and cherubim</text>
  <text x="150" y="715" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 25:10–22</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The ark holds the</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">testimony; a gold mercy</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">seat with cherubim covers</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">it.</text>
  <path d="M335 889V939" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1075" x2="120" y2="1075" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="949" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1075" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">Table, vessels, and</text>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">continual shewbread</text>
  <text x="150" y="1067" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 25:23–30</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A gold-covered table is set</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">with vessels and continual</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">shewbread.</text>
  <path d="M335 1211V1261" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1415" x2="120" y2="1415" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1271" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1415" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1314" fill="#172d27" font-family="Georgia,serif" font-size="30">Golden lampstand,</text>
  <text x="150" y="1350" fill="#172d27" font-family="Georgia,serif" font-size="30">seven lamps, and</text>
  <text x="150" y="1386" fill="#172d27" font-family="Georgia,serif" font-size="30">utensils</text>
  <text x="150" y="1425" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 25:31–40</text>
  <text x="150" y="1459" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A beaten-gold lampstand has</text>
  <text x="150" y="1489" fill="#59685f" font-family="Arial,sans-serif" font-size="24">six branches, seven lamps,</text>
  <text x="150" y="1519" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and utensils.</text>
  <text x="120" y="1619" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
