<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Rod signs before Pharaoh</title>
  <desc id="desc">Three cards show Exodus 7:10–12 in order: Aaron casts down his rod, the Egyptian magicians cast down theirs, and Aaron’s rod swallows theirs. Green arrows mark the sequence; the events are not shown as one instant.</desc>
  <rect width="1536" height="1024" fill="#f7f5ee"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#29664d"/>
    </marker>
  </defs>

  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">The rods before Pharaoh</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 7:8–13 · ordered events, not one instant</text>

  <rect x="120" y="245" width="430" height="170" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <text x="150" y="293" fill="#172d27" font-family="Georgia,serif" font-size="30">Aaron casts down the rod</text>
  <text x="150" y="349" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The sign begins before</text>
  <text x="150" y="376" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh and his servants</text>
  <text x="526" y="400" text-anchor="end" fill="#29664d" font-family="Arial,sans-serif" font-size="22">7:10</text>

  <path d="M335 423V467" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="120" y="485" width="430" height="170" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <text x="150" y="522" fill="#172d27" font-family="Georgia,serif" font-size="30">The magicians cast</text>
  <text x="150" y="550" fill="#172d27" font-family="Georgia,serif" font-size="30">theirs down</text>
  <text x="150" y="585" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Their rods become serpents</text>
  <text x="150" y="612" fill="#59685f" font-family="Arial,sans-serif" font-size="24">by enchantments</text>
  <text x="526" y="640" text-anchor="end" fill="#29664d" font-family="Arial,sans-serif" font-size="22">7:11–12</text>

  <path d="M335 663V707" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="120" y="725" width="430" height="170" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <text x="150" y="762" fill="#172d27" font-family="Georgia,serif" font-size="30">Aaron’s rod swallows</text>
  <text x="150" y="790" fill="#172d27" font-family="Georgia,serif" font-size="30">theirs</text>
  <text x="150" y="825" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The event follows their</text>
  <text x="150" y="852" fill="#59685f" font-family="Arial,sans-serif" font-size="24">imitation</text>
  <text x="526" y="880" text-anchor="end" fill="#29664d" font-family="Arial,sans-serif" font-size="22">7:12</text>

  <text x="120" y="952" fill="#59685f" font-family="Arial,sans-serif" font-size="22">The arrows preserve the order of the narrated actions.</text>
</svg>
