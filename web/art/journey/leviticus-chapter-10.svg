  <text x="150" y="1434" fill="#172d27" font-family="Georgia,serif" font-size="30">Offerings due to the</text>
  <text x="150" y="1470" fill="#172d27" font-family="Georgia,serif" font-size="30">priests</text>
  <text x="150" y="1509" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 10:12–15</text>
  <text x="150" y="1543" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses directs Aaron's</text>
  <text x="150" y="1573" fill="#59685f" font-family="Arial,sans-serif" font-size="24">household to eat the</text>
  <text x="150" y="1603" fill="#59685f" font-family="Arial,sans-serif" font-size="24">remaining grain offering and</text>
  <text x="150" y="1633" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the peace-offering portions</text>
  <text x="150" y="1663" fill="#59685f" font-family="Arial,sans-serif" font-size="24">in the prescribed places.</text>
  <path d="M335 1713V1763" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1914" x2="120" y2="1914" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1773" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1914" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1816" fill="#172d27" font-family="Georgia,serif" font-size="30">Goat offering and</text>
  <text x="150" y="1852" fill="#172d27" font-family="Georgia,serif" font-size="30">Aaron's reply</text>
  <text x="150" y="1891" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 10:16–20</text>
  <text x="150" y="1925" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses finds the goat offering</text>
  <text x="150" y="1955" fill="#59685f" font-family="Arial,sans-serif" font-size="24">burned and questions Eleazar</text>
  <text x="150" y="1985" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and Ithamar; Aaron explains,</text>
  <text x="150" y="2015" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and Moses accepts his answer.</text>
