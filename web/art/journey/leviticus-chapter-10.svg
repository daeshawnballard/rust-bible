  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 10:1–3</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Nadab and Abihu bring</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">uncommanded fire; they die</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">before the LORD, Moses speaks</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to Aaron, and Aaron is</text>
  <text x="150" y="517" fill="#59685f" font-family="Arial,sans-serif" font-size="24">silent.</text>
