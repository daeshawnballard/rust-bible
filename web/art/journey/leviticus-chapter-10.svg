  <text x="150" y="745" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 10:4–7</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Mishael and Elzaphan carry</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the dead out. Moses restricts</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron's household mourning</text>
  <text x="150" y="869" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and departure from the tent;</text>
  <text x="150" y="899" fill="#59685f" font-family="Arial,sans-serif" font-size="24">they comply.</text>
  <path d="M335 949V999" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1165" x2="120" y2="1165" stroke="#29664d" stroke-width="3"/>
