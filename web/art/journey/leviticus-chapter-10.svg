  <text x="150" y="1052" fill="#172d27" font-family="Georgia,serif" font-size="30">Priestly service and</text>
  <text x="150" y="1088" fill="#172d27" font-family="Georgia,serif" font-size="30">teaching</text>
  <text x="150" y="1127" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 10:8–11</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD restricts wine and</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">strong drink during service</text>
  <text x="150" y="1221" fill="#59685f" font-family="Arial,sans-serif" font-size="24">so priests distinguish</text>
  <text x="150" y="1251" fill="#59685f" font-family="Arial,sans-serif" font-size="24">holy/common and clean/unclean</text>
  <text x="150" y="1281" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and teach statutes.</text>
