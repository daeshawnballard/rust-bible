  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Priestly service, loss, and discernment · Leviticus 10:1–20 · 5</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">source-based units</text>
