<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2620" viewBox="0 0 1536 2620" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 27 · Chapter outline</title>
  <desc id="desc">A vertical column of 7 text cards partitions all 34 verses in Leviticus 27. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2620" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 27 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Vows, valuations, and tithes · Leviticus 27:1–34 · 7 source-based</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">units</text>
  <line x1="88" y1="368" x2="120" y2="368" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="368" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Valuing a person vowed</text>
  <text x="150" y="327" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 27:1–8</text>
  <text x="150" y="361" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Priestly estimates for a</text>
  <text x="150" y="391" fill="#59685f" font-family="Arial,sans-serif" font-size="24">person vowed to the LORD vary</text>
  <text x="150" y="421" fill="#59685f" font-family="Arial,sans-serif" font-size="24">by age and sex, with an</text>
  <text x="150" y="451" fill="#59685f" font-family="Arial,sans-serif" font-size="24">adjustment for poverty.</text>
  <path d="M335 501V551" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="684" x2="120" y2="684" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="561" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="684" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="604" fill="#172d27" font-family="Georgia,serif" font-size="30">Vowed animals</text>
  <text x="150" y="643" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 27:9–13</text>
  <text x="150" y="677" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Animals suitable for</text>
  <text x="150" y="707" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offerings become holy; other</text>
  <text x="150" y="737" fill="#59685f" font-family="Arial,sans-serif" font-size="24">animals are assessed, and</text>
  <text x="150" y="767" fill="#59685f" font-family="Arial,sans-serif" font-size="24">redemption adds a fifth.</text>
  <path d="M335 817V867" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1000" x2="120" y2="1000" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="877" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1000" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="920" fill="#172d27" font-family="Georgia,serif" font-size="30">A dedicated house</text>
  <text x="150" y="959" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 27:14–15</text>
  <text x="150" y="993" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A house dedicated to the LORD</text>
  <text x="150" y="1023" fill="#59685f" font-family="Arial,sans-serif" font-size="24">is appraised by a priest and</text>
  <text x="150" y="1053" fill="#59685f" font-family="Arial,sans-serif" font-size="24">costs one fifth more to</text>
  <text x="150" y="1083" fill="#59685f" font-family="Arial,sans-serif" font-size="24">redeem.</text>
  <path d="M335 1133V1183" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1349" x2="120" y2="1349" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1193" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1349" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1236" fill="#172d27" font-family="Georgia,serif" font-size="30">Fields and the Jubilee</text>
  <text x="150" y="1272" fill="#172d27" font-family="Georgia,serif" font-size="30">year</text>
  <text x="150" y="1311" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 27:16–25</text>
  <text x="150" y="1345" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Field valuations depend on</text>
  <text x="150" y="1375" fill="#59685f" font-family="Arial,sans-serif" font-size="24">seed and years remaining to</text>
  <text x="150" y="1405" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Jubilee; inherited and</text>
  <text x="150" y="1435" fill="#59685f" font-family="Arial,sans-serif" font-size="24">purchased fields follow</text>
  <text x="150" y="1465" fill="#59685f" font-family="Arial,sans-serif" font-size="24">different rules.</text>
  <path d="M335 1515V1565" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1731" x2="120" y2="1731" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1575" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1731" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1618" fill="#172d27" font-family="Georgia,serif" font-size="30">Firstlings and devoted</text>
  <text x="150" y="1654" fill="#172d27" font-family="Georgia,serif" font-size="30">things</text>
  <text x="150" y="1693" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 27:26–29</text>
  <text x="150" y="1727" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Firstborn animals are already</text>
  <text x="150" y="1757" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the LORD's; devoted property</text>
  <text x="150" y="1787" fill="#59685f" font-family="Arial,sans-serif" font-size="24">cannot be redeemed, and a</text>
  <text x="150" y="1817" fill="#59685f" font-family="Arial,sans-serif" font-size="24">separate sanction is stated</text>
  <text x="150" y="1847" fill="#59685f" font-family="Arial,sans-serif" font-size="24">for devoted persons.</text>
  <path d="M335 1897V1947" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2098" x2="120" y2="2098" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1957" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2098" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2000" fill="#172d27" font-family="Georgia,serif" font-size="30">Tithes from land and</text>
  <text x="150" y="2036" fill="#172d27" font-family="Georgia,serif" font-size="30">herds</text>
  <text x="150" y="2075" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 27:30–33</text>
  <text x="150" y="2109" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A fifth is added when land</text>
  <text x="150" y="2139" fill="#59685f" font-family="Arial,sans-serif" font-size="24">tithe is redeemed; every</text>
  <text x="150" y="2169" fill="#59685f" font-family="Arial,sans-serif" font-size="24">tenth herd or flock animal is</text>
  <text x="150" y="2199" fill="#59685f" font-family="Arial,sans-serif" font-size="24">holy and cannot be exchanged.</text>
  <path d="M335 2249V2299" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2417" x2="120" y2="2417" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2309" width="430" height="216" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2417" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2352" fill="#172d27" font-family="Georgia,serif" font-size="30">Closing statement</text>
  <text x="150" y="2391" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 27:34</text>
  <text x="150" y="2425" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The final verse says these</text>
  <text x="150" y="2455" fill="#59685f" font-family="Arial,sans-serif" font-size="24">commands were given to Moses</text>
  <text x="150" y="2485" fill="#59685f" font-family="Arial,sans-serif" font-size="24">for Israel at Mount Sinai.</text>
  <text x="120" y="2585" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
