<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1964" viewBox="0 0 1536 1964" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 13 · Chapter outline</title>
  <desc id="desc">A vertical column of 5 text cards partitions all 22 verses in Exodus 13. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1964" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 13 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 13:1–22 · 5 source-based reading stages</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Firstborn dedicated to</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">the LORD</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 13:1–2</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD claims Israel's</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">firstborn, human and</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">animal, as holy to him.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="708" x2="120" y2="708" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="708" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">Unleavened bread</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">recalls deliverance</text>
  <text x="150" y="685" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 13:3–10</text>
  <text x="150" y="719" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel keeps the</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">unleavened-bread feast and</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">teaches that the LORD</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">brought them from Egypt.</text>
  <path d="M335 859V909" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1060" x2="120" y2="1060" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="919" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1060" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="962" fill="#172d27" font-family="Georgia,serif" font-size="30">Firstborn redemption</text>
  <text x="150" y="998" fill="#172d27" font-family="Georgia,serif" font-size="30">rules</text>
  <text x="150" y="1037" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 13:11–13</text>
  <text x="150" y="1071" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Set apart firstborn males;</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">redeem a firstling ass with</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">a lamb and redeem human</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">firstborn.</text>
  <path d="M335 1211V1261" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1394" x2="120" y2="1394" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1271" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1394" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1314" fill="#172d27" font-family="Georgia,serif" font-size="30">A child asks why</text>
  <text x="150" y="1353" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 13:14–16</text>
  <text x="150" y="1387" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A child asks about the</text>
  <text x="150" y="1417" fill="#59685f" font-family="Arial,sans-serif" font-size="24">firstborn practice; the</text>
  <text x="150" y="1447" fill="#59685f" font-family="Arial,sans-serif" font-size="24">answer recalls the LORD’s</text>
  <text x="150" y="1477" fill="#59685f" font-family="Arial,sans-serif" font-size="24">deliverance.</text>
  <path d="M335 1527V1577" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1728" x2="120" y2="1728" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1587" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1728" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1630" fill="#172d27" font-family="Georgia,serif" font-size="30">Departure guided by</text>
  <text x="150" y="1666" fill="#172d27" font-family="Georgia,serif" font-size="30">cloud and fire</text>
  <text x="150" y="1705" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 13:17–22</text>
  <text x="150" y="1739" fill="#59685f" font-family="Arial,sans-serif" font-size="24">God leads Israel from the</text>
  <text x="150" y="1769" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Philistine road; Moses</text>
  <text x="150" y="1799" fill="#59685f" font-family="Arial,sans-serif" font-size="24">carries Joseph’s bones;</text>
  <text x="150" y="1829" fill="#59685f" font-family="Arial,sans-serif" font-size="24">cloud and fire guide.</text>
  <text x="120" y="1929" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
