<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2090" viewBox="0 0 1536 2090" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 22 · Chapter outline</title>
  <desc id="desc">A vertical column of 5 text cards partitions all 33 verses in Leviticus 22. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2090" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 22 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Care for holy things and offerings · Leviticus 22:1–33 · 5</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">source-based units</text>
  <line x1="88" y1="401" x2="120" y2="401" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="401" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Eligibility and</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">temporary uncleanness</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 22:1–9</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Priests must protect holy</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">things; specified uncleanness</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">temporarily bars eating them,</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and self-dead or torn animals</text>
  <text x="150" y="517" fill="#59685f" font-family="Arial,sans-serif" font-size="24">are excluded.</text>
  <path d="M335 567V617" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="750" x2="120" y2="750" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="627" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="750" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="670" fill="#172d27" font-family="Georgia,serif" font-size="30">Who may eat holy food</text>
  <text x="150" y="709" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 22:10–16</text>
  <text x="150" y="743" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text limits who may eat</text>
  <text x="150" y="773" fill="#59685f" font-family="Arial,sans-serif" font-size="24">priestly holy food and</text>
  <text x="150" y="803" fill="#59685f" font-family="Arial,sans-serif" font-size="24">requires restitution for an</text>
  <text x="150" y="833" fill="#59685f" font-family="Arial,sans-serif" font-size="24">unwitting eater.</text>
  <path d="M335 883V933" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1102" x2="120" y2="1102" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="943" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1102" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="986" fill="#172d27" font-family="Georgia,serif" font-size="30">Offerings without</text>
  <text x="150" y="1022" fill="#172d27" font-family="Georgia,serif" font-size="30">disqualifying</text>
  <text x="150" y="1058" fill="#172d27" font-family="Georgia,serif" font-size="30">blemishes</text>
  <text x="150" y="1097" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 22:17–25</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Voluntary and vowed animal</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offerings must meet stated</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">standards, with a narrow</text>
  <text x="150" y="1221" fill="#59685f" font-family="Arial,sans-serif" font-size="24">exception for freewill gifts.</text>
  <path d="M335 1271V1321" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1487" x2="120" y2="1487" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1331" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1487" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1374" fill="#172d27" font-family="Georgia,serif" font-size="30">Age, pairing, and</text>
  <text x="150" y="1410" fill="#172d27" font-family="Georgia,serif" font-size="30">thanksgiving rules</text>
  <text x="150" y="1449" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 22:26–30</text>
  <text x="150" y="1483" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Newborn animals remain with</text>
  <text x="150" y="1513" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the dam seven days; parent</text>
  <text x="150" y="1543" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and young are not killed the</text>
  <text x="150" y="1573" fill="#59685f" font-family="Arial,sans-serif" font-size="24">same day, and thanksgiving</text>
  <text x="150" y="1603" fill="#59685f" font-family="Arial,sans-serif" font-size="24">food is eaten that day.</text>
  <path d="M335 1653V1703" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1854" x2="120" y2="1854" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1713" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1854" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1756" fill="#172d27" font-family="Georgia,serif" font-size="30">Keep and honor the</text>
  <text x="150" y="1792" fill="#172d27" font-family="Georgia,serif" font-size="30">commands</text>
  <text x="150" y="1831" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 22:31–33</text>
  <text x="150" y="1865" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel must keep the</text>
  <text x="150" y="1895" fill="#59685f" font-family="Arial,sans-serif" font-size="24">commandments and hallow the</text>
  <text x="150" y="1925" fill="#59685f" font-family="Arial,sans-serif" font-size="24">LORD, who brought them from</text>
  <text x="150" y="1955" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Egypt.</text>
  <text x="120" y="2055" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
