<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2316" viewBox="0 0 1536 2316" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 22 · Chapter outline</title>
  <desc id="desc">A vertical column of 6 text cards partitions all 31 verses in Exodus 22. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2316" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 22 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 22:1–31 · 6 source-based reading stages</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Theft and property</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">damage</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 22:1–6</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Restitution rules address</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">stolen livestock, a thief,</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">grazing another's field,</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and damage caused by fire.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="738" x2="120" y2="738" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="738" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">Entrusted or borrowed</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">property</text>
  <text x="150" y="715" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 22:7–15</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Rules address entrusted</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">goods, disputes, animals</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">kept for others, and</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">borrowed property.</text>
  <path d="M335 889V939" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1090" x2="120" y2="1090" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="949" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1090" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">Obligation after</text>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">enticement</text>
  <text x="150" y="1067" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 22:16–17</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The man must provide a</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">dowry; if her father</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">refuses marriage, he still</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">pays.</text>
  <path d="M335 1241V1291" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1409" x2="120" y2="1409" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1301" width="430" height="216" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1409" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1344" fill="#172d27" font-family="Georgia,serif" font-size="30">Forbidden practices</text>
  <text x="150" y="1383" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 22:18–20</text>
  <text x="150" y="1417" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text prohibits sorcery,</text>
  <text x="150" y="1447" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sex with an animal, and</text>
  <text x="150" y="1477" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sacrifice to another god.</text>
  <path d="M335 1527V1577" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1728" x2="120" y2="1728" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1587" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1728" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1630" fill="#172d27" font-family="Georgia,serif" font-size="30">Protect strangers and</text>
  <text x="150" y="1666" fill="#172d27" font-family="Georgia,serif" font-size="30">vulnerable neighbors</text>
  <text x="150" y="1705" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 22:21–27</text>
  <text x="150" y="1739" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The law protects strangers,</text>
  <text x="150" y="1769" fill="#59685f" font-family="Arial,sans-serif" font-size="24">widows, orphans, poor</text>
  <text x="150" y="1799" fill="#59685f" font-family="Arial,sans-serif" font-size="24">borrowers, and pledged</text>
  <text x="150" y="1829" fill="#59685f" font-family="Arial,sans-serif" font-size="24">garments.</text>
  <path d="M335 1879V1929" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2080" x2="120" y2="2080" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1939" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2080" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1982" fill="#172d27" font-family="Georgia,serif" font-size="30">First gifts and holy</text>
  <text x="150" y="2018" fill="#172d27" font-family="Georgia,serif" font-size="30">conduct</text>
  <text x="150" y="2057" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 22:28–31</text>
  <text x="150" y="2091" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel must honor God, give</text>
  <text x="150" y="2121" fill="#59685f" font-family="Arial,sans-serif" font-size="24">first produce and</text>
  <text x="150" y="2151" fill="#59685f" font-family="Arial,sans-serif" font-size="24">firstborn, and reject flesh</text>
  <text x="150" y="2181" fill="#59685f" font-family="Arial,sans-serif" font-size="24">torn by beasts.</text>
  <text x="120" y="2281" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
