<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1612" viewBox="0 0 1536 1612" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 17 · Chapter outline</title>
  <desc id="desc">A vertical column of 4 text cards partitions all 16 verses in Exodus 17. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1612" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 17 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 17:1–16 · 4 source-based reading stages</text>
  <line x1="88" y1="353" x2="120" y2="353" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="216" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="353" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Thirst at Rephidim</text>
  <text x="150" y="327" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 17:1–4</text>
  <text x="150" y="361" fill="#59685f" font-family="Arial,sans-serif" font-size="24">At Rephidim, Israel lacks</text>
  <text x="150" y="391" fill="#59685f" font-family="Arial,sans-serif" font-size="24">water, disputes with Moses,</text>
  <text x="150" y="421" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and asks for a drink.</text>
  <path d="M335 471V521" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="672" x2="120" y2="672" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="531" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="672" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="574" fill="#172d27" font-family="Georgia,serif" font-size="30">Water from the rock at</text>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">Horeb</text>
  <text x="150" y="649" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 17:5–7</text>
  <text x="150" y="683" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD tells Moses to</text>
  <text x="150" y="713" fill="#59685f" font-family="Arial,sans-serif" font-size="24">strike Horeb’s rock; water</text>
  <text x="150" y="743" fill="#59685f" font-family="Arial,sans-serif" font-size="24">flows, and the place is</text>
  <text x="150" y="773" fill="#59685f" font-family="Arial,sans-serif" font-size="24">named.</text>
  <path d="M335 823V873" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1024" x2="120" y2="1024" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="883" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1024" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="926" fill="#172d27" font-family="Georgia,serif" font-size="30">Joshua fights; Moses</text>
  <text x="150" y="962" fill="#172d27" font-family="Georgia,serif" font-size="30">is supported</text>
  <text x="150" y="1001" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 17:8–13</text>
  <text x="150" y="1035" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Joshua fights Amalek; Aaron</text>
  <text x="150" y="1065" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and Hur support Moses’s</text>
  <text x="150" y="1095" fill="#59685f" font-family="Arial,sans-serif" font-size="24">raised hands until Israel</text>
  <text x="150" y="1125" fill="#59685f" font-family="Arial,sans-serif" font-size="24">prevails.</text>
  <path d="M335 1175V1225" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1376" x2="120" y2="1376" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1235" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1376" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1278" fill="#172d27" font-family="Georgia,serif" font-size="30">Battle memorial and</text>
  <text x="150" y="1314" fill="#172d27" font-family="Georgia,serif" font-size="30">ongoing conflict</text>
  <text x="150" y="1353" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 17:14–16</text>
  <text x="150" y="1387" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses writes a memorial,</text>
  <text x="150" y="1417" fill="#59685f" font-family="Arial,sans-serif" font-size="24">names an altar</text>
  <text x="150" y="1447" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Jehovah-nissi, and warns of</text>
  <text x="150" y="1477" fill="#59685f" font-family="Arial,sans-serif" font-size="24">continuing conflict.</text>
  <text x="120" y="1577" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
