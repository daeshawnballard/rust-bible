<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2992" viewBox="0 0 1536 2992" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 14 · Chapter outline</title>
  <desc id="desc">A vertical column of 7 text cards partitions all 57 verses in Leviticus 14. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2992" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 14 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Ritual restoration and house signs · Leviticus 14:1–57 · 7</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">source-based units</text>
  <line x1="88" y1="416" x2="120" y2="416" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="342" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="416" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Initial cleansing rite</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">for a person</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 14:1–9</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">After the priest sees the</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sign healed, the text</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">outlines birds, water,</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">washing, shaving, and staged</text>
  <text x="150" y="517" fill="#59685f" font-family="Arial,sans-serif" font-size="24">return to camp over seven</text>
  <text x="150" y="547" fill="#59685f" font-family="Arial,sans-serif" font-size="24">days.</text>
  <path d="M335 597V647" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="813" x2="120" y2="813" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="657" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="813" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="700" fill="#172d27" font-family="Georgia,serif" font-size="30">Eighth-day offerings</text>
  <text x="150" y="736" fill="#172d27" font-family="Georgia,serif" font-size="30">and rite</text>
  <text x="150" y="775" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 14:10–20</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">On day eight, the priest</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">presents offerings and</text>
  <text x="150" y="869" fill="#59685f" font-family="Arial,sans-serif" font-size="24">applies blood and oil at the</text>
  <text x="150" y="899" fill="#59685f" font-family="Arial,sans-serif" font-size="24">ear, thumb, and toe before</text>
  <text x="150" y="929" fill="#59685f" font-family="Arial,sans-serif" font-size="24">making the offerings.</text>
  <path d="M335 979V1029" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1195" x2="120" y2="1195" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1039" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1195" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1082" fill="#172d27" font-family="Georgia,serif" font-size="30">Offering for limited</text>
  <text x="150" y="1118" fill="#172d27" font-family="Georgia,serif" font-size="30">means</text>
  <text x="150" y="1157" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 14:21–32</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A person unable to provide</text>
  <text x="150" y="1221" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the full offering brings one</text>
  <text x="150" y="1251" fill="#59685f" font-family="Arial,sans-serif" font-size="24">lamb, measured flour and oil,</text>
  <text x="150" y="1281" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and two birds; the priest</text>
  <text x="150" y="1311" fill="#59685f" font-family="Arial,sans-serif" font-size="24">follows the stated rite.</text>
  <path d="M335 1361V1411" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1592" x2="120" y2="1592" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1421" width="430" height="342" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1592" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1464" fill="#172d27" font-family="Georgia,serif" font-size="30">First house inspection</text>
  <text x="150" y="1500" fill="#172d27" font-family="Georgia,serif" font-size="30">and repair</text>
  <text x="150" y="1539" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 14:33–42</text>
  <text x="150" y="1573" fill="#59685f" font-family="Arial,sans-serif" font-size="24">For a suspected house sign,</text>
  <text x="150" y="1603" fill="#59685f" font-family="Arial,sans-serif" font-size="24">contents are removed, the</text>
  <text x="150" y="1633" fill="#59685f" font-family="Arial,sans-serif" font-size="24">house is shut for seven days,</text>
  <text x="150" y="1663" fill="#59685f" font-family="Arial,sans-serif" font-size="24">then affected stones and</text>
  <text x="150" y="1693" fill="#59685f" font-family="Arial,sans-serif" font-size="24">plaster are removed and</text>
  <text x="150" y="1723" fill="#59685f" font-family="Arial,sans-serif" font-size="24">replaced if it has spread.</text>
  <path d="M335 1773V1823" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2004" x2="120" y2="2004" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1833" width="430" height="342" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2004" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1876" fill="#172d27" font-family="Georgia,serif" font-size="30">Recurrence and house</text>
  <text x="150" y="1912" fill="#172d27" font-family="Georgia,serif" font-size="30">ruling</text>
  <text x="150" y="1951" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 14:43–48</text>
  <text x="150" y="1985" fill="#59685f" font-family="Arial,sans-serif" font-size="24">If the sign returns, the</text>
  <text x="150" y="2015" fill="#59685f" font-family="Arial,sans-serif" font-size="24">house is declared unclean and</text>
  <text x="150" y="2045" fill="#59685f" font-family="Arial,sans-serif" font-size="24">dismantled; if it has not</text>
  <text x="150" y="2075" fill="#59685f" font-family="Arial,sans-serif" font-size="24">spread after replastering,</text>
  <text x="150" y="2105" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the priest pronounces it</text>
  <text x="150" y="2135" fill="#59685f" font-family="Arial,sans-serif" font-size="24">clean.</text>
  <path d="M335 2185V2235" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2383" x2="120" y2="2383" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2245" width="430" height="276" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2383" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2288" fill="#172d27" font-family="Georgia,serif" font-size="30">House-cleansing rite</text>
  <text x="150" y="2327" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 14:49–53</text>
  <text x="150" y="2361" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The priest uses two birds,</text>
  <text x="150" y="2391" fill="#59685f" font-family="Arial,sans-serif" font-size="24">running water, cedar,</text>
  <text x="150" y="2421" fill="#59685f" font-family="Arial,sans-serif" font-size="24">scarlet, and hyssop, releases</text>
  <text x="150" y="2451" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the living bird, and</text>
  <text x="150" y="2481" fill="#59685f" font-family="Arial,sans-serif" font-size="24">pronounces the house clean.</text>
  <path d="M335 2531V2581" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2744" x2="120" y2="2744" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2591" width="430" height="306" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2744" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2634" fill="#172d27" font-family="Georgia,serif" font-size="30">Summary of these laws</text>
  <text x="150" y="2673" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 14:54–57</text>
  <text x="150" y="2707" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The closing verses recap</text>
  <text x="150" y="2737" fill="#59685f" font-family="Arial,sans-serif" font-size="24">signs on skin, hair,</text>
  <text x="150" y="2767" fill="#59685f" font-family="Arial,sans-serif" font-size="24">garments, and houses and</text>
  <text x="150" y="2797" fill="#59685f" font-family="Arial,sans-serif" font-size="24">state the purpose: teach when</text>
  <text x="150" y="2827" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the text calls clean or</text>
  <text x="150" y="2857" fill="#59685f" font-family="Arial,sans-serif" font-size="24">unclean.</text>
  <text x="120" y="2957" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
