<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="3260" viewBox="0 0 1536 3260" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 11 · Chapter outline</title>
  <desc id="desc">A vertical column of 8 text cards partitions all 47 verses in Leviticus 11. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="3260" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 11 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Food categories and ritual cleanness · Leviticus 11:1–47 · 8</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">source-based units</text>
  <line x1="88" y1="401" x2="120" y2="401" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="401" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Land-animal</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">classification</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 11:1–8</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text permits land animals</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">meeting both hoof and cud</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">criteria and names examples</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">excluded when one feature is</text>
  <text x="150" y="517" fill="#59685f" font-family="Arial,sans-serif" font-size="24">absent.</text>
  <path d="M335 567V617" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="783" x2="120" y2="783" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="627" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="783" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="670" fill="#172d27" font-family="Georgia,serif" font-size="30">Water-creature</text>
  <text x="150" y="706" fill="#172d27" font-family="Georgia,serif" font-size="30">classification</text>
  <text x="150" y="745" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 11:9–12</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text distinguishes water</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">creatures with fins and</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">scales from those without and</text>
  <text x="150" y="869" fill="#59685f" font-family="Arial,sans-serif" font-size="24">assigns eating categories to</text>
  <text x="150" y="899" fill="#59685f" font-family="Arial,sans-serif" font-size="24">each.</text>
  <path d="M335 949V999" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1165" x2="120" y2="1165" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1009" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1165" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1052" fill="#172d27" font-family="Georgia,serif" font-size="30">Birds and winged</text>
  <text x="150" y="1088" fill="#172d27" font-family="Georgia,serif" font-size="30">creatures</text>
  <text x="150" y="1127" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 11:13–23</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Named birds are listed; a</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">subset of winged creeping</text>
  <text x="150" y="1221" fill="#59685f" font-family="Arial,sans-serif" font-size="24">things with jumping legs is</text>
  <text x="150" y="1251" fill="#59685f" font-family="Arial,sans-serif" font-size="24">permitted, while other listed</text>
  <text x="150" y="1281" fill="#59685f" font-family="Arial,sans-serif" font-size="24">kinds are excluded.</text>
  <path d="M335 1331V1381" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1529" x2="120" y2="1529" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1391" width="430" height="276" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1529" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1434" fill="#172d27" font-family="Georgia,serif" font-size="30">Carcass-contact rules</text>
  <text x="150" y="1473" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 11:24–28</text>
  <text x="150" y="1507" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Touching or carrying</text>
  <text x="150" y="1537" fill="#59685f" font-family="Arial,sans-serif" font-size="24">specified carcasses brings</text>
  <text x="150" y="1567" fill="#59685f" font-family="Arial,sans-serif" font-size="24">ritual status until evening;</text>
  <text x="150" y="1597" fill="#59685f" font-family="Arial,sans-serif" font-size="24">washing clothes is directed</text>
  <text x="150" y="1627" fill="#59685f" font-family="Arial,sans-serif" font-size="24">in carrying cases.</text>
  <path d="M335 1677V1727" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1893" x2="120" y2="1893" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1737" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1893" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1780" fill="#172d27" font-family="Georgia,serif" font-size="30">Creeping things and</text>
  <text x="150" y="1816" fill="#172d27" font-family="Georgia,serif" font-size="30">affected objects</text>
  <text x="150" y="1855" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 11:29–38</text>
  <text x="150" y="1889" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text names small</text>
  <text x="150" y="1919" fill="#59685f" font-family="Arial,sans-serif" font-size="24">creatures and sets rules for</text>
  <text x="150" y="1949" fill="#59685f" font-family="Arial,sans-serif" font-size="24">carcasses touching vessels,</text>
  <text x="150" y="1979" fill="#59685f" font-family="Arial,sans-serif" font-size="24">food, drink, tools, water, or</text>
  <text x="150" y="2009" fill="#59685f" font-family="Arial,sans-serif" font-size="24">seed.</text>
  <path d="M335 2059V2109" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2260" x2="120" y2="2260" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2119" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2260" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2162" fill="#172d27" font-family="Georgia,serif" font-size="30">Carcass of an edible</text>
  <text x="150" y="2198" fill="#172d27" font-family="Georgia,serif" font-size="30">beast</text>
  <text x="150" y="2237" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 11:39–40</text>
  <text x="150" y="2271" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Contact with or handling of a</text>
  <text x="150" y="2301" fill="#59685f" font-family="Arial,sans-serif" font-size="24">permitted animal that dies</text>
  <text x="150" y="2331" fill="#59685f" font-family="Arial,sans-serif" font-size="24">calls for washing and evening</text>
  <text x="150" y="2361" fill="#59685f" font-family="Arial,sans-serif" font-size="24">ritual status.</text>
  <path d="M335 2411V2461" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2627" x2="120" y2="2627" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2471" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2627" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2514" fill="#172d27" font-family="Georgia,serif" font-size="30">Prohibition and</text>
  <text x="150" y="2550" fill="#172d27" font-family="Georgia,serif" font-size="30">holiness rationale</text>
  <text x="150" y="2589" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 11:41–45</text>
  <text x="150" y="2623" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The passage prohibits eating</text>
  <text x="150" y="2653" fill="#59685f" font-family="Arial,sans-serif" font-size="24">creeping things and connects</text>
  <text x="150" y="2683" fill="#59685f" font-family="Arial,sans-serif" font-size="24">keeping its distinctions with</text>
  <text x="150" y="2713" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel's call to be holy as</text>
  <text x="150" y="2743" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the LORD is holy.</text>
  <path d="M335 2793V2843" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3009" x2="120" y2="3009" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2853" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3009" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2896" fill="#172d27" font-family="Georgia,serif" font-size="30">Purpose of the food</text>
  <text x="150" y="2932" fill="#172d27" font-family="Georgia,serif" font-size="30">rules</text>
  <text x="150" y="2971" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 11:46–47</text>
  <text x="150" y="3005" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Closing verses summarize the</text>
  <text x="150" y="3035" fill="#59685f" font-family="Arial,sans-serif" font-size="24">creatures covered and state</text>
  <text x="150" y="3065" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the aim: distinguish clean</text>
  <text x="150" y="3095" fill="#59685f" font-family="Arial,sans-serif" font-size="24">from unclean and edible from</text>
  <text x="150" y="3125" fill="#59685f" font-family="Arial,sans-serif" font-size="24">inedible.</text>
  <text x="120" y="3225" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
