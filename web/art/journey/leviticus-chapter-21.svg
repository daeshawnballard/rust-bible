<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2346" viewBox="0 0 1536 2346" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 21 · Chapter outline</title>
  <desc id="desc">A vertical column of 6 text cards partitions all 24 verses in Leviticus 21. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2346" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 21 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Priests and sacred service · Leviticus 21:1–24 · 6 source-based units</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Priests and mourning</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">for kin</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 21:1–4</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Priests face limits on</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">defilement for the dead, with</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">named close-family</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">exceptions.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="738" x2="120" y2="738" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="738" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">Priestly conduct and</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">marriage</text>
  <text x="150" y="715" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 21:5–8</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Priests must avoid specified</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">mourning marks and marriage</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">situations and remain holy</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">for their service.</text>
  <path d="M335 889V939" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1072" x2="120" y2="1072" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="949" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1072" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">A priest's daughter</text>
  <text x="150" y="1031" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 21:9</text>
  <text x="150" y="1065" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The law addresses a priest's</text>
  <text x="150" y="1095" fill="#59685f" font-family="Arial,sans-serif" font-size="24">daughter who profanes herself</text>
  <text x="150" y="1125" fill="#59685f" font-family="Arial,sans-serif" font-size="24">through prostitution and</text>
  <text x="150" y="1155" fill="#59685f" font-family="Arial,sans-serif" font-size="24">gives a severe sanction.</text>
  <path d="M335 1205V1255" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1421" x2="120" y2="1421" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1265" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1421" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1308" fill="#172d27" font-family="Georgia,serif" font-size="30">The high priest's</text>
  <text x="150" y="1344" fill="#172d27" font-family="Georgia,serif" font-size="30">stricter limits</text>
  <text x="150" y="1383" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 21:10–15</text>
  <text x="150" y="1417" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The high priest must not</text>
  <text x="150" y="1447" fill="#59685f" font-family="Arial,sans-serif" font-size="24">uncover his head, rend</text>
  <text x="150" y="1477" fill="#59685f" font-family="Arial,sans-serif" font-size="24">clothes, approach a dead</text>
  <text x="150" y="1507" fill="#59685f" font-family="Arial,sans-serif" font-size="24">body, or leave the sanctuary</text>
  <text x="150" y="1537" fill="#59685f" font-family="Arial,sans-serif" font-size="24">for mourning.</text>
  <path d="M335 1587V1637" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1788" x2="120" y2="1788" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1647" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1788" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1690" fill="#172d27" font-family="Georgia,serif" font-size="30">Who may approach the</text>
  <text x="150" y="1726" fill="#172d27" font-family="Georgia,serif" font-size="30">altar</text>
  <text x="150" y="1765" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 21:16–23</text>
  <text x="150" y="1799" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A list of physical conditions</text>
  <text x="150" y="1829" fill="#59685f" font-family="Arial,sans-serif" font-size="24">bars a descendant of Aaron</text>
  <text x="150" y="1859" fill="#59685f" font-family="Arial,sans-serif" font-size="24">from offering, while allowing</text>
  <text x="150" y="1889" fill="#59685f" font-family="Arial,sans-serif" font-size="24">him to eat holy bread.</text>
  <path d="M335 1939V1989" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2125" x2="120" y2="2125" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1999" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2125" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2042" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses communicates the</text>
  <text x="150" y="2078" fill="#172d27" font-family="Georgia,serif" font-size="30">rules</text>
  <text x="150" y="2117" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 21:24</text>
  <text x="150" y="2151" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses tells Aaron, his sons,</text>
  <text x="150" y="2181" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and all Israel what was</text>
  <text x="150" y="2211" fill="#59685f" font-family="Arial,sans-serif" font-size="24">prescribed.</text>
  <text x="120" y="2311" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
