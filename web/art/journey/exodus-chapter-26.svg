<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1618" viewBox="0 0 1536 1618" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 26 · Chapter outline</title>
  <desc id="desc">A vertical column of 4 text cards partitions all 37 verses in Exodus 26. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1618" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 26 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 26:1–37 · 4 source-based reading stages</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Linen and goats’ hair</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">curtains and coverings</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 26:1–14</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Linen curtains are joined;</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">goats’ hair and skins form</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">outer coverings.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="708" x2="120" y2="708" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="708" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">Boards, sockets, bars,</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">and tent frame</text>
  <text x="150" y="685" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 26:15–30</text>
  <text x="150" y="719" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Boards, silver sockets,</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">corner supports, and</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">gold-covered bars form the</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">frame.</text>
  <path d="M335 859V909" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1060" x2="120" y2="1060" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="919" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1060" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="962" fill="#172d27" font-family="Georgia,serif" font-size="30">Veil and placement of</text>
  <text x="150" y="998" fill="#172d27" font-family="Georgia,serif" font-size="30">ark, table, and lamp</text>
  <text x="150" y="1037" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 26:31–35</text>
  <text x="150" y="1071" fill="#59685f" font-family="Arial,sans-serif" font-size="24">An inner veil divides the</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">holy place from the most</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">holy; table and lamp stand</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">outside.</text>
  <path d="M335 1211V1261" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1397" x2="120" y2="1397" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1271" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1397" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1314" fill="#172d27" font-family="Georgia,serif" font-size="30">Tent entrance hanging</text>
  <text x="150" y="1350" fill="#172d27" font-family="Georgia,serif" font-size="30">and pillars</text>
  <text x="150" y="1389" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 26:36–37</text>
  <text x="150" y="1423" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The tent entrance has its</text>
  <text x="150" y="1453" fill="#59685f" font-family="Arial,sans-serif" font-size="24">own hanging and five</text>
  <text x="150" y="1483" fill="#59685f" font-family="Arial,sans-serif" font-size="24">pillars.</text>
  <text x="120" y="1583" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
