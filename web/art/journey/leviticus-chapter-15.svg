<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2466" viewBox="0 0 1536 2466" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 15 · Chapter outline</title>
  <desc id="desc">A vertical column of 6 text cards partitions all 33 verses in Leviticus 15. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2466" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 15 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Bodily flows and ritual status · Leviticus 15:1–33 · 6 source-based</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">units</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Issue and contact</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">rules</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 15:1–12</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text sets ritual status</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and washing rules for a man's</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">bodily issue and for people</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">or objects that contact him.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="720" x2="120" y2="720" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="720" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">After the issue ceases</text>
  <text x="150" y="679" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 15:13–15</text>
  <text x="150" y="713" fill="#59685f" font-family="Arial,sans-serif" font-size="24">After the issue is cleansed,</text>
  <text x="150" y="743" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the text gives seven-day</text>
  <text x="150" y="773" fill="#59685f" font-family="Arial,sans-serif" font-size="24">washing rules and eighth-day</text>
  <text x="150" y="803" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offerings.</text>
  <path d="M335 853V903" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1069" x2="120" y2="1069" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="913" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1069" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="956" fill="#172d27" font-family="Georgia,serif" font-size="30">Seminal emission and</text>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">contact</text>
  <text x="150" y="1031" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 15:16–18</text>
  <text x="150" y="1065" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text sets washing and</text>
  <text x="150" y="1095" fill="#59685f" font-family="Arial,sans-serif" font-size="24">evening ritual status for</text>
  <text x="150" y="1125" fill="#59685f" font-family="Arial,sans-serif" font-size="24">seminal emission, affected</text>
  <text x="150" y="1155" fill="#59685f" font-family="Arial,sans-serif" font-size="24">garments, and both partners</text>
  <text x="150" y="1185" fill="#59685f" font-family="Arial,sans-serif" font-size="24">after sex.</text>
  <path d="M335 1235V1285" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1451" x2="120" y2="1451" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1295" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1451" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1338" fill="#172d27" font-family="Georgia,serif" font-size="30">Monthly blood and</text>
  <text x="150" y="1374" fill="#172d27" font-family="Georgia,serif" font-size="30">contact rules</text>
  <text x="150" y="1413" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 15:19–24</text>
  <text x="150" y="1447" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The passage sets a seven-day</text>
  <text x="150" y="1477" fill="#59685f" font-family="Arial,sans-serif" font-size="24">separation and contact rules</text>
  <text x="150" y="1507" fill="#59685f" font-family="Arial,sans-serif" font-size="24">for beds and seats, then</text>
  <text x="150" y="1537" fill="#59685f" font-family="Arial,sans-serif" font-size="24">addresses sexual contact</text>
  <text x="150" y="1567" fill="#59685f" font-family="Arial,sans-serif" font-size="24">during that period.</text>
  <path d="M335 1617V1667" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1833" x2="120" y2="1833" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1677" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1833" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1720" fill="#172d27" font-family="Georgia,serif" font-size="30">Extended blood-flow</text>
  <text x="150" y="1756" fill="#172d27" font-family="Georgia,serif" font-size="30">rules</text>
  <text x="150" y="1795" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 15:25–30</text>
  <text x="150" y="1829" fill="#59685f" font-family="Arial,sans-serif" font-size="24">If bleeding continues beyond</text>
  <text x="150" y="1859" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the stated separation period,</text>
  <text x="150" y="1889" fill="#59685f" font-family="Arial,sans-serif" font-size="24">ritual rules remain; after it</text>
  <text x="150" y="1919" fill="#59685f" font-family="Arial,sans-serif" font-size="24">ceases, seven days and</text>
  <text x="150" y="1949" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offerings are prescribed.</text>
  <path d="M335 1999V2049" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2215" x2="120" y2="2215" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2059" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2215" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2102" fill="#172d27" font-family="Georgia,serif" font-size="30">Summary and stated</text>
  <text x="150" y="2138" fill="#172d27" font-family="Georgia,serif" font-size="30">purpose</text>
  <text x="150" y="2177" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 15:31–33</text>
  <text x="150" y="2211" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The closing lines summarize</text>
  <text x="150" y="2241" fill="#59685f" font-family="Arial,sans-serif" font-size="24">rules for bodily flows and</text>
  <text x="150" y="2271" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sexual contact, stating that</text>
  <text x="150" y="2301" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel is to be separated</text>
  <text x="150" y="2331" fill="#59685f" font-family="Arial,sans-serif" font-size="24">from uncleanness.</text>
  <text x="120" y="2431" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
