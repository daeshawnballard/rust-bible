<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2400" viewBox="0 0 1536 2400" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 29 · Chapter outline</title>
  <desc id="desc">A vertical column of 6 text cards partitions all 46 verses in Exodus 29. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2400" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 29 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 29:1–46 · 6 source-based reading stages</text>
  <line x1="88" y1="404" x2="120" y2="404" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="404" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Wash, clothe, and</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">consecrate Aaron’s</text>
  <text x="150" y="360" fill="#172d27" font-family="Georgia,serif" font-size="30">sons</text>
  <text x="150" y="399" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 29:1–9</text>
  <text x="150" y="433" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Instructions prescribe</text>
  <text x="150" y="463" fill="#59685f" font-family="Arial,sans-serif" font-size="24">washing, clothing,</text>
  <text x="150" y="493" fill="#59685f" font-family="Arial,sans-serif" font-size="24">anointing, and consecrating</text>
  <text x="150" y="523" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron and his sons.</text>
  <path d="M335 573V623" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="774" x2="120" y2="774" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="633" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="774" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">Bullock sin offering</text>
  <text x="150" y="712" fill="#172d27" font-family="Georgia,serif" font-size="30">and altar treatment</text>
  <text x="150" y="751" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 29:10–14</text>
  <text x="150" y="785" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The bullock sin offering is</text>
  <text x="150" y="815" fill="#59685f" font-family="Arial,sans-serif" font-size="24">prescribed; its blood goes</text>
  <text x="150" y="845" fill="#59685f" font-family="Arial,sans-serif" font-size="24">on the altar and its fat is</text>
  <text x="150" y="875" fill="#59685f" font-family="Arial,sans-serif" font-size="24">burned.</text>
  <path d="M335 925V975" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1096" x2="120" y2="1096" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="985" width="430" height="222" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1096" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">First ram as a burnt</text>
  <text x="150" y="1064" fill="#172d27" font-family="Georgia,serif" font-size="30">offering</text>
  <text x="150" y="1103" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 29:15–18</text>
  <text x="150" y="1137" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The first ram is prescribed</text>
  <text x="150" y="1167" fill="#59685f" font-family="Arial,sans-serif" font-size="24">as a whole burnt offering.</text>
  <path d="M335 1217V1267" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1421" x2="120" y2="1421" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1277" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1421" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1320" fill="#172d27" font-family="Georgia,serif" font-size="30">Consecration ram,</text>
  <text x="150" y="1356" fill="#172d27" font-family="Georgia,serif" font-size="30">blood, waving, and</text>
  <text x="150" y="1392" fill="#172d27" font-family="Georgia,serif" font-size="30">portions</text>
  <text x="150" y="1431" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 29:19–28</text>
  <text x="150" y="1465" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The second ram’s blood and</text>
  <text x="150" y="1495" fill="#59685f" font-family="Arial,sans-serif" font-size="24">portions are specified for</text>
  <text x="150" y="1525" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the consecration rite.</text>
  <path d="M335 1575V1625" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1776" x2="120" y2="1776" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1635" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1776" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1678" fill="#172d27" font-family="Georgia,serif" font-size="30">Garment succession and</text>
  <text x="150" y="1714" fill="#172d27" font-family="Georgia,serif" font-size="30">seven-day consecration</text>
  <text x="150" y="1753" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 29:29–37</text>
  <text x="150" y="1787" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Successor garments, holy</text>
  <text x="150" y="1817" fill="#59685f" font-family="Arial,sans-serif" font-size="24">meals, and seven-day priest</text>
  <text x="150" y="1847" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and altar consecration are</text>
  <text x="150" y="1877" fill="#59685f" font-family="Arial,sans-serif" font-size="24">prescribed.</text>
  <path d="M335 1927V1977" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2146" x2="120" y2="2146" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1987" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2146" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2030" fill="#172d27" font-family="Georgia,serif" font-size="30">Daily lambs and</text>
  <text x="150" y="2066" fill="#172d27" font-family="Georgia,serif" font-size="30">promise of God’s</text>
  <text x="150" y="2102" fill="#172d27" font-family="Georgia,serif" font-size="30">dwelling</text>
  <text x="150" y="2141" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 29:38–46</text>
  <text x="150" y="2175" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Daily lambs are prescribed</text>
  <text x="150" y="2205" fill="#59685f" font-family="Arial,sans-serif" font-size="24">morning and evening; the</text>
  <text x="150" y="2235" fill="#59685f" font-family="Arial,sans-serif" font-size="24">LORD promises to dwell</text>
  <text x="150" y="2265" fill="#59685f" font-family="Arial,sans-serif" font-size="24">among Israel.</text>
  <text x="120" y="2365" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
