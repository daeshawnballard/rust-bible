<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1576" viewBox="0 0 1536 1576" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 24 · Chapter outline</title>
  <desc id="desc">A vertical column of 4 text cards partitions all 18 verses in Exodus 24. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1576" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 24 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 24:1–18 · 4 source-based reading stages</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Instructions for</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">approaching</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 24:1–2</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses, Aaron, Nadab, Abihu,</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and seventy elders are told</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to worship afar off; Moses</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">alone may come near.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="738" x2="120" y2="738" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="738" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">The covenant is read</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">and ratified</text>
  <text x="150" y="715" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 24:3–8</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses reads the covenant;</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the people assent,</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offerings are made, and</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">blood seals it.</text>
  <path d="M335 889V939" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1072" x2="120" y2="1072" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="949" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1072" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">The elders see and eat</text>
  <text x="150" y="1031" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 24:9–11</text>
  <text x="150" y="1065" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The elders see God of</text>
  <text x="150" y="1095" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel and sapphire-like</text>
  <text x="150" y="1125" fill="#59685f" font-family="Arial,sans-serif" font-size="24">pavement, then eat and</text>
  <text x="150" y="1155" fill="#59685f" font-family="Arial,sans-serif" font-size="24">drink unharmed.</text>
  <path d="M335 1205V1255" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1373" x2="120" y2="1373" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1265" width="430" height="216" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1373" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1308" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses enters the cloud</text>
  <text x="150" y="1347" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 24:12–18</text>
  <text x="150" y="1381" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses enters the cloud on</text>
  <text x="150" y="1411" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Sinai and remains forty</text>
  <text x="150" y="1441" fill="#59685f" font-family="Arial,sans-serif" font-size="24">days and nights.</text>
  <text x="120" y="1541" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
