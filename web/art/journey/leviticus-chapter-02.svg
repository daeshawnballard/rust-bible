<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1738" viewBox="0 0 1536 1738" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 2 · Chapter outline</title>
  <desc id="desc">A vertical column of 4 text cards partitions all 16 verses in Leviticus 2. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1738" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 2 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Grain Offerings · Leviticus 2:1–16 · 4 source-based units</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Fine flour, oil, and</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">frankincense</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 2:1–3</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A portion of fine flour, oil,</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and frankincense is burned;</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the remainder is assigned to</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron and his sons.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="753" x2="120" y2="753" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="753" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">Grain offerings</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">prepared with oil</text>
  <text x="150" y="715" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 2:4–10</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Oven-baked, griddled, or</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">pan-cooked unleavened</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offerings are presented, with</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">a portion burned and the rest</text>
  <text x="150" y="869" fill="#59685f" font-family="Arial,sans-serif" font-size="24">kept by priests.</text>
  <path d="M335 919V969" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1120" x2="120" y2="1120" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="979" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1120" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1022" fill="#172d27" font-family="Georgia,serif" font-size="30">Leaven, honey, and</text>
  <text x="150" y="1058" fill="#172d27" font-family="Georgia,serif" font-size="30">covenant salt</text>
  <text x="150" y="1097" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 2:11–13</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The offering must not include</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">leaven or honey; salt is</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">required, and firstfruits are</text>
  <text x="150" y="1221" fill="#59685f" font-family="Arial,sans-serif" font-size="24">not burned as a sweet savour.</text>
  <path d="M335 1271V1321" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1487" x2="120" y2="1487" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1331" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1487" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1374" fill="#172d27" font-family="Georgia,serif" font-size="30">An offering of</text>
  <text x="150" y="1410" fill="#172d27" font-family="Georgia,serif" font-size="30">firstfruits</text>
  <text x="150" y="1449" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 2:14–16</text>
  <text x="150" y="1483" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Dried, beaten ears of</text>
  <text x="150" y="1513" fill="#59685f" font-family="Arial,sans-serif" font-size="24">firstfruits are offered with</text>
  <text x="150" y="1543" fill="#59685f" font-family="Arial,sans-serif" font-size="24">oil and frankincense; the</text>
  <text x="150" y="1573" fill="#59685f" font-family="Arial,sans-serif" font-size="24">priest burns a memorial</text>
  <text x="150" y="1603" fill="#59685f" font-family="Arial,sans-serif" font-size="24">portion.</text>
  <text x="120" y="1703" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
