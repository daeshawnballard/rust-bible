<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="3248" viewBox="0 0 1536 3248" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 13 · Chapter outline</title>
  <desc id="desc">A vertical column of 8 text cards partitions all 59 verses in Leviticus 13. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="3248" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 13 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Priestly classifications of signs · Leviticus 13:1–59 · 8 source-based</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">units</text>
  <line x1="88" y1="401" x2="120" y2="401" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="401" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Initial skin signs and</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">observation</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 13:1–8</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A priest examines a visible</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sign; the text gives criteria</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">for immediate status or two</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">seven-day observation periods</text>
  <text x="150" y="517" fill="#59685f" font-family="Arial,sans-serif" font-size="24">when it does not spread.</text>
  <path d="M335 567V617" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="798" x2="120" y2="798" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="627" width="430" height="342" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="798" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="670" fill="#172d27" font-family="Georgia,serif" font-size="30">Changing skin signs</text>
  <text x="150" y="706" fill="#172d27" font-family="Georgia,serif" font-size="30">and rulings</text>
  <text x="150" y="745" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 13:9–17</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The priest examines</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">longer-standing signs,</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">widespread whiteness, raw</text>
  <text x="150" y="869" fill="#59685f" font-family="Arial,sans-serif" font-size="24">flesh, and changes over time,</text>
  <text x="150" y="899" fill="#59685f" font-family="Arial,sans-serif" font-size="24">pronouncing status as</text>
  <text x="150" y="929" fill="#59685f" font-family="Arial,sans-serif" font-size="24">described.</text>
  <path d="M335 979V1029" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1177" x2="120" y2="1177" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1039" width="430" height="276" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1177" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1082" fill="#172d27" font-family="Georgia,serif" font-size="30">Signs after a boil</text>
  <text x="150" y="1121" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 13:18–23</text>
  <text x="150" y="1155" fill="#59685f" font-family="Arial,sans-serif" font-size="24">When a boil heals and a spot</text>
  <text x="150" y="1185" fill="#59685f" font-family="Arial,sans-serif" font-size="24">remains, the priest observes</text>
  <text x="150" y="1215" fill="#59685f" font-family="Arial,sans-serif" font-size="24">spread, depth, and hair</text>
  <text x="150" y="1245" fill="#59685f" font-family="Arial,sans-serif" font-size="24">changes before ruling on</text>
  <text x="150" y="1275" fill="#59685f" font-family="Arial,sans-serif" font-size="24">status.</text>
  <path d="M335 1325V1375" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1508" x2="120" y2="1508" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1385" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1508" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1428" fill="#172d27" font-family="Georgia,serif" font-size="30">Signs after a burn</text>
  <text x="150" y="1467" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 13:24–28</text>
  <text x="150" y="1501" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text sets observation for</text>
  <text x="150" y="1531" fill="#59685f" font-family="Arial,sans-serif" font-size="24">a sign arising at a burn and</text>
  <text x="150" y="1561" fill="#59685f" font-family="Arial,sans-serif" font-size="24">distinguishes spreading from</text>
  <text x="150" y="1591" fill="#59685f" font-family="Arial,sans-serif" font-size="24">stable changes.</text>
  <path d="M335 1641V1691" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1839" x2="120" y2="1839" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1701" width="430" height="276" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1839" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1744" fill="#172d27" font-family="Georgia,serif" font-size="30">Head or beard signs</text>
  <text x="150" y="1783" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 13:29–37</text>
  <text x="150" y="1817" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Examination of a scalp or</text>
  <text x="150" y="1847" fill="#59685f" font-family="Arial,sans-serif" font-size="24">beard sign includes a waiting</text>
  <text x="150" y="1877" fill="#59685f" font-family="Arial,sans-serif" font-size="24">period, shaving around but</text>
  <text x="150" y="1907" fill="#59685f" font-family="Arial,sans-serif" font-size="24">not over the sign, and later</text>
  <text x="150" y="1937" fill="#59685f" font-family="Arial,sans-serif" font-size="24">rulings.</text>
  <path d="M335 1987V2037" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2203" x2="120" y2="2203" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2047" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2203" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2090" fill="#172d27" font-family="Georgia,serif" font-size="30">Spots, baldness, and</text>
  <text x="150" y="2126" fill="#172d27" font-family="Georgia,serif" font-size="30">signs</text>
  <text x="150" y="2165" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 13:38–44</text>
  <text x="150" y="2199" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The priest distinguishes</text>
  <text x="150" y="2229" fill="#59685f" font-family="Arial,sans-serif" font-size="24">darkish white spots and</text>
  <text x="150" y="2259" fill="#59685f" font-family="Arial,sans-serif" font-size="24">ordinary baldness from a</text>
  <text x="150" y="2289" fill="#59685f" font-family="Arial,sans-serif" font-size="24">reddish-white sign that</text>
  <text x="150" y="2319" fill="#59685f" font-family="Arial,sans-serif" font-size="24">receives a different ruling.</text>
  <path d="M335 2369V2419" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2585" x2="120" y2="2585" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2429" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2585" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2472" fill="#172d27" font-family="Georgia,serif" font-size="30">Public and camp</text>
  <text x="150" y="2508" fill="#172d27" font-family="Georgia,serif" font-size="30">instructions</text>
  <text x="150" y="2547" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 13:45–46</text>
  <text x="150" y="2581" fill="#59685f" font-family="Arial,sans-serif" font-size="24">For a person assigned the</text>
  <text x="150" y="2611" fill="#59685f" font-family="Arial,sans-serif" font-size="24">text's unclean status, the</text>
  <text x="150" y="2641" fill="#59685f" font-family="Arial,sans-serif" font-size="24">passage specifies clothing,</text>
  <text x="150" y="2671" fill="#59685f" font-family="Arial,sans-serif" font-size="24">public notice, and residence</text>
  <text x="150" y="2701" fill="#59685f" font-family="Arial,sans-serif" font-size="24">outside the camp.</text>
  <path d="M335 2751V2801" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2982" x2="120" y2="2982" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2811" width="430" height="342" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2982" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2854" fill="#172d27" font-family="Georgia,serif" font-size="30">Signs in cloth and</text>
  <text x="150" y="2890" fill="#172d27" font-family="Georgia,serif" font-size="30">leather</text>
  <text x="150" y="2929" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 13:47–59</text>
  <text x="150" y="2963" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Priests inspect colored marks</text>
  <text x="150" y="2993" fill="#59685f" font-family="Arial,sans-serif" font-size="24">in fabric or leather, wait</text>
  <text x="150" y="3023" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and wash when instructed,</text>
  <text x="150" y="3053" fill="#59685f" font-family="Arial,sans-serif" font-size="24">then remove, rewash,</text>
  <text x="150" y="3083" fill="#59685f" font-family="Arial,sans-serif" font-size="24">pronounce clean, or burn the</text>
  <text x="150" y="3113" fill="#59685f" font-family="Arial,sans-serif" font-size="24">item.</text>
  <text x="120" y="3213" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
