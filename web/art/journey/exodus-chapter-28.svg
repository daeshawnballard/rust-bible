<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2018" viewBox="0 0 1536 2018" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 28 · Chapter outline</title>
  <desc id="desc">A vertical column of 5 text cards partitions all 43 verses in Exodus 28. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2018" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 28 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 28:1–43 · 5 source-based reading stages</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Priestly office and</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">garment inventory</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 28:1–5</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron and his sons are</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">appointed as priests and</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">receive holy garments.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="693" x2="120" y2="693" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="693" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">Ephod, shoulder</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">stones, and chains</text>
  <text x="150" y="685" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 28:6–14</text>
  <text x="150" y="719" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The ephod bears Israel’s</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">names on shoulder stones</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and gold chains.</text>
  <path d="M335 829V879" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1033" x2="120" y2="1033" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="889" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1033" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="932" fill="#172d27" font-family="Georgia,serif" font-size="30">Breastplate, stones,</text>
  <text x="150" y="968" fill="#172d27" font-family="Georgia,serif" font-size="30">names, Urim, and</text>
  <text x="150" y="1004" fill="#172d27" font-family="Georgia,serif" font-size="30">Thummim</text>
  <text x="150" y="1043" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 28:15–30</text>
  <text x="150" y="1077" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The breastplate bears</text>
  <text x="150" y="1107" fill="#59685f" font-family="Arial,sans-serif" font-size="24">twelve tribal names and</text>
  <text x="150" y="1137" fill="#59685f" font-family="Arial,sans-serif" font-size="24">holds the Urim and Thummim.</text>
  <path d="M335 1187V1237" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1406" x2="120" y2="1406" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1247" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1406" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1290" fill="#172d27" font-family="Georgia,serif" font-size="30">Blue robe, bells,</text>
  <text x="150" y="1326" fill="#172d27" font-family="Georgia,serif" font-size="30">pomegranates, and gold</text>
  <text x="150" y="1362" fill="#172d27" font-family="Georgia,serif" font-size="30">plate</text>
  <text x="150" y="1401" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 28:31–38</text>
  <text x="150" y="1435" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron wears a blue robe</text>
  <text x="150" y="1465" fill="#59685f" font-family="Arial,sans-serif" font-size="24">with bells and</text>
  <text x="150" y="1495" fill="#59685f" font-family="Arial,sans-serif" font-size="24">pomegranates, and a gold</text>
  <text x="150" y="1525" fill="#59685f" font-family="Arial,sans-serif" font-size="24">plate.</text>
  <path d="M335 1575V1625" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1779" x2="120" y2="1779" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1635" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1779" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1678" fill="#172d27" font-family="Georgia,serif" font-size="30">Coats, headwear,</text>
  <text x="150" y="1714" fill="#172d27" font-family="Georgia,serif" font-size="30">girdles, and linen</text>
  <text x="150" y="1750" fill="#172d27" font-family="Georgia,serif" font-size="30">breeches</text>
  <text x="150" y="1789" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 28:39–43</text>
  <text x="150" y="1823" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Linen coats, headwear,</text>
  <text x="150" y="1853" fill="#59685f" font-family="Arial,sans-serif" font-size="24">girdles, and breeches are</text>
  <text x="150" y="1883" fill="#59685f" font-family="Arial,sans-serif" font-size="24">prescribed for priests.</text>
  <text x="120" y="1983" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
