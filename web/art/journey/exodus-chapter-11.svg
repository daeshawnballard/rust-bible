<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1720" viewBox="0 0 1536 1720" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 11 · Chapter outline</title>
  <desc id="desc">A vertical column of 4 text cards partitions all 10 verses in Exodus 11. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1720" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 11 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 11:1–10 · 4 source-based reading stages</text>
  <line x1="88" y1="404" x2="120" y2="404" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="404" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">One more plague;</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel asks for</text>
  <text x="150" y="360" fill="#172d27" font-family="Georgia,serif" font-size="30">Egypt’s goods</text>
  <text x="150" y="399" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 11:1–3</text>
  <text x="150" y="433" fill="#59685f" font-family="Arial,sans-serif" font-size="24">One final plague will make</text>
  <text x="150" y="463" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh drive Israel out;</text>
  <text x="150" y="493" fill="#59685f" font-family="Arial,sans-serif" font-size="24">they are told to ask for</text>
  <text x="150" y="523" fill="#59685f" font-family="Arial,sans-serif" font-size="24">silver and gold.</text>
  <path d="M335 573V623" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="759" x2="120" y2="759" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="633" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="759" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">Firstborn death is</text>
  <text x="150" y="712" fill="#172d27" font-family="Georgia,serif" font-size="30">announced for midnight</text>
  <text x="150" y="751" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 11:4–6</text>
  <text x="150" y="785" fill="#59685f" font-family="Arial,sans-serif" font-size="24">At midnight Egypt’s human</text>
  <text x="150" y="815" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and animal firstborn will</text>
  <text x="150" y="845" fill="#59685f" font-family="Arial,sans-serif" font-size="24">die, bringing a great cry.</text>
  <path d="M335 895V945" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1096" x2="120" y2="1096" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="955" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1096" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="998" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses announces a</text>
  <text x="150" y="1034" fill="#172d27" font-family="Georgia,serif" font-size="30">distinction for Israel</text>
  <text x="150" y="1073" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 11:7</text>
  <text x="150" y="1107" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD distinguishes</text>
  <text x="150" y="1137" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel from Egypt; no dog</text>
  <text x="150" y="1167" fill="#59685f" font-family="Arial,sans-serif" font-size="24">will move its tongue</text>
  <text x="150" y="1197" fill="#59685f" font-family="Arial,sans-serif" font-size="24">against them.</text>
  <path d="M335 1247V1297" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1466" x2="120" y2="1466" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1307" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1466" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1350" fill="#172d27" font-family="Georgia,serif" font-size="30">Servants will plead</text>
  <text x="150" y="1386" fill="#172d27" font-family="Georgia,serif" font-size="30">for release; Pharaoh</text>
  <text x="150" y="1422" fill="#172d27" font-family="Georgia,serif" font-size="30">refuses</text>
  <text x="150" y="1461" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 11:8–10</text>
  <text x="150" y="1495" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses predicts Pharaoh’s</text>
  <text x="150" y="1525" fill="#59685f" font-family="Arial,sans-serif" font-size="24">servants will plead for</text>
  <text x="150" y="1555" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel to leave; refusal</text>
  <text x="150" y="1585" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and wonders will follow.</text>
  <text x="120" y="1685" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
