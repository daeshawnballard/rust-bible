<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="3516" viewBox="0 0 1536 3516" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 25 · Chapter outline</title>
  <desc id="desc">A vertical column of 9 text cards partitions all 55 verses in Leviticus 25. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="3516" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 25 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Land rest, Jubilee, and redemption · Leviticus 25:1–55 · 9</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">source-based units</text>
  <line x1="88" y1="368" x2="120" y2="368" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="368" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">A Sabbath for the land</text>
  <text x="150" y="327" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 25:1–7</text>
  <text x="150" y="361" fill="#59685f" font-family="Arial,sans-serif" font-size="24">After six years of sowing and</text>
  <text x="150" y="391" fill="#59685f" font-family="Arial,sans-serif" font-size="24">pruning, the seventh year is</text>
  <text x="150" y="421" fill="#59685f" font-family="Arial,sans-serif" font-size="24">rest for the land and its</text>
  <text x="150" y="451" fill="#59685f" font-family="Arial,sans-serif" font-size="24">unharvested growth is shared.</text>
  <path d="M335 501V551" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="717" x2="120" y2="717" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="561" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="717" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="604" fill="#172d27" font-family="Georgia,serif" font-size="30">The fiftieth year of</text>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">Jubilee</text>
  <text x="150" y="679" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 25:8–13</text>
  <text x="150" y="713" fill="#59685f" font-family="Arial,sans-serif" font-size="24">After seven cycles of seven</text>
  <text x="150" y="743" fill="#59685f" font-family="Arial,sans-serif" font-size="24">years, a trumpet sounds on</text>
  <text x="150" y="773" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the Day of Atonement and year</text>
  <text x="150" y="803" fill="#59685f" font-family="Arial,sans-serif" font-size="24">fifty proclaims liberty and</text>
  <text x="150" y="833" fill="#59685f" font-family="Arial,sans-serif" font-size="24">return.</text>
  <path d="M335 883V933" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1084" x2="120" y2="1084" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="943" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1084" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="986" fill="#172d27" font-family="Georgia,serif" font-size="30">Price land by years</text>
  <text x="150" y="1022" fill="#172d27" font-family="Georgia,serif" font-size="30">remaining</text>
  <text x="150" y="1061" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 25:14–17</text>
  <text x="150" y="1095" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Land sale prices must reflect</text>
  <text x="150" y="1125" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the number of harvest years</text>
  <text x="150" y="1155" fill="#59685f" font-family="Arial,sans-serif" font-size="24">until Jubilee; neighbors must</text>
  <text x="150" y="1185" fill="#59685f" font-family="Arial,sans-serif" font-size="24">not oppress one another.</text>
  <path d="M335 1235V1285" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1451" x2="120" y2="1451" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1295" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1451" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1338" fill="#172d27" font-family="Georgia,serif" font-size="30">Provision through the</text>
  <text x="150" y="1374" fill="#172d27" font-family="Georgia,serif" font-size="30">land rest</text>
  <text x="150" y="1413" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 25:18–22</text>
  <text x="150" y="1447" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Keeping the statutes is</text>
  <text x="150" y="1477" fill="#59685f" font-family="Arial,sans-serif" font-size="24">linked to safety; a</text>
  <text x="150" y="1507" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sixth-year yield is promised</text>
  <text x="150" y="1537" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to cover the seventh-year</text>
  <text x="150" y="1567" fill="#59685f" font-family="Arial,sans-serif" font-size="24">rest and later harvest gap.</text>
  <path d="M335 1617V1667" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1800" x2="120" y2="1800" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1677" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1800" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1720" fill="#172d27" font-family="Georgia,serif" font-size="30">Redeem family land</text>
  <text x="150" y="1759" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 25:23–28</text>
  <text x="150" y="1793" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The land belongs to God; a</text>
  <text x="150" y="1823" fill="#59685f" font-family="Arial,sans-serif" font-size="24">kinsman or owner may redeem a</text>
  <text x="150" y="1853" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sold holding, otherwise it</text>
  <text x="150" y="1883" fill="#59685f" font-family="Arial,sans-serif" font-size="24">returns at Jubilee.</text>
  <path d="M335 1933V1983" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2134" x2="120" y2="2134" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1993" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2134" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2036" fill="#172d27" font-family="Georgia,serif" font-size="30">City houses and</text>
  <text x="150" y="2072" fill="#172d27" font-family="Georgia,serif" font-size="30">Levitical land</text>
  <text x="150" y="2111" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 25:29–34</text>
  <text x="150" y="2145" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Rules differ for houses in</text>
  <text x="150" y="2175" fill="#59685f" font-family="Arial,sans-serif" font-size="24">walled cities, unwalled</text>
  <text x="150" y="2205" fill="#59685f" font-family="Arial,sans-serif" font-size="24">villages, and Levitical</text>
  <text x="150" y="2235" fill="#59685f" font-family="Arial,sans-serif" font-size="24">holdings and fields.</text>
  <path d="M335 2285V2335" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2501" x2="120" y2="2501" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2345" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2501" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2388" fill="#172d27" font-family="Georgia,serif" font-size="30">Support a poor</text>
  <text x="150" y="2424" fill="#172d27" font-family="Georgia,serif" font-size="30">neighbor</text>
  <text x="150" y="2463" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 25:35–38</text>
  <text x="150" y="2497" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Relieve an impoverished</text>
  <text x="150" y="2527" fill="#59685f" font-family="Arial,sans-serif" font-size="24">neighbor and lend without</text>
  <text x="150" y="2557" fill="#59685f" font-family="Arial,sans-serif" font-size="24">usury or increase,</text>
  <text x="150" y="2587" fill="#59685f" font-family="Arial,sans-serif" font-size="24">remembering the exodus and</text>
  <text x="150" y="2617" fill="#59685f" font-family="Arial,sans-serif" font-size="24">land grant.</text>
  <path d="M335 2667V2717" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2883" x2="120" y2="2883" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2727" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2883" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2770" fill="#172d27" font-family="Georgia,serif" font-size="30">Israelite servants and</text>
  <text x="150" y="2806" fill="#172d27" font-family="Georgia,serif" font-size="30">foreign bondspeople</text>
  <text x="150" y="2845" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 25:39–46</text>
  <text x="150" y="2879" fill="#59685f" font-family="Arial,sans-serif" font-size="24">An impoverished Israelite</text>
  <text x="150" y="2909" fill="#59685f" font-family="Arial,sans-serif" font-size="24">serves as a hired worker</text>
  <text x="150" y="2939" fill="#59685f" font-family="Arial,sans-serif" font-size="24">until Jubilee, while the text</text>
  <text x="150" y="2969" fill="#59685f" font-family="Arial,sans-serif" font-size="24">separately regulates foreign</text>
  <text x="150" y="2999" fill="#59685f" font-family="Arial,sans-serif" font-size="24">bondspeople.</text>
  <path d="M335 3049V3099" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3265" x2="120" y2="3265" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3109" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3265" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3152" fill="#172d27" font-family="Georgia,serif" font-size="30">Redeem an Israelite</text>
  <text x="150" y="3188" fill="#172d27" font-family="Georgia,serif" font-size="30">sold abroad</text>
  <text x="150" y="3227" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 25:47–55</text>
  <text x="150" y="3261" fill="#59685f" font-family="Arial,sans-serif" font-size="24">An Israelite sold to a</text>
  <text x="150" y="3291" fill="#59685f" font-family="Arial,sans-serif" font-size="24">resident stranger may be</text>
  <text x="150" y="3321" fill="#59685f" font-family="Arial,sans-serif" font-size="24">redeemed by kin or self, with</text>
  <text x="150" y="3351" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the price based on years</text>
  <text x="150" y="3381" fill="#59685f" font-family="Arial,sans-serif" font-size="24">until Jubilee.</text>
  <text x="120" y="3481" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
