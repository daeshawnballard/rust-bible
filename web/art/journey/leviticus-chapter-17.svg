<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1858" viewBox="0 0 1536 1858" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 17 · Chapter outline</title>
  <desc id="desc">A vertical column of 4 text cards partitions all 16 verses in Leviticus 17. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1858" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 17 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Sacrifice and blood · Leviticus 17:1–16 · 4 source-based units</text>
  <line x1="88" y1="401" x2="120" y2="401" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="401" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Sacrifice brought to</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">the tent</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 17:1–7</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text directs slaughtered</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">oxen, lambs, and goats to the</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">tent entrance for peace</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offerings and forbids other</text>
  <text x="150" y="517" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sacrifices.</text>
  <path d="M335 567V617" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="783" x2="120" y2="783" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="627" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="783" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="670" fill="#172d27" font-family="Georgia,serif" font-size="30">Rule includes resident</text>
  <text x="150" y="706" fill="#172d27" font-family="Georgia,serif" font-size="30">strangers</text>
  <text x="150" y="745" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 17:8–9</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israelites and resident</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">strangers must bring burnt</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offerings or sacrifices to</text>
  <text x="150" y="869" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the tent entrance; the text</text>
  <text x="150" y="899" fill="#59685f" font-family="Arial,sans-serif" font-size="24">states a penalty for refusal.</text>
  <path d="M335 949V999" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1180" x2="120" y2="1180" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1009" width="430" height="342" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1180" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1052" fill="#172d27" font-family="Georgia,serif" font-size="30">Blood and the life of</text>
  <text x="150" y="1088" fill="#172d27" font-family="Georgia,serif" font-size="30">flesh</text>
  <text x="150" y="1127" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 17:10–14</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text forbids eating</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">blood, gives it on the altar</text>
  <text x="150" y="1221" fill="#59685f" font-family="Arial,sans-serif" font-size="24">for atonement, and directs</text>
  <text x="150" y="1251" fill="#59685f" font-family="Arial,sans-serif" font-size="24">hunters to pour and cover</text>
  <text x="150" y="1281" fill="#59685f" font-family="Arial,sans-serif" font-size="24">blood, citing life as its</text>
  <text x="150" y="1311" fill="#59685f" font-family="Arial,sans-serif" font-size="24">reason.</text>
  <path d="M335 1361V1411" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1592" x2="120" y2="1592" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1421" width="430" height="342" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1592" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1464" fill="#172d27" font-family="Georgia,serif" font-size="30">Animal found dead or</text>
  <text x="150" y="1500" fill="#172d27" font-family="Georgia,serif" font-size="30">torn</text>
  <text x="150" y="1539" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 17:15–16</text>
  <text x="150" y="1573" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A person eating an animal</text>
  <text x="150" y="1603" fill="#59685f" font-family="Arial,sans-serif" font-size="24">that died or was torn washes</text>
  <text x="150" y="1633" fill="#59685f" font-family="Arial,sans-serif" font-size="24">clothes and bathes; status</text>
  <text x="150" y="1663" fill="#59685f" font-family="Arial,sans-serif" font-size="24">lasts until evening, with a</text>
  <text x="150" y="1693" fill="#59685f" font-family="Arial,sans-serif" font-size="24">further condition in verse</text>
  <text x="150" y="1723" fill="#59685f" font-family="Arial,sans-serif" font-size="24">16.</text>
  <text x="120" y="1823" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
