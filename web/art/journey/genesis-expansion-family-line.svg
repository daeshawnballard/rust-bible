<title id="title">The family line from Adam to Noah</title><desc id="desc">Genesis 5 names Adam, Seth, Enos, Cainan, Mahalaleel, Jared, Enoch, Methuselah, Lamech, and Noah. This diagram is a selected family line, not a map or scaled timeline.</desc>
