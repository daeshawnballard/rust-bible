<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2006" viewBox="0 0 1536 2006" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 39 · Chapter outline</title>
  <desc id="desc">A vertical column of 5 text cards partitions all 43 verses in Exodus 39. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2006" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 39 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 39:1–43 · 5 source-based reading stages</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Ephod and shoulder</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">stones are made</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 39:1–7</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Workers make the ephod, its</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">girdle, and shoulder stones</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">engraved with Israel’s</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">names.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="738" x2="120" y2="738" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="738" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">Breastplate and</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">fastening are made</text>
  <text x="150" y="715" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 39:8–21</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The breastplate’s stones,</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">tribal names, chains,</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">rings, and fastening are</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">made.</text>
  <path d="M335 889V939" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1093" x2="120" y2="1093" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="949" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1093" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">Blue robe,</text>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">pomegranates, and</text>
  <text x="150" y="1064" fill="#172d27" font-family="Georgia,serif" font-size="30">bells are made</text>
  <text x="150" y="1103" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 39:22–26</text>
  <text x="150" y="1137" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The blue robe is made with</text>
  <text x="150" y="1167" fill="#59685f" font-family="Arial,sans-serif" font-size="24">alternating golden bells</text>
  <text x="150" y="1197" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and pomegranates.</text>
  <path d="M335 1247V1297" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1433" x2="120" y2="1433" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1307" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1433" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1350" fill="#172d27" font-family="Georgia,serif" font-size="30">Coats, headwear,</text>
  <text x="150" y="1386" fill="#172d27" font-family="Georgia,serif" font-size="30">girdle, and gold plate</text>
  <text x="150" y="1425" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 39:27–31</text>
  <text x="150" y="1459" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Coats, headwear, girdles,</text>
  <text x="150" y="1489" fill="#59685f" font-family="Arial,sans-serif" font-size="24">linen breeches, and a gold</text>
  <text x="150" y="1519" fill="#59685f" font-family="Arial,sans-serif" font-size="24">plate are made.</text>
  <path d="M335 1569V1619" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1770" x2="120" y2="1770" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1629" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1770" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1672" fill="#172d27" font-family="Georgia,serif" font-size="30">Finished work is</text>
  <text x="150" y="1708" fill="#172d27" font-family="Georgia,serif" font-size="30">inspected and blessed</text>
  <text x="150" y="1747" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 39:32–43</text>
  <text x="150" y="1781" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The finished work is</text>
  <text x="150" y="1811" fill="#59685f" font-family="Arial,sans-serif" font-size="24">brought to Moses,</text>
  <text x="150" y="1841" fill="#59685f" font-family="Arial,sans-serif" font-size="24">inspected, found as</text>
  <text x="150" y="1871" fill="#59685f" font-family="Arial,sans-serif" font-size="24">commanded, and blessed.</text>
  <text x="120" y="1971" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
