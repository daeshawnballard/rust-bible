<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1720" viewBox="0 0 1536 1720" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 40 · Chapter outline</title>
  <desc id="desc">A vertical column of 4 text cards partitions all 38 verses in Exodus 40. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1720" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 40 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 40:1–38 · 4 source-based reading stages</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Commanded setup and</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">furniture placement</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 40:1–8</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD tells Moses to</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">place the ark, table, lamp,</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">altars, laver, and court.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="726" x2="120" y2="726" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="726" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">Anointing,</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">sanctification, and</text>
  <text x="150" y="682" fill="#172d27" font-family="Georgia,serif" font-size="30">priestly clothing</text>
  <text x="150" y="721" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 40:9–15</text>
  <text x="150" y="755" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses is told to anoint the</text>
  <text x="150" y="785" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Tabernacle and furnishings</text>
  <text x="150" y="815" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and consecrate Aaron and</text>
  <text x="150" y="845" fill="#59685f" font-family="Arial,sans-serif" font-size="24">his sons.</text>
  <path d="M335 895V945" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1096" x2="120" y2="1096" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="955" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1096" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="998" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses assembles the</text>
  <text x="150" y="1034" fill="#172d27" font-family="Georgia,serif" font-size="30">court and furnishings</text>
  <text x="150" y="1073" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 40:16–33</text>
  <text x="150" y="1107" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses erects and furnishes</text>
  <text x="150" y="1137" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the Tabernacle, washes the</text>
  <text x="150" y="1167" fill="#59685f" font-family="Arial,sans-serif" font-size="24">priests, and completes the</text>
  <text x="150" y="1197" fill="#59685f" font-family="Arial,sans-serif" font-size="24">court.</text>
  <path d="M335 1247V1297" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1466" x2="120" y2="1466" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1307" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1466" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1350" fill="#172d27" font-family="Georgia,serif" font-size="30">Cloud fills</text>
  <text x="150" y="1386" fill="#172d27" font-family="Georgia,serif" font-size="30">Tabernacle; cloud and</text>
  <text x="150" y="1422" fill="#172d27" font-family="Georgia,serif" font-size="30">fire guide</text>
  <text x="150" y="1461" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 40:34–38</text>
  <text x="150" y="1495" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The cloud fills the tent;</text>
  <text x="150" y="1525" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel travels when it</text>
  <text x="150" y="1555" fill="#59685f" font-family="Arial,sans-serif" font-size="24">lifts, with cloud by day</text>
  <text x="150" y="1585" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and fire by night.</text>
  <text x="120" y="1685" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
