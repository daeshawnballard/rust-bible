<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1338" viewBox="0 0 1536 1338" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 27 · Chapter outline</title>
  <desc id="desc">A vertical column of 3 text cards partitions all 21 verses in Exodus 27. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1338" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 27 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 27:1–21 · 3 source-based reading stages</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Bronze altar and its</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">carrying hardware</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 27:1–8</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The bronze altar has horns,</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">tools, a grate, rings, and</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">carrying poles.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="711" x2="120" y2="711" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="711" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">Court dimensions,</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">pillars, hangings, and</text>
  <text x="150" y="682" fill="#172d27" font-family="Georgia,serif" font-size="30">gate</text>
  <text x="150" y="721" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 27:9–19</text>
  <text x="150" y="755" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The court has linen</text>
  <text x="150" y="785" fill="#59685f" font-family="Arial,sans-serif" font-size="24">hangings, pillars, a gate,</text>
  <text x="150" y="815" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and bronze pins.</text>
  <path d="M335 865V915" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1084" x2="120" y2="1084" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="925" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1084" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="968" fill="#172d27" font-family="Georgia,serif" font-size="30">Oil supply and</text>
  <text x="150" y="1004" fill="#172d27" font-family="Georgia,serif" font-size="30">evening-to-morning</text>
  <text x="150" y="1040" fill="#172d27" font-family="Georgia,serif" font-size="30">lamp duty</text>
  <text x="150" y="1079" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 27:20–21</text>
  <text x="150" y="1113" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel supplies olive oil;</text>
  <text x="150" y="1143" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron and his sons tend the</text>
  <text x="150" y="1173" fill="#59685f" font-family="Arial,sans-serif" font-size="24">lamp from evening to</text>
  <text x="150" y="1203" fill="#59685f" font-family="Arial,sans-serif" font-size="24">morning.</text>
  <text x="120" y="1303" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
