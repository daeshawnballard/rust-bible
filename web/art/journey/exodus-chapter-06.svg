<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="4554" viewBox="0 0 1536 4554" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 6 · Chapter outline</title>
  <desc id="desc">A vertical column of 12 text cards partitions all 30 verses in Exodus 6. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="4554" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 6 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 6:1–30 · 12 source-based reading stages</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh will release</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 6:1</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD says Pharaoh will</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">let Israel go by a strong</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">hand and drive them out of</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Egypt.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="756" x2="120" y2="756" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="756" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">The LORD names himself</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">and recalls the</text>
  <text x="150" y="712" fill="#172d27" font-family="Georgia,serif" font-size="30">covenant</text>
  <text x="150" y="751" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 6:2–5</text>
  <text x="150" y="785" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD names himself</text>
  <text x="150" y="815" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Jehovah, recalls his</text>
  <text x="150" y="845" fill="#59685f" font-family="Arial,sans-serif" font-size="24">covenant, and hears</text>
  <text x="150" y="875" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel’s groaning.</text>
  <path d="M335 925V975" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1126" x2="120" y2="1126" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="985" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1126" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel will be brought</text>
  <text x="150" y="1064" fill="#172d27" font-family="Georgia,serif" font-size="30">out and redeemed</text>
  <text x="150" y="1103" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 6:6–7</text>
  <text x="150" y="1137" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD promises to bring</text>
  <text x="150" y="1167" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel out of Egypt, redeem</text>
  <text x="150" y="1197" fill="#59685f" font-family="Arial,sans-serif" font-size="24">them, and take them as his</text>
  <text x="150" y="1227" fill="#59685f" font-family="Arial,sans-serif" font-size="24">people.</text>
  <path d="M335 1277V1327" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1496" x2="120" y2="1496" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1337" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1496" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1380" fill="#172d27" font-family="Georgia,serif" font-size="30">The LORD promises an</text>
  <text x="150" y="1416" fill="#172d27" font-family="Georgia,serif" font-size="30">inheritance in the</text>
  <text x="150" y="1452" fill="#172d27" font-family="Georgia,serif" font-size="30">land</text>
  <text x="150" y="1491" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 6:8</text>
  <text x="150" y="1525" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD promises to bring</text>
  <text x="150" y="1555" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel into the land sworn</text>
  <text x="150" y="1585" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to Abraham, Isaac, and</text>
  <text x="150" y="1615" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Jacob and give it to them.</text>
  <path d="M335 1665V1715" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1851" x2="120" y2="1851" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1725" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1851" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1768" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel does not hear</text>
  <text x="150" y="1804" fill="#172d27" font-family="Georgia,serif" font-size="30">because of anguish</text>
  <text x="150" y="1843" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 6:9</text>
  <text x="150" y="1877" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel does not heed Moses</text>
  <text x="150" y="1907" fill="#59685f" font-family="Arial,sans-serif" font-size="24">because of anguish of</text>
  <text x="150" y="1937" fill="#59685f" font-family="Arial,sans-serif" font-size="24">spirit and cruel bondage.</text>
  <path d="M335 1987V2037" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2188" x2="120" y2="2188" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2047" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2188" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2090" fill="#172d27" font-family="Georgia,serif" font-size="30">The LORD tells Moses</text>
  <text x="150" y="2126" fill="#172d27" font-family="Georgia,serif" font-size="30">to speak to Pharaoh</text>
  <text x="150" y="2165" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 6:10–11</text>
  <text x="150" y="2199" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD tells Moses to</text>
  <text x="150" y="2229" fill="#59685f" font-family="Arial,sans-serif" font-size="24">speak to Pharaoh, king of</text>
  <text x="150" y="2259" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Egypt, and demand that he</text>
  <text x="150" y="2289" fill="#59685f" font-family="Arial,sans-serif" font-size="24">send Israel out.</text>
  <path d="M335 2339V2389" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2540" x2="120" y2="2540" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2399" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2540" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2442" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses cites Israel’s</text>
  <text x="150" y="2478" fill="#172d27" font-family="Georgia,serif" font-size="30">silence and his speech</text>
  <text x="150" y="2517" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 6:12</text>
  <text x="150" y="2551" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses says Israel has not</text>
  <text x="150" y="2581" fill="#59685f" font-family="Arial,sans-serif" font-size="24">heeded him and asks how</text>
  <text x="150" y="2611" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh will hear his</text>
  <text x="150" y="2641" fill="#59685f" font-family="Arial,sans-serif" font-size="24">uncircumcised lips.</text>
  <path d="M335 2691V2741" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2895" x2="120" y2="2895" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2751" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2895" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2794" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses and Aaron are</text>
  <text x="150" y="2830" fill="#172d27" font-family="Georgia,serif" font-size="30">charged to bring</text>
  <text x="150" y="2866" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel out</text>
  <text x="150" y="2905" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 6:13</text>
  <text x="150" y="2939" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD charges Moses and</text>
  <text x="150" y="2969" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron to bring Israel out</text>
  <text x="150" y="2999" fill="#59685f" font-family="Arial,sans-serif" font-size="24">of Egypt.</text>
  <path d="M335 3049V3099" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3250" x2="120" y2="3250" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3109" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3250" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3152" fill="#172d27" font-family="Georgia,serif" font-size="30">Reuben, Simeon, and</text>
  <text x="150" y="3188" fill="#172d27" font-family="Georgia,serif" font-size="30">Levi genealogy</text>
  <text x="150" y="3227" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 6:14–25</text>
  <text x="150" y="3261" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The genealogy lists</text>
  <text x="150" y="3291" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Reuben’s, Simeon’s, and</text>
  <text x="150" y="3321" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Levi’s houses and names</text>
  <text x="150" y="3351" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron and Moses.</text>
  <path d="M335 3401V3451" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3605" x2="120" y2="3605" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3461" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3605" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3504" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses and Aaron</text>
  <text x="150" y="3540" fill="#172d27" font-family="Georgia,serif" font-size="30">charged to bring</text>
  <text x="150" y="3576" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel out</text>
  <text x="150" y="3615" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 6:26–27</text>
  <text x="150" y="3649" fill="#59685f" font-family="Arial,sans-serif" font-size="24">This is the Moses and Aaron</text>
  <text x="150" y="3679" fill="#59685f" font-family="Arial,sans-serif" font-size="24">whom the LORD commanded to</text>
  <text x="150" y="3709" fill="#59685f" font-family="Arial,sans-serif" font-size="24">bring Israel out of Egypt.</text>
  <path d="M335 3759V3809" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3945" x2="120" y2="3945" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3819" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3945" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3862" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses is again</text>
  <text x="150" y="3898" fill="#172d27" font-family="Georgia,serif" font-size="30">commanded to speak</text>
  <text x="150" y="3937" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 6:28–29</text>
  <text x="150" y="3971" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD again tells Moses</text>
  <text x="150" y="4001" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to speak all his words to</text>
  <text x="150" y="4031" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh.</text>
  <path d="M335 4081V4131" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="4300" x2="120" y2="4300" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="4141" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="4300" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="4184" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses again says</text>
  <text x="150" y="4220" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh will not hear</text>
  <text x="150" y="4256" fill="#172d27" font-family="Georgia,serif" font-size="30">him</text>
  <text x="150" y="4295" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 6:30</text>
  <text x="150" y="4329" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses again says Pharaoh</text>
  <text x="150" y="4359" fill="#59685f" font-family="Arial,sans-serif" font-size="24">will not hear him because</text>
  <text x="150" y="4389" fill="#59685f" font-family="Arial,sans-serif" font-size="24">he is of uncircumcised</text>
  <text x="150" y="4419" fill="#59685f" font-family="Arial,sans-serif" font-size="24">lips.</text>
  <text x="120" y="4519" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
