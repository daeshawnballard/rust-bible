<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1594" viewBox="0 0 1536 1594" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 36 · Chapter outline</title>
  <desc id="desc">A vertical column of 4 text cards partitions all 38 verses in Exodus 36. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1594" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 36 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 36:1–38 · 4 source-based reading stages</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Work begins; further</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">giving is stopped</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 36:1–7</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Craftsmen begin work;</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offerings exceed need, so</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses stops further giving.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="693" x2="120" y2="693" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="693" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">Curtains, loops,</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">clasps, and coverings</text>
  <text x="150" y="685" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 36:8–19</text>
  <text x="150" y="719" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Workers make coupled linen</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and goats’ hair curtains</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and outer coverings.</text>
  <path d="M335 829V879" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1015" x2="120" y2="1015" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="889" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1015" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="932" fill="#172d27" font-family="Georgia,serif" font-size="30">Boards, supports,</text>
  <text x="150" y="968" fill="#172d27" font-family="Georgia,serif" font-size="30">bars, and gold overlay</text>
  <text x="150" y="1007" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 36:20–34</text>
  <text x="150" y="1041" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Workers make the boards,</text>
  <text x="150" y="1071" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sockets, corner supports,</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">bars, and gold overlay.</text>
  <path d="M335 1151V1201" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1355" x2="120" y2="1355" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1211" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1355" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1254" fill="#172d27" font-family="Georgia,serif" font-size="30">Inner veil and</text>
  <text x="150" y="1290" fill="#172d27" font-family="Georgia,serif" font-size="30">entrance hanging are</text>
  <text x="150" y="1326" fill="#172d27" font-family="Georgia,serif" font-size="30">made</text>
  <text x="150" y="1365" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 36:35–38</text>
  <text x="150" y="1399" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Workers make the inner veil</text>
  <text x="150" y="1429" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and the tent entrance</text>
  <text x="150" y="1459" fill="#59685f" font-family="Arial,sans-serif" font-size="24">hanging.</text>
  <text x="120" y="1559" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
