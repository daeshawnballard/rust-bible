<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="5490" viewBox="0 0 1536 5490" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 2 · Chapter outline</title>
  <desc id="desc">A vertical column of 15 text cards partitions all 25 verses in Exodus 2. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="5490" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 2 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 2:1–25 · 15 source-based reading stages</text>
  <line x1="88" y1="404" x2="120" y2="404" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="404" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">A son is born and</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">hidden for three</text>
  <text x="150" y="360" fill="#172d27" font-family="Georgia,serif" font-size="30">months</text>
  <text x="150" y="399" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:1–2</text>
  <text x="150" y="433" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Captures the birth and</text>
  <text x="150" y="463" fill="#59685f" font-family="Arial,sans-serif" font-size="24">concealment interval</text>
  <text x="150" y="493" fill="#59685f" font-family="Arial,sans-serif" font-size="24">without inventing names or</text>
  <text x="150" y="523" fill="#59685f" font-family="Arial,sans-serif" font-size="24">appearance.</text>
  <path d="M335 573V623" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="792" x2="120" y2="792" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="633" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="792" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">Basket found;</text>
  <text x="150" y="712" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh’s daughter</text>
  <text x="150" y="748" fill="#172d27" font-family="Georgia,serif" font-size="30">shows compassion</text>
  <text x="150" y="787" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:3–6</text>
  <text x="150" y="821" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh’s daughter finds</text>
  <text x="150" y="851" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the basket and pities the</text>
  <text x="150" y="881" fill="#59685f" font-family="Arial,sans-serif" font-size="24">weeping child; his sister</text>
  <text x="150" y="911" fill="#59685f" font-family="Arial,sans-serif" font-size="24">watches.</text>
  <path d="M335 961V1011" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1162" x2="120" y2="1162" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1021" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1162" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1064" fill="#172d27" font-family="Georgia,serif" font-size="30">The sister offers to</text>
  <text x="150" y="1100" fill="#172d27" font-family="Georgia,serif" font-size="30">call a Hebrew nurse</text>
  <text x="150" y="1139" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:7–8</text>
  <text x="150" y="1173" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses’s sister offers to</text>
  <text x="150" y="1203" fill="#59685f" font-family="Arial,sans-serif" font-size="24">call a Hebrew nurse, and</text>
  <text x="150" y="1233" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh’s daughter tells</text>
  <text x="150" y="1263" fill="#59685f" font-family="Arial,sans-serif" font-size="24">her to go.</text>
  <path d="M335 1313V1363" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1499" x2="120" y2="1499" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1373" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1499" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1416" fill="#172d27" font-family="Georgia,serif" font-size="30">The child’s mother</text>
  <text x="150" y="1452" fill="#172d27" font-family="Georgia,serif" font-size="30">nurses him for wages</text>
  <text x="150" y="1491" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:9</text>
  <text x="150" y="1525" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh’s daughter pays the</text>
  <text x="150" y="1555" fill="#59685f" font-family="Arial,sans-serif" font-size="24">child’s mother to nurse</text>
  <text x="150" y="1585" fill="#59685f" font-family="Arial,sans-serif" font-size="24">him.</text>
  <path d="M335 1635V1685" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1836" x2="120" y2="1836" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1695" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1836" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1738" fill="#172d27" font-family="Georgia,serif" font-size="30">The child is brought</text>
  <text x="150" y="1774" fill="#172d27" font-family="Georgia,serif" font-size="30">back and named Moses</text>
  <text x="150" y="1813" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:10</text>
  <text x="150" y="1847" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The child is brought to</text>
  <text x="150" y="1877" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh’s daughter, who</text>
  <text x="150" y="1907" fill="#59685f" font-family="Arial,sans-serif" font-size="24">names him Moses, saying she</text>
  <text x="150" y="1937" fill="#59685f" font-family="Arial,sans-serif" font-size="24">drew him from the water.</text>
  <path d="M335 1987V2037" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2173" x2="120" y2="2173" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2047" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2173" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2090" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses sees an Egyptian</text>
  <text x="150" y="2126" fill="#172d27" font-family="Georgia,serif" font-size="30">striking a Hebrew</text>
  <text x="150" y="2165" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:11</text>
  <text x="150" y="2199" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses sees an Egyptian</text>
  <text x="150" y="2229" fill="#59685f" font-family="Arial,sans-serif" font-size="24">striking a Hebrew, one of</text>
  <text x="150" y="2259" fill="#59685f" font-family="Arial,sans-serif" font-size="24">his brethren.</text>
  <path d="M335 2309V2359" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2513" x2="120" y2="2513" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2369" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2513" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2412" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses kills the</text>
  <text x="150" y="2448" fill="#172d27" font-family="Georgia,serif" font-size="30">Egyptian and hides him</text>
  <text x="150" y="2484" fill="#172d27" font-family="Georgia,serif" font-size="30">in the sand</text>
  <text x="150" y="2523" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:12</text>
  <text x="150" y="2557" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses looks around, kills</text>
  <text x="150" y="2587" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the Egyptian, and hides him</text>
  <text x="150" y="2617" fill="#59685f" font-family="Arial,sans-serif" font-size="24">in the sand.</text>
  <path d="M335 2667V2717" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2868" x2="120" y2="2868" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2727" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2868" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2770" fill="#172d27" font-family="Georgia,serif" font-size="30">A Hebrew challenges</text>
  <text x="150" y="2806" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses the next day</text>
  <text x="150" y="2845" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:13–14</text>
  <text x="150" y="2879" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Next day Moses rebukes two</text>
  <text x="150" y="2909" fill="#59685f" font-family="Arial,sans-serif" font-size="24">fighting Hebrews; one</text>
  <text x="150" y="2939" fill="#59685f" font-family="Arial,sans-serif" font-size="24">challenges him over the</text>
  <text x="150" y="2969" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Egyptian’s death.</text>
  <path d="M335 3019V3069" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3223" x2="120" y2="3223" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3079" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3223" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3122" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses flees Pharaoh</text>
  <text x="150" y="3158" fill="#172d27" font-family="Georgia,serif" font-size="30">and sits by a well in</text>
  <text x="150" y="3194" fill="#172d27" font-family="Georgia,serif" font-size="30">Midian</text>
  <text x="150" y="3233" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:15</text>
  <text x="150" y="3267" fill="#59685f" font-family="Arial,sans-serif" font-size="24">When Pharaoh seeks to kill</text>
  <text x="150" y="3297" fill="#59685f" font-family="Arial,sans-serif" font-size="24">him, Moses flees to Midian</text>
  <text x="150" y="3327" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and sits by a well.</text>
  <path d="M335 3377V3427" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3563" x2="120" y2="3563" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3437" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3563" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3480" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses helps the seven</text>
  <text x="150" y="3516" fill="#172d27" font-family="Georgia,serif" font-size="30">daughters at the well</text>
  <text x="150" y="3555" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:16–17</text>
  <text x="150" y="3589" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses helps seven daughters</text>
  <text x="150" y="3619" fill="#59685f" font-family="Arial,sans-serif" font-size="24">water their flock after</text>
  <text x="150" y="3649" fill="#59685f" font-family="Arial,sans-serif" font-size="24">shepherds drive them away.</text>
  <path d="M335 3699V3749" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3900" x2="120" y2="3900" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3759" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3900" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3802" fill="#172d27" font-family="Georgia,serif" font-size="30">Reuel welcomes Moses</text>
  <text x="150" y="3838" fill="#172d27" font-family="Georgia,serif" font-size="30">to eat bread</text>
  <text x="150" y="3877" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:18–20</text>
  <text x="150" y="3911" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Reuel asks his daughters</text>
  <text x="150" y="3941" fill="#59685f" font-family="Arial,sans-serif" font-size="24">why they left the Egyptian</text>
  <text x="150" y="3971" fill="#59685f" font-family="Arial,sans-serif" font-size="24">who helped them, then</text>
  <text x="150" y="4001" fill="#59685f" font-family="Arial,sans-serif" font-size="24">invites him to eat.</text>
  <path d="M335 4051V4101" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="4237" x2="120" y2="4237" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="4111" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="4237" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="4154" fill="#172d27" font-family="Georgia,serif" font-size="30">Zipporah is given to</text>
  <text x="150" y="4190" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses; Gershom is born</text>
  <text x="150" y="4229" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:21–22</text>
  <text x="150" y="4263" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses stays with Reuel,</text>
  <text x="150" y="4293" fill="#59685f" font-family="Arial,sans-serif" font-size="24">marries Zipporah, and names</text>
  <text x="150" y="4323" fill="#59685f" font-family="Arial,sans-serif" font-size="24">his son Gershom.</text>
  <path d="M335 4373V4423" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="4559" x2="120" y2="4559" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="4433" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="4559" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="4476" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel sighs and cries</text>
  <text x="150" y="4512" fill="#172d27" font-family="Georgia,serif" font-size="30">because of bondage</text>
  <text x="150" y="4551" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:23</text>
  <text x="150" y="4585" fill="#59685f" font-family="Arial,sans-serif" font-size="24">After Egypt’s king dies,</text>
  <text x="150" y="4615" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel groans under bondage</text>
  <text x="150" y="4645" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and cries out to God.</text>
  <path d="M335 4695V4745" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="4896" x2="120" y2="4896" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="4755" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="4896" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="4798" fill="#172d27" font-family="Georgia,serif" font-size="30">God hears and</text>
  <text x="150" y="4834" fill="#172d27" font-family="Georgia,serif" font-size="30">remembers the covenant</text>
  <text x="150" y="4873" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:24</text>
  <text x="150" y="4907" fill="#59685f" font-family="Arial,sans-serif" font-size="24">God hears Israel’s groaning</text>
  <text x="150" y="4937" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and remembers his covenant</text>
  <text x="150" y="4967" fill="#59685f" font-family="Arial,sans-serif" font-size="24">with Abraham, Isaac, and</text>
  <text x="150" y="4997" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Jacob.</text>
  <path d="M335 5047V5097" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="5251" x2="120" y2="5251" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="5107" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="5251" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="5150" fill="#172d27" font-family="Georgia,serif" font-size="30">God looks upon Israel</text>
  <text x="150" y="5186" fill="#172d27" font-family="Georgia,serif" font-size="30">and has respect unto</text>
  <text x="150" y="5222" fill="#172d27" font-family="Georgia,serif" font-size="30">them</text>
  <text x="150" y="5261" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 2:25</text>
  <text x="150" y="5295" fill="#59685f" font-family="Arial,sans-serif" font-size="24">God looks upon the children</text>
  <text x="150" y="5325" fill="#59685f" font-family="Arial,sans-serif" font-size="24">of Israel and acknowledges</text>
  <text x="150" y="5355" fill="#59685f" font-family="Arial,sans-serif" font-size="24">them.</text>
  <text x="120" y="5455" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
