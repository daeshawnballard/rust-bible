<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="3778" viewBox="0 0 1536 3778" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 7 · Chapter outline</title>
  <desc id="desc">A vertical column of 10 text cards partitions all 25 verses in Exodus 7. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="3778" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 7 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 7:1–25 · 10 source-based reading stages</text>
  <line x1="88" y1="389" x2="120" y2="389" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="389" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses speaks and Aaron</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">is his prophet to</text>
  <text x="150" y="360" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh</text>
  <text x="150" y="399" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 7:1–2</text>
  <text x="150" y="433" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD makes Moses as God</text>
  <text x="150" y="463" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to Pharaoh and appoints</text>
  <text x="150" y="493" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron as his prophet.</text>
  <path d="M335 543V593" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="744" x2="120" y2="744" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="603" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="744" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">Refusal and signs are</text>
  <text x="150" y="682" fill="#172d27" font-family="Georgia,serif" font-size="30">foretold</text>
  <text x="150" y="721" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 7:3–5</text>
  <text x="150" y="755" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD foretells</text>
  <text x="150" y="785" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh’s refusal and many</text>
  <text x="150" y="815" fill="#59685f" font-family="Arial,sans-serif" font-size="24">signs, so Egypt will know</text>
  <text x="150" y="845" fill="#59685f" font-family="Arial,sans-serif" font-size="24">that he is the LORD.</text>
  <path d="M335 895V945" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1096" x2="120" y2="1096" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="955" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1096" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="998" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses and Aaron obey;</text>
  <text x="150" y="1034" fill="#172d27" font-family="Georgia,serif" font-size="30">their ages are stated</text>
  <text x="150" y="1073" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 7:6–7</text>
  <text x="150" y="1107" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses and Aaron obey; Moses</text>
  <text x="150" y="1137" fill="#59685f" font-family="Arial,sans-serif" font-size="24">is eighty and Aaron</text>
  <text x="150" y="1167" fill="#59685f" font-family="Arial,sans-serif" font-size="24">eighty-three when they</text>
  <text x="150" y="1197" fill="#59685f" font-family="Arial,sans-serif" font-size="24">speak to Pharaoh.</text>
  <path d="M335 1247V1297" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1466" x2="120" y2="1466" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1307" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1466" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1350" fill="#172d27" font-family="Georgia,serif" font-size="30">Rod sign; magicians</text>
  <text x="150" y="1386" fill="#172d27" font-family="Georgia,serif" font-size="30">imitate; Pharaoh</text>
  <text x="150" y="1422" fill="#172d27" font-family="Georgia,serif" font-size="30">refuses</text>
  <text x="150" y="1461" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 7:8–13</text>
  <text x="150" y="1495" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron’s rod becomes a</text>
  <text x="150" y="1525" fill="#59685f" font-family="Arial,sans-serif" font-size="24">serpent; magicians imitate,</text>
  <text x="150" y="1555" fill="#59685f" font-family="Arial,sans-serif" font-size="24">but it swallows their rods</text>
  <text x="150" y="1585" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and Pharaoh refuses.</text>
  <path d="M335 1635V1685" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1836" x2="120" y2="1836" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1695" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1836" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1738" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh refuses to let</text>
  <text x="150" y="1774" fill="#172d27" font-family="Georgia,serif" font-size="30">the people go</text>
  <text x="150" y="1813" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 7:14–16</text>
  <text x="150" y="1847" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh’s heart is</text>
  <text x="150" y="1877" fill="#59685f" font-family="Arial,sans-serif" font-size="24">hardened; Moses is told to</text>
  <text x="150" y="1907" fill="#59685f" font-family="Arial,sans-serif" font-size="24">meet him by the river with</text>
  <text x="150" y="1937" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the rod.</text>
  <path d="M335 1987V2037" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2191" x2="120" y2="2191" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2047" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2191" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2090" fill="#172d27" font-family="Georgia,serif" font-size="30">The LORD says the</text>
  <text x="150" y="2126" fill="#172d27" font-family="Georgia,serif" font-size="30">river will be turned</text>
  <text x="150" y="2162" fill="#172d27" font-family="Georgia,serif" font-size="30">to blood</text>
  <text x="150" y="2201" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 7:17–18</text>
  <text x="150" y="2235" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD foretells that the</text>
  <text x="150" y="2265" fill="#59685f" font-family="Arial,sans-serif" font-size="24">river will become blood and</text>
  <text x="150" y="2295" fill="#59685f" font-family="Arial,sans-serif" font-size="24">its fish will die.</text>
  <path d="M335 2345V2395" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2546" x2="120" y2="2546" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2405" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2546" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2448" fill="#172d27" font-family="Georgia,serif" font-size="30">Water turns to blood;</text>
  <text x="150" y="2484" fill="#172d27" font-family="Georgia,serif" font-size="30">fish die</text>
  <text x="150" y="2523" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 7:19–21</text>
  <text x="150" y="2557" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron strikes the river</text>
  <text x="150" y="2587" fill="#59685f" font-family="Arial,sans-serif" font-size="24">with his rod; the water</text>
  <text x="150" y="2617" fill="#59685f" font-family="Arial,sans-serif" font-size="24">becomes blood, and the fish</text>
  <text x="150" y="2647" fill="#59685f" font-family="Arial,sans-serif" font-size="24">die.</text>
  <path d="M335 2697V2747" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2898" x2="120" y2="2898" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2757" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2898" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2800" fill="#172d27" font-family="Georgia,serif" font-size="30">Magicians imitate;</text>
  <text x="150" y="2836" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh will not hear</text>
  <text x="150" y="2875" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 7:22–23</text>
  <text x="150" y="2909" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The magicians imitate the</text>
  <text x="150" y="2939" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sign, but Pharaoh’s heart</text>
  <text x="150" y="2969" fill="#59685f" font-family="Arial,sans-serif" font-size="24">remains hardened and he</text>
  <text x="150" y="2999" fill="#59685f" font-family="Arial,sans-serif" font-size="24">does not heed them.</text>
  <path d="M335 3049V3099" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3250" x2="120" y2="3250" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3109" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3250" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3152" fill="#172d27" font-family="Georgia,serif" font-size="30">Egyptians dig beside</text>
  <text x="150" y="3188" fill="#172d27" font-family="Georgia,serif" font-size="30">the river for water</text>
  <text x="150" y="3227" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 7:24</text>
  <text x="150" y="3261" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Egyptians dig along the</text>
  <text x="150" y="3291" fill="#59685f" font-family="Arial,sans-serif" font-size="24">river for drinking water</text>
  <text x="150" y="3321" fill="#59685f" font-family="Arial,sans-serif" font-size="24">because they cannot drink</text>
  <text x="150" y="3351" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the river water.</text>
  <path d="M335 3401V3451" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3572" x2="120" y2="3572" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3461" width="430" height="222" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3572" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3504" fill="#172d27" font-family="Georgia,serif" font-size="30">Seven days after the</text>
  <text x="150" y="3540" fill="#172d27" font-family="Georgia,serif" font-size="30">river is struck</text>
  <text x="150" y="3579" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 7:25</text>
  <text x="150" y="3613" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Seven days pass after the</text>
  <text x="150" y="3643" fill="#59685f" font-family="Arial,sans-serif" font-size="24">LORD strikes the river.</text>
  <text x="120" y="3743" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
