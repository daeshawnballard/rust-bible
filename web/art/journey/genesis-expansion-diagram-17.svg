<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">Names and a promised son</title><desc id="desc">Text-only diagram of the names Abraham and Sarah are given in Genesis 17:5 and 17:15, with Isaac shown as promised for the future in Genesis 17:19–21. No portraits or events are depicted.</desc><rect width="1536" height="1024" fill="#101615"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b99b59"/></marker></defs><text x="768" y="78" text-anchor="middle" fill="#e8d5a8" font-family="Georgia,serif" font-size="44" font-weight="normal">Names and a promised son</text><text x="768" y="128" text-anchor="middle" fill="#b6aa8e" font-family="Georgia,serif" font-size="30" font-weight="normal">Genesis 17:5, 15, 19–21 · name changes and a future promise only</text><path d="M418 318 H492" marker-end="url(#arrow)" fill="none" stroke="#b99b59" stroke-width="4"/><path d="M418 538 H492" marker-end="url(#arrow)" fill="none" stroke="#b99b59" stroke-width="4"/><path d="M850 318 C905 318 910 420 975 420" fill="none" stroke="#b99b59" stroke-width="3"/><path d="M850 538 C905 538 910 520 975 520" fill="none" stroke="#b99b59" stroke-width="3"/><text x="455" y="288" text-anchor="middle" fill="#c4af7e" font-family="Georgia,serif" font-size="30" font-weight="normal">name given</text><text x="455" y="508" text-anchor="middle" fill="#c4af7e" font-family="Georgia,serif" font-size="30" font-weight="normal">name given</text><rect x="150" y="265" width="268" height="108" rx="14" fill="#1b211d" stroke="#bb9d61" stroke-width="2"/><text x="284" y="313" text-anchor="middle" fill="#e8d5a8" font-family="Georgia,serif" font-size="38" font-weight="normal">Abram</text><text x="284" y="353" text-anchor="middle" fill="#c4af7e" font-family="Georgia,serif" font-size="30" font-weight="normal">Genesis 17:5</text><rect x="492" y="265" width="358" height="108" rx="14" fill="#1b211d" stroke="#bb9d61" stroke-width="2"/><text x="671" y="313" text-anchor="middle" fill="#e8d5a8" font-family="Georgia,serif" font-size="38" font-weight="normal">Abraham</text><text x="671" y="353" text-anchor="middle" fill="#c4af7e" font-family="Georgia,serif" font-size="30" font-weight="normal">Genesis 17:5</text><rect x="150" y="485" width="268" height="108" rx="14" fill="#1b211d" stroke="#bb9d61" stroke-width="2"/><text x="284" y="533" text-anchor="middle" fill="#e8d5a8" font-family="Georgia,serif" font-size="38" font-weight="normal">Sarai</text><text x="284" y="573" text-anchor="middle" fill="#c4af7e" font-family="Georgia,serif" font-size="30" font-weight="normal">Genesis 17:15</text><rect x="492" y="485" width="358" height="108" rx="14" fill="#1b211d" stroke="#bb9d61" stroke-width="2"/><text x="671" y="533" text-anchor="middle" fill="#e8d5a8" font-family="Georgia,serif" font-size="38" font-weight="normal">Sarah</text><text x="671" y="573" text-anchor="middle" fill="#c4af7e" font-family="Georgia,serif" font-size="30" font-weight="normal">Genesis 17:15</text><rect x="975" y="365" width="414" height="226" rx="14" fill="#1b211d" stroke="#bb9d61" stroke-width="2"/><text x="1182" y="417" text-anchor="middle" fill="#e8d5a8" font-family="Georgia,serif" font-size="40" font-weight="normal">Isaac</text><text x="1182" y="464" text-anchor="middle" fill="#f0e4ca" font-family="Georgia,serif" font-size="32" font-weight="normal">promised son</text><text x="1182" y="508" text-anchor="middle" fill="#f0e4ca" font-family="Georgia,serif" font-size="30" font-weight="normal">to Abraham and Sarah</text><text x="1182" y="553" text-anchor="middle" fill="#c4af7e" font-family="Georgia,serif" font-size="30" font-weight="normal">Genesis 17:19–21</text><text x="768" y="760" text-anchor="middle" fill="#b6aa8e" font-family="Georgia,serif" font-size="30" font-weight="normal">The diagram shows name links and the future promise, not a birth, portrait, or later event.</text><text x="768" y="810" text-anchor="middle" fill="#b6aa8e" font-family="Georgia,serif" font-size="30" font-weight="normal">Not a map, timeline, or full-history account.</text></svg>
