<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="4202" viewBox="0 0 1536 4202" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 5 · Chapter outline</title>
  <desc id="desc">A vertical column of 11 text cards partitions all 23 verses in Exodus 5. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="4202" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 5 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 5:1–23 · 11 source-based reading stages</text>
  <line x1="88" y1="404" x2="120" y2="404" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="404" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses asks for</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">release; Pharaoh</text>
  <text x="150" y="360" fill="#172d27" font-family="Georgia,serif" font-size="30">refuses</text>
  <text x="150" y="399" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 5:1–5</text>
  <text x="150" y="433" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses and Aaron ask Pharaoh</text>
  <text x="150" y="463" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to let Israel worship;</text>
  <text x="150" y="493" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh refuses and says</text>
  <text x="150" y="523" fill="#59685f" font-family="Arial,sans-serif" font-size="24">they have too much rest.</text>
  <path d="M335 573V623" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="792" x2="120" y2="792" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="633" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="792" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">Taskmasters are</text>
  <text x="150" y="712" fill="#172d27" font-family="Georgia,serif" font-size="30">commanded to withhold</text>
  <text x="150" y="748" fill="#172d27" font-family="Georgia,serif" font-size="30">straw</text>
  <text x="150" y="787" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 5:6–7</text>
  <text x="150" y="821" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh orders the</text>
  <text x="150" y="851" fill="#59685f" font-family="Arial,sans-serif" font-size="24">taskmasters and officers to</text>
  <text x="150" y="881" fill="#59685f" font-family="Arial,sans-serif" font-size="24">stop giving Israel straw</text>
  <text x="150" y="911" fill="#59685f" font-family="Arial,sans-serif" font-size="24">for making bricks.</text>
  <path d="M335 961V1011" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1162" x2="120" y2="1162" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1021" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1162" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1064" fill="#172d27" font-family="Georgia,serif" font-size="30">The same brick tally</text>
  <text x="150" y="1100" fill="#172d27" font-family="Georgia,serif" font-size="30">is demanded</text>
  <text x="150" y="1139" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 5:8–9</text>
  <text x="150" y="1173" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh keeps the same</text>
  <text x="150" y="1203" fill="#59685f" font-family="Arial,sans-serif" font-size="24">brick quota and calls the</text>
  <text x="150" y="1233" fill="#59685f" font-family="Arial,sans-serif" font-size="24">people idle for asking to</text>
  <text x="150" y="1263" fill="#59685f" font-family="Arial,sans-serif" font-size="24">worship.</text>
  <path d="M335 1313V1363" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1514" x2="120" y2="1514" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1373" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1514" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1416" fill="#172d27" font-family="Georgia,serif" font-size="30">Stubble gathering</text>
  <text x="150" y="1452" fill="#172d27" font-family="Georgia,serif" font-size="30">under unchanged quotas</text>
  <text x="150" y="1491" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 5:10–13</text>
  <text x="150" y="1525" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel gathers stubble</text>
  <text x="150" y="1555" fill="#59685f" font-family="Arial,sans-serif" font-size="24">while taskmasters still</text>
  <text x="150" y="1585" fill="#59685f" font-family="Arial,sans-serif" font-size="24">demand the daily brick</text>
  <text x="150" y="1615" fill="#59685f" font-family="Arial,sans-serif" font-size="24">tally.</text>
  <path d="M335 1665V1715" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1884" x2="120" y2="1884" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1725" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1884" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1768" fill="#172d27" font-family="Georgia,serif" font-size="30">Israelite officers are</text>
  <text x="150" y="1804" fill="#172d27" font-family="Georgia,serif" font-size="30">beaten over the brick</text>
  <text x="150" y="1840" fill="#172d27" font-family="Georgia,serif" font-size="30">tally</text>
  <text x="150" y="1879" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 5:14</text>
  <text x="150" y="1913" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israelite officers are</text>
  <text x="150" y="1943" fill="#59685f" font-family="Arial,sans-serif" font-size="24">beaten for the missing</text>
  <text x="150" y="1973" fill="#59685f" font-family="Arial,sans-serif" font-size="24">brick tally and questioned</text>
  <text x="150" y="2003" fill="#59685f" font-family="Arial,sans-serif" font-size="24">by taskmasters.</text>
  <path d="M335 2053V2103" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2239" x2="120" y2="2239" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2113" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2239" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2156" fill="#172d27" font-family="Georgia,serif" font-size="30">Officers question</text>
  <text x="150" y="2192" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh’s treatment</text>
  <text x="150" y="2231" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 5:15–16</text>
  <text x="150" y="2265" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The officers tell Pharaoh</text>
  <text x="150" y="2295" fill="#59685f" font-family="Arial,sans-serif" font-size="24">they get no straw yet must</text>
  <text x="150" y="2325" fill="#59685f" font-family="Arial,sans-serif" font-size="24">make bricks and are beaten.</text>
  <path d="M335 2375V2425" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2594" x2="120" y2="2594" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2435" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2594" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2478" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh calls them</text>
  <text x="150" y="2514" fill="#172d27" font-family="Georgia,serif" font-size="30">idle and orders the</text>
  <text x="150" y="2550" fill="#172d27" font-family="Georgia,serif" font-size="30">same work</text>
  <text x="150" y="2589" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 5:17–18</text>
  <text x="150" y="2623" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh calls the people</text>
  <text x="150" y="2653" fill="#59685f" font-family="Arial,sans-serif" font-size="24">idle and orders them to</text>
  <text x="150" y="2683" fill="#59685f" font-family="Arial,sans-serif" font-size="24">gather straw while making</text>
  <text x="150" y="2713" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the same number of bricks.</text>
  <path d="M335 2763V2813" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2964" x2="120" y2="2964" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2823" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2964" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2866" fill="#172d27" font-family="Georgia,serif" font-size="30">The officers see their</text>
  <text x="150" y="2902" fill="#172d27" font-family="Georgia,serif" font-size="30">case is worsened</text>
  <text x="150" y="2941" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 5:19</text>
  <text x="150" y="2975" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The officers see their case</text>
  <text x="150" y="3005" fill="#59685f" font-family="Arial,sans-serif" font-size="24">is worsened when Pharaoh</text>
  <text x="150" y="3035" fill="#59685f" font-family="Arial,sans-serif" font-size="24">refuses to reduce the daily</text>
  <text x="150" y="3065" fill="#59685f" font-family="Arial,sans-serif" font-size="24">brick tally.</text>
  <path d="M335 3115V3165" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3301" x2="120" y2="3301" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3175" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3301" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3218" fill="#172d27" font-family="Georgia,serif" font-size="30">The officers meet</text>
  <text x="150" y="3254" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses and Aaron</text>
  <text x="150" y="3293" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 5:20</text>
  <text x="150" y="3327" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The officers meet Moses and</text>
  <text x="150" y="3357" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron as they leave</text>
  <text x="150" y="3387" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh.</text>
  <path d="M335 3437V3487" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3641" x2="120" y2="3641" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3497" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3641" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3540" fill="#172d27" font-family="Georgia,serif" font-size="30">They say Pharaoh now</text>
  <text x="150" y="3576" fill="#172d27" font-family="Georgia,serif" font-size="30">has a sword against</text>
  <text x="150" y="3612" fill="#172d27" font-family="Georgia,serif" font-size="30">them</text>
  <text x="150" y="3651" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 5:21</text>
  <text x="150" y="3685" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The officers accuse Moses</text>
  <text x="150" y="3715" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and Aaron of giving Pharaoh</text>
  <text x="150" y="3745" fill="#59685f" font-family="Arial,sans-serif" font-size="24">cause to kill them.</text>
  <path d="M335 3795V3845" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3981" x2="120" y2="3981" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3855" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3981" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3898" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses questions the</text>
  <text x="150" y="3934" fill="#172d27" font-family="Georgia,serif" font-size="30">worsening suffering</text>
  <text x="150" y="3973" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 5:22–23</text>
  <text x="150" y="4007" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses asks why Pharaoh</text>
  <text x="150" y="4037" fill="#59685f" font-family="Arial,sans-serif" font-size="24">increased Israel’s burden</text>
  <text x="150" y="4067" fill="#59685f" font-family="Arial,sans-serif" font-size="24">instead of delivering them.</text>
  <text x="120" y="4167" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
