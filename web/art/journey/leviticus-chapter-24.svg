<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2364" viewBox="0 0 1536 2364" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 24 · Chapter outline</title>
  <desc id="desc">A vertical column of 6 text cards partitions all 23 verses in Leviticus 24. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2364" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 24 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">The lamp, bread, and equal law · Leviticus 24:1–23 · 6 source-based</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">units</text>
  <line x1="88" y1="368" x2="120" y2="368" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="368" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Keep the lamps burning</text>
  <text x="150" y="327" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 24:1–4</text>
  <text x="150" y="361" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel supplies pure beaten</text>
  <text x="150" y="391" fill="#59685f" font-family="Arial,sans-serif" font-size="24">olive oil so Aaron can tend</text>
  <text x="150" y="421" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the lamps from evening to</text>
  <text x="150" y="451" fill="#59685f" font-family="Arial,sans-serif" font-size="24">morning.</text>
  <path d="M335 501V551" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="702" x2="120" y2="702" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="561" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="702" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="604" fill="#172d27" font-family="Georgia,serif" font-size="30">Twelve loaves each</text>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">Sabbath</text>
  <text x="150" y="679" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 24:5–9</text>
  <text x="150" y="713" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Twelve cakes are placed in</text>
  <text x="150" y="743" fill="#59685f" font-family="Arial,sans-serif" font-size="24">two rows of six with</text>
  <text x="150" y="773" fill="#59685f" font-family="Arial,sans-serif" font-size="24">frankincense and renewed each</text>
  <text x="150" y="803" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Sabbath.</text>
  <path d="M335 853V903" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1051" x2="120" y2="1051" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="913" width="430" height="276" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1051" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="956" fill="#172d27" font-family="Georgia,serif" font-size="30">A dispute in the camp</text>
  <text x="150" y="995" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 24:10–12</text>
  <text x="150" y="1029" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A man born to an Israelite</text>
  <text x="150" y="1059" fill="#59685f" font-family="Arial,sans-serif" font-size="24">woman and Egyptian father</text>
  <text x="150" y="1089" fill="#59685f" font-family="Arial,sans-serif" font-size="24">fights with an Israelite and</text>
  <text x="150" y="1119" fill="#59685f" font-family="Arial,sans-serif" font-size="24">blasphemes; he is held while</text>
  <text x="150" y="1149" fill="#59685f" font-family="Arial,sans-serif" font-size="24">judgment is sought.</text>
  <path d="M335 1199V1249" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1397" x2="120" y2="1397" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1259" width="430" height="276" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1397" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1302" fill="#172d27" font-family="Georgia,serif" font-size="30">Rule for blasphemy</text>
  <text x="150" y="1341" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 24:13–16</text>
  <text x="150" y="1375" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The response prescribes a</text>
  <text x="150" y="1405" fill="#59685f" font-family="Arial,sans-serif" font-size="24">public sentence for blasphemy</text>
  <text x="150" y="1435" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and states that the same rule</text>
  <text x="150" y="1465" fill="#59685f" font-family="Arial,sans-serif" font-size="24">applies to stranger and</text>
  <text x="150" y="1495" fill="#59685f" font-family="Arial,sans-serif" font-size="24">native.</text>
  <path d="M335 1545V1595" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1776" x2="120" y2="1776" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1605" width="430" height="342" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1776" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1648" fill="#172d27" font-family="Georgia,serif" font-size="30">Proportionate injury</text>
  <text x="150" y="1684" fill="#172d27" font-family="Georgia,serif" font-size="30">and equal law</text>
  <text x="150" y="1723" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 24:17–22</text>
  <text x="150" y="1757" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text distinguishes</text>
  <text x="150" y="1787" fill="#59685f" font-family="Arial,sans-serif" font-size="24">homicide from harm to an</text>
  <text x="150" y="1817" fill="#59685f" font-family="Arial,sans-serif" font-size="24">animal, sets an equivalence</text>
  <text x="150" y="1847" fill="#59685f" font-family="Arial,sans-serif" font-size="24">principle for injury, and</text>
  <text x="150" y="1877" fill="#59685f" font-family="Arial,sans-serif" font-size="24">requires one rule for</text>
  <text x="150" y="1907" fill="#59685f" font-family="Arial,sans-serif" font-size="24">stranger and native.</text>
  <path d="M335 1957V2007" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2143" x2="120" y2="2143" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2017" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2143" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2060" fill="#172d27" font-family="Georgia,serif" font-size="30">The ruling is carried</text>
  <text x="150" y="2096" fill="#172d27" font-family="Georgia,serif" font-size="30">out</text>
  <text x="150" y="2135" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 24:23</text>
  <text x="150" y="2169" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses tells Israel what to</text>
  <text x="150" y="2199" fill="#59685f" font-family="Arial,sans-serif" font-size="24">do, and the congregation acts</text>
  <text x="150" y="2229" fill="#59685f" font-family="Arial,sans-serif" font-size="24">as commanded.</text>
  <text x="120" y="2329" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
