<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="4386" viewBox="0 0 1536 4386" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 19 · Chapter outline</title>
  <desc id="desc">A vertical column of 12 text cards partitions all 37 verses in Leviticus 19. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="4386" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 19 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Holiness in worship and neighbor life · Leviticus 19:1–37 · 12</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">source-based units</text>
  <line x1="88" y1="353" x2="120" y2="353" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="216" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="353" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">A holy people</text>
  <text x="150" y="327" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 19:1–4</text>
  <text x="150" y="361" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel is called to holiness,</text>
  <text x="150" y="391" fill="#59685f" font-family="Arial,sans-serif" font-size="24">honoring parents and Sabbaths</text>
  <text x="150" y="421" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and refusing idols.</text>
  <path d="M335 471V521" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="672" x2="120" y2="672" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="531" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="672" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="574" fill="#172d27" font-family="Georgia,serif" font-size="30">Peace offering and its</text>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">time limit</text>
  <text x="150" y="649" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 19:5–8</text>
  <text x="150" y="683" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A peace offering is eaten on</text>
  <text x="150" y="713" fill="#59685f" font-family="Arial,sans-serif" font-size="24">its first two days; leftovers</text>
  <text x="150" y="743" fill="#59685f" font-family="Arial,sans-serif" font-size="24">are burned, and third-day</text>
  <text x="150" y="773" fill="#59685f" font-family="Arial,sans-serif" font-size="24">eating profanes it.</text>
  <path d="M335 823V873" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1024" x2="120" y2="1024" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="883" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1024" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="926" fill="#172d27" font-family="Georgia,serif" font-size="30">Leave harvest for the</text>
  <text x="150" y="962" fill="#172d27" font-family="Georgia,serif" font-size="30">poor</text>
  <text x="150" y="1001" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 19:9–10</text>
  <text x="150" y="1035" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Harvesters must leave field</text>
  <text x="150" y="1065" fill="#59685f" font-family="Arial,sans-serif" font-size="24">edges and vineyard gleanings</text>
  <text x="150" y="1095" fill="#59685f" font-family="Arial,sans-serif" font-size="24">for the poor and resident</text>
  <text x="150" y="1125" fill="#59685f" font-family="Arial,sans-serif" font-size="24">stranger.</text>
  <path d="M335 1175V1225" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1391" x2="120" y2="1391" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1235" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1391" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1278" fill="#172d27" font-family="Georgia,serif" font-size="30">Justice and love of</text>
  <text x="150" y="1314" fill="#172d27" font-family="Georgia,serif" font-size="30">neighbor</text>
  <text x="150" y="1353" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 19:11–18</text>
  <text x="150" y="1387" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Reject theft, fraud, false</text>
  <text x="150" y="1417" fill="#59685f" font-family="Arial,sans-serif" font-size="24">oaths, withheld wages,</text>
  <text x="150" y="1447" fill="#59685f" font-family="Arial,sans-serif" font-size="24">contempt, slander, partial</text>
  <text x="150" y="1477" fill="#59685f" font-family="Arial,sans-serif" font-size="24">judgment, hatred, vengeance,</text>
  <text x="150" y="1507" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and grudges.</text>
  <path d="M335 1557V1607" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1740" x2="120" y2="1740" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1617" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1740" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1660" fill="#172d27" font-family="Georgia,serif" font-size="30">Keep distinct kinds</text>
  <text x="150" y="1699" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 19:19</text>
  <text x="150" y="1733" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text forbids mixing kinds</text>
  <text x="150" y="1763" fill="#59685f" font-family="Arial,sans-serif" font-size="24">in livestock, seed, and a</text>
  <text x="150" y="1793" fill="#59685f" font-family="Arial,sans-serif" font-size="24">garment made of linen and</text>
  <text x="150" y="1823" fill="#59685f" font-family="Arial,sans-serif" font-size="24">wool.</text>
  <path d="M335 1873V1923" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2089" x2="120" y2="2089" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1933" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2089" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1976" fill="#172d27" font-family="Georgia,serif" font-size="30">A case involving an</text>
  <text x="150" y="2012" fill="#172d27" font-family="Georgia,serif" font-size="30">enslaved woman</text>
  <text x="150" y="2051" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 19:20–22</text>
  <text x="150" y="2085" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A specific sexual case</text>
  <text x="150" y="2115" fill="#59685f" font-family="Arial,sans-serif" font-size="24">involving an enslaved,</text>
  <text x="150" y="2145" fill="#59685f" font-family="Arial,sans-serif" font-size="24">betrothed woman receives a</text>
  <text x="150" y="2175" fill="#59685f" font-family="Arial,sans-serif" font-size="24">trespass offering and</text>
  <text x="150" y="2205" fill="#59685f" font-family="Arial,sans-serif" font-size="24">priestly atonement.</text>
  <path d="M335 2255V2305" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2456" x2="120" y2="2456" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2315" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2456" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2358" fill="#172d27" font-family="Georgia,serif" font-size="30">Fruit trees and</text>
  <text x="150" y="2394" fill="#172d27" font-family="Georgia,serif" font-size="30">waiting years</text>
  <text x="150" y="2433" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 19:23–25</text>
  <text x="150" y="2467" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Fruit from new trees is</text>
  <text x="150" y="2497" fill="#59685f" font-family="Arial,sans-serif" font-size="24">withheld for three years,</text>
  <text x="150" y="2527" fill="#59685f" font-family="Arial,sans-serif" font-size="24">dedicated in year four, and</text>
  <text x="150" y="2557" fill="#59685f" font-family="Arial,sans-serif" font-size="24">eaten from year five.</text>
  <path d="M335 2607V2657" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2808" x2="120" y2="2808" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2667" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2808" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2710" fill="#172d27" font-family="Georgia,serif" font-size="30">Blood, divination, and</text>
  <text x="150" y="2746" fill="#172d27" font-family="Georgia,serif" font-size="30">mourning marks</text>
  <text x="150" y="2785" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 19:26–28</text>
  <text x="150" y="2819" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text prohibits eating</text>
  <text x="150" y="2849" fill="#59685f" font-family="Arial,sans-serif" font-size="24">blood, divination, certain</text>
  <text x="150" y="2879" fill="#59685f" font-family="Arial,sans-serif" font-size="24">grooming practices, and</text>
  <text x="150" y="2909" fill="#59685f" font-family="Arial,sans-serif" font-size="24">bodily marks for the dead.</text>
  <path d="M335 2959V3009" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3175" x2="120" y2="3175" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3019" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3175" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3062" fill="#172d27" font-family="Georgia,serif" font-size="30">Family, Sabbath, and</text>
  <text x="150" y="3098" fill="#172d27" font-family="Georgia,serif" font-size="30">sanctuary</text>
  <text x="150" y="3137" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 19:29–31</text>
  <text x="150" y="3171" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text warns against</text>
  <text x="150" y="3201" fill="#59685f" font-family="Arial,sans-serif" font-size="24">prostituting a daughter and</text>
  <text x="150" y="3231" fill="#59685f" font-family="Arial,sans-serif" font-size="24">commands Sabbath reverence</text>
  <text x="150" y="3261" fill="#59685f" font-family="Arial,sans-serif" font-size="24">for the sanctuary and</text>
  <text x="150" y="3291" fill="#59685f" font-family="Arial,sans-serif" font-size="24">rejection of spirit mediums.</text>
  <path d="M335 3341V3391" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3542" x2="120" y2="3542" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3401" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3542" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3444" fill="#172d27" font-family="Georgia,serif" font-size="30">Honor elders and love</text>
  <text x="150" y="3480" fill="#172d27" font-family="Georgia,serif" font-size="30">the stranger</text>
  <text x="150" y="3519" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 19:32–34</text>
  <text x="150" y="3553" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Show respect to elders; treat</text>
  <text x="150" y="3583" fill="#59685f" font-family="Arial,sans-serif" font-size="24">a resident stranger as</text>
  <text x="150" y="3613" fill="#59685f" font-family="Arial,sans-serif" font-size="24">native-born and love that</text>
  <text x="150" y="3643" fill="#59685f" font-family="Arial,sans-serif" font-size="24">person as oneself.</text>
  <path d="M335 3693V3743" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3879" x2="120" y2="3879" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3753" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3879" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3796" fill="#172d27" font-family="Georgia,serif" font-size="30">Honest weights and</text>
  <text x="150" y="3832" fill="#172d27" font-family="Georgia,serif" font-size="30">measures</text>
  <text x="150" y="3871" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 19:35–36</text>
  <text x="150" y="3905" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Use just measures and weights</text>
  <text x="150" y="3935" fill="#59685f" font-family="Arial,sans-serif" font-size="24">in trade, recalling the</text>
  <text x="150" y="3965" fill="#59685f" font-family="Arial,sans-serif" font-size="24">exodus from Egypt.</text>
  <path d="M335 4015V4065" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="4183" x2="120" y2="4183" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="4075" width="430" height="216" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="4183" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="4118" fill="#172d27" font-family="Georgia,serif" font-size="30">Closing charge</text>
  <text x="150" y="4157" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 19:37</text>
  <text x="150" y="4191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Observe and do the statutes</text>
  <text x="150" y="4221" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and judgments given in the</text>
  <text x="150" y="4251" fill="#59685f" font-family="Arial,sans-serif" font-size="24">chapter.</text>
  <text x="120" y="4351" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
