<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2024" viewBox="0 0 1536 2024" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 4 · Chapter outline</title>
  <desc id="desc">A vertical column of 5 text cards partitions all 35 verses in Leviticus 4. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2024" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 4 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Sin Offerings · Leviticus 4:1–35 · 5 source-based units</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Cases of inadvertent</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">sin</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 4:1–2</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The chapter introduces cases</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">of inadvertent sin against</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the LORD’s commandments.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="723" x2="120" y2="723" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="723" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">The anointed priest’s</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">offering</text>
  <text x="150" y="685" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 4:3–12</text>
  <text x="150" y="719" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A bullock is prescribed for</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the anointed priest, with</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">blood brought into the</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sanctuary and the remains</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">burned outside the camp.</text>
  <path d="M335 889V939" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1105" x2="120" y2="1105" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="949" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1105" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">The congregation’s</text>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">offering</text>
  <text x="150" y="1067" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 4:13–21</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">If the congregation sins</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">unknowingly, its elders</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">present a bullock and the</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">priest follows the prescribed</text>
  <text x="150" y="1221" fill="#59685f" font-family="Arial,sans-serif" font-size="24">rites.</text>
  <path d="M335 1271V1321" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1454" x2="120" y2="1454" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1331" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1454" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1374" fill="#172d27" font-family="Georgia,serif" font-size="30">A ruler’s offering</text>
  <text x="150" y="1413" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 4:22–26</text>
  <text x="150" y="1447" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A ruler who sins unknowingly</text>
  <text x="150" y="1477" fill="#59685f" font-family="Arial,sans-serif" font-size="24">brings an unblemished male</text>
  <text x="150" y="1507" fill="#59685f" font-family="Arial,sans-serif" font-size="24">goat, and the priest makes</text>
  <text x="150" y="1537" fill="#59685f" font-family="Arial,sans-serif" font-size="24">atonement.</text>
  <path d="M335 1587V1637" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1788" x2="120" y2="1788" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1647" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1788" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1690" fill="#172d27" font-family="Georgia,serif" font-size="30">An offering for a</text>
  <text x="150" y="1726" fill="#172d27" font-family="Georgia,serif" font-size="30">common person</text>
  <text x="150" y="1765" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 4:27–35</text>
  <text x="150" y="1799" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A common person brings an</text>
  <text x="150" y="1829" fill="#59685f" font-family="Arial,sans-serif" font-size="24">unblemished female goat or</text>
  <text x="150" y="1859" fill="#59685f" font-family="Arial,sans-serif" font-size="24">lamb; the priest makes</text>
  <text x="150" y="1889" fill="#59685f" font-family="Arial,sans-serif" font-size="24">atonement as prescribed.</text>
  <text x="120" y="1989" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
