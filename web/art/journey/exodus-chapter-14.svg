<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2704" viewBox="0 0 1536 2704" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 14 · Chapter outline</title>
  <desc id="desc">A vertical column of 7 text cards partitions all 31 verses in Exodus 14. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2704" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 14 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 14:1–31 · 7 source-based reading stages</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Sea encampment and</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">announced pursuit</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 14:1–4</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD orders Israel to</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">camp by the sea and</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">foretells Pharaoh’s</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">pursuit.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="738" x2="120" y2="738" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="738" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh's army catches</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel</text>
  <text x="150" y="715" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 14:5–9</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh changes course,</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">gathers his chariots and</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">army, and overtakes Israel</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">near the sea.</text>
  <path d="M335 889V939" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1090" x2="120" y2="1090" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="949" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1090" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel fears; Moses</text>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">reassures</text>
  <text x="150" y="1067" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 14:10–14</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel fears and complains;</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses tells them to stand</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">firm and see the LORD's</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">salvation.</text>
  <path d="M335 1241V1291" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1442" x2="120" y2="1442" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1301" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1442" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1344" fill="#172d27" font-family="Georgia,serif" font-size="30">The cloud moves</text>
  <text x="150" y="1380" fill="#172d27" font-family="Georgia,serif" font-size="30">between the camps</text>
  <text x="150" y="1419" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 14:15–20</text>
  <text x="150" y="1453" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD commands Israel</text>
  <text x="150" y="1483" fill="#59685f" font-family="Arial,sans-serif" font-size="24">forward; Moses raises his</text>
  <text x="150" y="1513" fill="#59685f" font-family="Arial,sans-serif" font-size="24">rod as cloud and angel move</text>
  <text x="150" y="1543" fill="#59685f" font-family="Arial,sans-serif" font-size="24">between camps.</text>
  <path d="M335 1593V1643" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1794" x2="120" y2="1794" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1653" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1794" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1696" fill="#172d27" font-family="Georgia,serif" font-size="30">The sea opens; Israel</text>
  <text x="150" y="1732" fill="#172d27" font-family="Georgia,serif" font-size="30">crosses</text>
  <text x="150" y="1771" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 14:21–22</text>
  <text x="150" y="1805" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD drives back the</text>
  <text x="150" y="1835" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sea, and Israel enters the</text>
  <text x="150" y="1865" fill="#59685f" font-family="Arial,sans-serif" font-size="24">midst of it on dry ground</text>
  <text x="150" y="1895" fill="#59685f" font-family="Arial,sans-serif" font-size="24">between walls of water.</text>
  <path d="M335 1945V1995" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2146" x2="120" y2="2146" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2005" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2146" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2048" fill="#172d27" font-family="Georgia,serif" font-size="30">Egypt follows into the</text>
  <text x="150" y="2084" fill="#172d27" font-family="Georgia,serif" font-size="30">sea</text>
  <text x="150" y="2123" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 14:23–25</text>
  <text x="150" y="2157" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Egyptian chariots follow</text>
  <text x="150" y="2187" fill="#59685f" font-family="Arial,sans-serif" font-size="24">into the sea; the LORD</text>
  <text x="150" y="2217" fill="#59685f" font-family="Arial,sans-serif" font-size="24">troubles them, and they try</text>
  <text x="150" y="2247" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to flee.</text>
  <path d="M335 2297V2347" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2483" x2="120" y2="2483" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2357" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2483" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2400" fill="#172d27" font-family="Georgia,serif" font-size="30">The waters return;</text>
  <text x="150" y="2436" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel is saved</text>
  <text x="150" y="2475" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 14:26–31</text>
  <text x="150" y="2509" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The waters return, Israel</text>
  <text x="150" y="2539" fill="#59685f" font-family="Arial,sans-serif" font-size="24">is saved, and the people</text>
  <text x="150" y="2569" fill="#59685f" font-family="Arial,sans-serif" font-size="24">fear the LORD and believe.</text>
  <text x="120" y="2669" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
