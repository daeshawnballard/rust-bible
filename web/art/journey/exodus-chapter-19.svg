<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2322" viewBox="0 0 1536 2322" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 19 · Chapter outline</title>
  <desc id="desc">A vertical column of 6 text cards partitions all 25 verses in Exodus 19. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2322" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 19 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 19:1–25 · 6 source-based reading stages</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel camps before</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">Sinai</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 19:1–2</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">In the third month Israel</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">leaves Rephidim and camps</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">in the wilderness before</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the mount at Sinai.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="723" x2="120" y2="723" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="723" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">Covenant proposal and</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">promised identity</text>
  <text x="150" y="715" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 19:3–6</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD promises Israel a</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">treasured identity if they</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">obey his covenant.</text>
  <path d="M335 859V909" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1045" x2="120" y2="1045" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="919" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1045" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="962" fill="#172d27" font-family="Georgia,serif" font-size="30">The people answer; a</text>
  <text x="150" y="998" fill="#172d27" font-family="Georgia,serif" font-size="30">cloud is announced</text>
  <text x="150" y="1037" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 19:7–9</text>
  <text x="150" y="1071" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel agrees to the LORD’s</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">words; he announces a thick</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">cloud to speak with Moses.</text>
  <path d="M335 1181V1231" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1382" x2="120" y2="1382" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1241" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1382" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1284" fill="#172d27" font-family="Georgia,serif" font-size="30">Preparation and</text>
  <text x="150" y="1320" fill="#172d27" font-family="Georgia,serif" font-size="30">mountain boundary</text>
  <text x="150" y="1359" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 19:10–15</text>
  <text x="150" y="1393" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD sets Sinai’s</text>
  <text x="150" y="1423" fill="#59685f" font-family="Arial,sans-serif" font-size="24">boundary and commands</text>
  <text x="150" y="1453" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel to prepare for the</text>
  <text x="150" y="1483" fill="#59685f" font-family="Arial,sans-serif" font-size="24">third day.</text>
  <path d="M335 1533V1583" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1734" x2="120" y2="1734" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1593" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1734" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1636" fill="#172d27" font-family="Georgia,serif" font-size="30">The LORD descends on</text>
  <text x="150" y="1672" fill="#172d27" font-family="Georgia,serif" font-size="30">Sinai</text>
  <text x="150" y="1711" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 19:16–20</text>
  <text x="150" y="1745" fill="#59685f" font-family="Arial,sans-serif" font-size="24">On the third day, thunder,</text>
  <text x="150" y="1775" fill="#59685f" font-family="Arial,sans-serif" font-size="24">lightning, cloud, trumpet,</text>
  <text x="150" y="1805" fill="#59685f" font-family="Arial,sans-serif" font-size="24">smoke, and quake; the LORD</text>
  <text x="150" y="1835" fill="#59685f" font-family="Arial,sans-serif" font-size="24">calls Moses.</text>
  <path d="M335 1885V1935" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2086" x2="120" y2="2086" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1945" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2086" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1988" fill="#172d27" font-family="Georgia,serif" font-size="30">The mountain boundary</text>
  <text x="150" y="2024" fill="#172d27" font-family="Georgia,serif" font-size="30">is reaffirmed</text>
  <text x="150" y="2063" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 19:21–25</text>
  <text x="150" y="2097" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD repeats the Sinai</text>
  <text x="150" y="2127" fill="#59685f" font-family="Arial,sans-serif" font-size="24">boundary warning; Moses</text>
  <text x="150" y="2157" fill="#59685f" font-family="Arial,sans-serif" font-size="24">objects, and the LORD</text>
  <text x="150" y="2187" fill="#59685f" font-family="Arial,sans-serif" font-size="24">restates who may approach.</text>
  <text x="120" y="2287" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
