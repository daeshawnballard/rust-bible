<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2250" viewBox="0 0 1536 2250" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 15 · Chapter outline</title>
  <desc id="desc">A vertical column of 6 text cards partitions all 27 verses in Exodus 15. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2250" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 15 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 15:1–27 · 6 source-based reading stages</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">A song of victory over</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">Egypt</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 15:1–12</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses and Israel sing of</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the LORD’s victory, power,</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">holiness, and wonders.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="708" x2="120" y2="708" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="708" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">Guidance and the</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">LORD's reign</text>
  <text x="150" y="685" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 15:13–18</text>
  <text x="150" y="719" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The song describes the LORD</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">guiding the redeemed people</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">toward his holy habitation</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and proclaims his reign.</text>
  <path d="M335 859V909" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1060" x2="120" y2="1060" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="919" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1060" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="962" fill="#172d27" font-family="Georgia,serif" font-size="30">The crossing recalled</text>
  <text x="150" y="998" fill="#172d27" font-family="Georgia,serif" font-size="30">in prose</text>
  <text x="150" y="1037" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 15:19</text>
  <text x="150" y="1071" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The narrator recalls Egypt</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">entering the sea and Israel</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">walking on dry land as</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">waters return.</text>
  <path d="M335 1211V1261" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1412" x2="120" y2="1412" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1271" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1412" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1314" fill="#172d27" font-family="Georgia,serif" font-size="30">Miriam leads the</text>
  <text x="150" y="1350" fill="#172d27" font-family="Georgia,serif" font-size="30">women's song</text>
  <text x="150" y="1389" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 15:20–21</text>
  <text x="150" y="1423" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Miriam leads the women with</text>
  <text x="150" y="1453" fill="#59685f" font-family="Arial,sans-serif" font-size="24">timbrels and dances and</text>
  <text x="150" y="1483" fill="#59685f" font-family="Arial,sans-serif" font-size="24">answers with the song's</text>
  <text x="150" y="1513" fill="#59685f" font-family="Arial,sans-serif" font-size="24">victory refrain.</text>
  <path d="M335 1563V1613" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1731" x2="120" y2="1731" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1623" width="430" height="216" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1731" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1666" fill="#172d27" font-family="Georgia,serif" font-size="30">Bitter water at Marah</text>
  <text x="150" y="1705" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 15:22–26</text>
  <text x="150" y="1739" fill="#59685f" font-family="Arial,sans-serif" font-size="24">At Marah the LORD sweetens</text>
  <text x="150" y="1769" fill="#59685f" font-family="Arial,sans-serif" font-size="24">bitter water and gives</text>
  <text x="150" y="1799" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel a statute and test.</text>
  <path d="M335 1849V1899" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2032" x2="120" y2="2032" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1909" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2032" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1952" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel camps at Elim</text>
  <text x="150" y="1991" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 15:27</text>
  <text x="150" y="2025" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel comes to Elim and</text>
  <text x="150" y="2055" fill="#59685f" font-family="Arial,sans-serif" font-size="24">encamps by twelve wells of</text>
  <text x="150" y="2085" fill="#59685f" font-family="Arial,sans-serif" font-size="24">water and seventy palm</text>
  <text x="150" y="2115" fill="#59685f" font-family="Arial,sans-serif" font-size="24">trees.</text>
  <text x="120" y="2215" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
