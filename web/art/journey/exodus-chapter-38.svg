<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1982" viewBox="0 0 1536 1982" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 38 · Chapter outline</title>
  <desc id="desc">A vertical column of 5 text cards partitions all 31 verses in Exodus 38. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1982" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 38 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 38:1–31 · 5 source-based reading stages</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Bronze altar, tools,</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">and carrying hardware</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 38:1–7</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The bronze altar, tools,</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">grate, rings, and carrying</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">poles are made.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="693" x2="120" y2="693" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="693" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">Bronze laver and foot</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">are made</text>
  <text x="150" y="685" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 38:8</text>
  <text x="150" y="719" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The bronze laver and its</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">base are made from the</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">women’s mirrors.</text>
  <path d="M335 829V879" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1033" x2="120" y2="1033" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="889" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1033" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="932" fill="#172d27" font-family="Georgia,serif" font-size="30">Court hangings,</text>
  <text x="150" y="968" fill="#172d27" font-family="Georgia,serif" font-size="30">pillars, gate, and</text>
  <text x="150" y="1004" fill="#172d27" font-family="Georgia,serif" font-size="30">pins are made</text>
  <text x="150" y="1043" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 38:9–20</text>
  <text x="150" y="1077" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Workers make the court</text>
  <text x="150" y="1107" fill="#59685f" font-family="Arial,sans-serif" font-size="24">hangings, pillars, gate</text>
  <text x="150" y="1137" fill="#59685f" font-family="Arial,sans-serif" font-size="24">screen, cords, and pins.</text>
  <path d="M335 1187V1237" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1388" x2="120" y2="1388" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1247" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1388" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1290" fill="#172d27" font-family="Georgia,serif" font-size="30">Tabernacle inventory</text>
  <text x="150" y="1326" fill="#172d27" font-family="Georgia,serif" font-size="30">and named craftsmen</text>
  <text x="150" y="1365" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 38:21–23</text>
  <text x="150" y="1399" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The inventory names</text>
  <text x="150" y="1429" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Ithamar, Bezalel, and</text>
  <text x="150" y="1459" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aholiab as overseers and</text>
  <text x="150" y="1489" fill="#59685f" font-family="Arial,sans-serif" font-size="24">craftsmen.</text>
  <path d="M335 1539V1589" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1743" x2="120" y2="1743" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1599" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1743" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1642" fill="#172d27" font-family="Georgia,serif" font-size="30">Gold, silver, and</text>
  <text x="150" y="1678" fill="#172d27" font-family="Georgia,serif" font-size="30">brass totals and their</text>
  <text x="150" y="1714" fill="#172d27" font-family="Georgia,serif" font-size="30">uses</text>
  <text x="150" y="1753" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 38:24–31</text>
  <text x="150" y="1787" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The account totals gold,</text>
  <text x="150" y="1817" fill="#59685f" font-family="Arial,sans-serif" font-size="24">silver, and brass and lists</text>
  <text x="150" y="1847" fill="#59685f" font-family="Arial,sans-serif" font-size="24">uses of some materials.</text>
  <text x="120" y="1947" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
