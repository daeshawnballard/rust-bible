<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="4256" viewBox="0 0 1536 4256" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 9 · Chapter outline</title>
  <desc id="desc">A vertical column of 11 text cards partitions all 35 verses in Exodus 9. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="4256" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 9 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 9:1–35 · 11 source-based reading stages</text>
  <line x1="88" y1="404" x2="120" y2="404" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="404" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Livestock plague;</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel’s cattle are</text>
  <text x="150" y="360" fill="#172d27" font-family="Georgia,serif" font-size="30">spared</text>
  <text x="150" y="399" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 9:1–7</text>
  <text x="150" y="433" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A livestock plague is</text>
  <text x="150" y="463" fill="#59685f" font-family="Arial,sans-serif" font-size="24">announced; Egyptian cattle</text>
  <text x="150" y="493" fill="#59685f" font-family="Arial,sans-serif" font-size="24">die, Israel’s live, and</text>
  <text x="150" y="523" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh refuses.</text>
  <path d="M335 573V623" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="774" x2="120" y2="774" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="633" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="774" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses and Aaron</text>
  <text x="150" y="712" fill="#172d27" font-family="Georgia,serif" font-size="30">scatter furnace ashes</text>
  <text x="150" y="751" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 9:8–10</text>
  <text x="150" y="785" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses scatters furnace</text>
  <text x="150" y="815" fill="#59685f" font-family="Arial,sans-serif" font-size="24">ashes; boils break out on</text>
  <text x="150" y="845" fill="#59685f" font-family="Arial,sans-serif" font-size="24">people and animals across</text>
  <text x="150" y="875" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Egypt.</text>
  <path d="M335 925V975" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1126" x2="120" y2="1126" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="985" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1126" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">The magicians cannot</text>
  <text x="150" y="1064" fill="#172d27" font-family="Georgia,serif" font-size="30">stand before Moses</text>
  <text x="150" y="1103" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 9:11–12</text>
  <text x="150" y="1137" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The magicians cannot stand</text>
  <text x="150" y="1167" fill="#59685f" font-family="Arial,sans-serif" font-size="24">before Moses because of the</text>
  <text x="150" y="1197" fill="#59685f" font-family="Arial,sans-serif" font-size="24">boils, and Pharaoh does not</text>
  <text x="150" y="1227" fill="#59685f" font-family="Arial,sans-serif" font-size="24">heed the LORD’s word.</text>
  <path d="M335 1277V1327" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1478" x2="120" y2="1478" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1337" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1478" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1380" fill="#172d27" font-family="Georgia,serif" font-size="30">The hail is announced</text>
  <text x="150" y="1416" fill="#172d27" font-family="Georgia,serif" font-size="30">for the next day</text>
  <text x="150" y="1455" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 9:13–19</text>
  <text x="150" y="1489" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Hail is announced for</text>
  <text x="150" y="1519" fill="#59685f" font-family="Arial,sans-serif" font-size="24">tomorrow; Pharaoh is told</text>
  <text x="150" y="1549" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to shelter people and</text>
  <text x="150" y="1579" fill="#59685f" font-family="Arial,sans-serif" font-size="24">cattle from the field.</text>
  <path d="M335 1629V1679" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1830" x2="120" y2="1830" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1689" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1830" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1732" fill="#172d27" font-family="Georgia,serif" font-size="30">Some servants shelter</text>
  <text x="150" y="1768" fill="#172d27" font-family="Georgia,serif" font-size="30">people and cattle</text>
  <text x="150" y="1807" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 9:20</text>
  <text x="150" y="1841" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh’s servants who fear</text>
  <text x="150" y="1871" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the LORD’s word bring their</text>
  <text x="150" y="1901" fill="#59685f" font-family="Arial,sans-serif" font-size="24">servants and cattle into</text>
  <text x="150" y="1931" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the houses.</text>
  <path d="M335 1981V2031" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2182" x2="120" y2="2182" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2041" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2182" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2084" fill="#172d27" font-family="Georgia,serif" font-size="30">Others leave people</text>
  <text x="150" y="2120" fill="#172d27" font-family="Georgia,serif" font-size="30">and cattle outside</text>
  <text x="150" y="2159" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 9:21</text>
  <text x="150" y="2193" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Those who do not regard the</text>
  <text x="150" y="2223" fill="#59685f" font-family="Arial,sans-serif" font-size="24">LORD’s word leave their</text>
  <text x="150" y="2253" fill="#59685f" font-family="Arial,sans-serif" font-size="24">servants and cattle in the</text>
  <text x="150" y="2283" fill="#59685f" font-family="Arial,sans-serif" font-size="24">field.</text>
  <path d="M335 2333V2383" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2552" x2="120" y2="2552" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2393" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2552" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2436" fill="#172d27" font-family="Georgia,serif" font-size="30">Hail and fire in</text>
  <text x="150" y="2472" fill="#172d27" font-family="Georgia,serif" font-size="30">Egypt; Goshen has no</text>
  <text x="150" y="2508" fill="#172d27" font-family="Georgia,serif" font-size="30">hail</text>
  <text x="150" y="2547" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 9:22–26</text>
  <text x="150" y="2581" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD sends hail and</text>
  <text x="150" y="2611" fill="#59685f" font-family="Arial,sans-serif" font-size="24">fire across Egypt; Goshen,</text>
  <text x="150" y="2641" fill="#59685f" font-family="Arial,sans-serif" font-size="24">where Israel lives, has no</text>
  <text x="150" y="2671" fill="#59685f" font-family="Arial,sans-serif" font-size="24">hail.</text>
  <path d="M335 2721V2771" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2922" x2="120" y2="2922" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2781" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2922" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2824" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh confesses and</text>
  <text x="150" y="2860" fill="#172d27" font-family="Georgia,serif" font-size="30">asks for relief</text>
  <text x="150" y="2899" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 9:27–30</text>
  <text x="150" y="2933" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh says he has sinned,</text>
  <text x="150" y="2963" fill="#59685f" font-family="Arial,sans-serif" font-size="24">calls the LORD righteous,</text>
  <text x="150" y="2993" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and asks Moses to entreat</text>
  <text x="150" y="3023" fill="#59685f" font-family="Arial,sans-serif" font-size="24">him so the hail will cease.</text>
  <path d="M335 3073V3123" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3274" x2="120" y2="3274" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3133" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3274" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3176" fill="#172d27" font-family="Georgia,serif" font-size="30">Hail destroys barley</text>
  <text x="150" y="3212" fill="#172d27" font-family="Georgia,serif" font-size="30">and flax, not wheat</text>
  <text x="150" y="3251" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 9:31–32</text>
  <text x="150" y="3285" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Hail strikes the barley and</text>
  <text x="150" y="3315" fill="#59685f" font-family="Arial,sans-serif" font-size="24">flax, while wheat and rye</text>
  <text x="150" y="3345" fill="#59685f" font-family="Arial,sans-serif" font-size="24">are not yet grown and</text>
  <text x="150" y="3375" fill="#59685f" font-family="Arial,sans-serif" font-size="24">remain unstruck.</text>
  <path d="M335 3425V3475" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3629" x2="120" y2="3629" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3485" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3629" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3528" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses spreads his</text>
  <text x="150" y="3564" fill="#172d27" font-family="Georgia,serif" font-size="30">hands; thunder and</text>
  <text x="150" y="3600" fill="#172d27" font-family="Georgia,serif" font-size="30">hail cease</text>
  <text x="150" y="3639" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 9:33</text>
  <text x="150" y="3673" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses spreads his hands to</text>
  <text x="150" y="3703" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the LORD; thunder, hail,</text>
  <text x="150" y="3733" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and rain cease.</text>
  <path d="M335 3783V3833" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="4002" x2="120" y2="4002" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3843" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="4002" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3886" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh and his</text>
  <text x="150" y="3922" fill="#172d27" font-family="Georgia,serif" font-size="30">servants harden their</text>
  <text x="150" y="3958" fill="#172d27" font-family="Georgia,serif" font-size="30">hearts again</text>
  <text x="150" y="3997" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 9:34–35</text>
  <text x="150" y="4031" fill="#59685f" font-family="Arial,sans-serif" font-size="24">After the storm ceases,</text>
  <text x="150" y="4061" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh and his servants</text>
  <text x="150" y="4091" fill="#59685f" font-family="Arial,sans-serif" font-size="24">harden their hearts and</text>
  <text x="150" y="4121" fill="#59685f" font-family="Arial,sans-serif" font-size="24">refuse to release Israel.</text>
  <text x="120" y="4221" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
