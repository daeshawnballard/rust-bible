<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2704" viewBox="0 0 1536 2704" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 23 · Chapter outline</title>
  <desc id="desc">A vertical column of 7 text cards partitions all 33 verses in Exodus 23. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2704" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 23 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 23:1–33 · 7 source-based reading stages</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Justice, testimony,</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">and neighbor help</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 23:1–9</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The law forbids false</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">witness and partial</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">judgment, aiding enemies’</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">animals and strangers.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="738" x2="120" y2="738" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="738" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">Seventh-year and</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">weekly rest</text>
  <text x="150" y="715" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 23:10–13</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The land rests in year</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">seven; weekly rest</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">refreshes workers, animals,</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and strangers.</text>
  <path d="M335 889V939" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1090" x2="120" y2="1090" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="949" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1090" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">Annual feasts and</text>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">offerings</text>
  <text x="150" y="1067" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 23:14–19</text>
  <text x="150" y="1101" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Three yearly feasts mark</text>
  <text x="150" y="1131" fill="#59685f" font-family="Arial,sans-serif" font-size="24">unleavened bread, harvest,</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and ingathering, with</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offering rules.</text>
  <path d="M335 1241V1291" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1442" x2="120" y2="1442" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1301" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1442" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1344" fill="#172d27" font-family="Georgia,serif" font-size="30">Messenger and</text>
  <text x="150" y="1380" fill="#172d27" font-family="Georgia,serif" font-size="30">conditional promise</text>
  <text x="150" y="1419" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 23:20–23</text>
  <text x="150" y="1453" fill="#59685f" font-family="Arial,sans-serif" font-size="24">An Angel leads Israel; the</text>
  <text x="150" y="1483" fill="#59685f" font-family="Arial,sans-serif" font-size="24">LORD commands obedience and</text>
  <text x="150" y="1513" fill="#59685f" font-family="Arial,sans-serif" font-size="24">promises aid against</text>
  <text x="150" y="1543" fill="#59685f" font-family="Arial,sans-serif" font-size="24">enemies.</text>
  <path d="M335 1593V1643" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1779" x2="120" y2="1779" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1653" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1779" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1696" fill="#172d27" font-family="Georgia,serif" font-size="30">Worship and promised</text>
  <text x="150" y="1732" fill="#172d27" font-family="Georgia,serif" font-size="30">blessing</text>
  <text x="150" y="1771" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 23:24–26</text>
  <text x="150" y="1805" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel must serve the LORD,</text>
  <text x="150" y="1835" fill="#59685f" font-family="Arial,sans-serif" font-size="24">who promises food, water,</text>
  <text x="150" y="1865" fill="#59685f" font-family="Arial,sans-serif" font-size="24">fertility, and long life.</text>
  <path d="M335 1915V1965" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2116" x2="120" y2="2116" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1975" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2116" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2018" fill="#172d27" font-family="Georgia,serif" font-size="30">Future land and</text>
  <text x="150" y="2054" fill="#172d27" font-family="Georgia,serif" font-size="30">boundaries</text>
  <text x="150" y="2093" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 23:27–31</text>
  <text x="150" y="2127" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD promises fear,</text>
  <text x="150" y="2157" fill="#59685f" font-family="Arial,sans-serif" font-size="24">hornets, gradual removal of</text>
  <text x="150" y="2187" fill="#59685f" font-family="Arial,sans-serif" font-size="24">peoples, and land</text>
  <text x="150" y="2217" fill="#59685f" font-family="Arial,sans-serif" font-size="24">boundaries.</text>
  <path d="M335 2267V2317" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2468" x2="120" y2="2468" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2327" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2468" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2370" fill="#172d27" font-family="Georgia,serif" font-size="30">No covenant with local</text>
  <text x="150" y="2406" fill="#172d27" font-family="Georgia,serif" font-size="30">gods</text>
  <text x="150" y="2445" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 23:32–33</text>
  <text x="150" y="2479" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel must make no</text>
  <text x="150" y="2509" fill="#59685f" font-family="Arial,sans-serif" font-size="24">covenant with local peoples</text>
  <text x="150" y="2539" fill="#59685f" font-family="Arial,sans-serif" font-size="24">or gods, lest worship</text>
  <text x="150" y="2569" fill="#59685f" font-family="Arial,sans-serif" font-size="24">become a snare.</text>
  <text x="120" y="2669" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
