<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="3008" viewBox="0 0 1536 3008" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 23 · Chapter outline</title>
  <desc id="desc">A vertical column of 8 text cards partitions all 44 verses in Leviticus 23. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="3008" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 23 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Sabbaths and appointed feasts · Leviticus 23:1–44 · 8 source-based</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">units</text>
  <line x1="88" y1="353" x2="120" y2="353" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="216" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="353" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Weekly Sabbath</text>
  <text x="150" y="327" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 23:1–3</text>
  <text x="150" y="361" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The weekly Sabbath is a day</text>
  <text x="150" y="391" fill="#59685f" font-family="Arial,sans-serif" font-size="24">of rest and holy assembly</text>
  <text x="150" y="421" fill="#59685f" font-family="Arial,sans-serif" font-size="24">with no work.</text>
  <path d="M335 471V521" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="687" x2="120" y2="687" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="531" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="687" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="574" fill="#172d27" font-family="Georgia,serif" font-size="30">Passover and</text>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">unleavened bread</text>
  <text x="150" y="649" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 23:4–8</text>
  <text x="150" y="683" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Passover falls on the first</text>
  <text x="150" y="713" fill="#59685f" font-family="Arial,sans-serif" font-size="24">month's fourteenth day;</text>
  <text x="150" y="743" fill="#59685f" font-family="Arial,sans-serif" font-size="24">unleavened bread begins on</text>
  <text x="150" y="773" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the fifteenth and lasts seven</text>
  <text x="150" y="803" fill="#59685f" font-family="Arial,sans-serif" font-size="24">days.</text>
  <path d="M335 853V903" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1036" x2="120" y2="1036" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="913" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1036" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="956" fill="#172d27" font-family="Georgia,serif" font-size="30">The first sheaf</text>
  <text x="150" y="995" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 23:9–14</text>
  <text x="150" y="1029" fill="#59685f" font-family="Arial,sans-serif" font-size="24">At harvest, a sheaf is</text>
  <text x="150" y="1059" fill="#59685f" font-family="Arial,sans-serif" font-size="24">presented and waved; new</text>
  <text x="150" y="1089" fill="#59685f" font-family="Arial,sans-serif" font-size="24">grain is not eaten until that</text>
  <text x="150" y="1119" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offering is made.</text>
  <path d="M335 1169V1219" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1370" x2="120" y2="1370" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1229" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1370" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1272" fill="#172d27" font-family="Georgia,serif" font-size="30">Counting to the feast</text>
  <text x="150" y="1308" fill="#172d27" font-family="Georgia,serif" font-size="30">of weeks</text>
  <text x="150" y="1347" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 23:15–22</text>
  <text x="150" y="1381" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Count seven complete Sabbaths</text>
  <text x="150" y="1411" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and then fifty days; bring</text>
  <text x="150" y="1441" fill="#59685f" font-family="Arial,sans-serif" font-size="24">two leavened loaves and</text>
  <text x="150" y="1471" fill="#59685f" font-family="Arial,sans-serif" font-size="24">prescribed offerings.</text>
  <path d="M335 1521V1571" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1722" x2="120" y2="1722" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1581" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1722" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1624" fill="#172d27" font-family="Georgia,serif" font-size="30">Trumpets in the</text>
  <text x="150" y="1660" fill="#172d27" font-family="Georgia,serif" font-size="30">seventh month</text>
  <text x="150" y="1699" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 23:23–25</text>
  <text x="150" y="1733" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The seventh month's first day</text>
  <text x="150" y="1763" fill="#59685f" font-family="Arial,sans-serif" font-size="24">is a Sabbath-like memorial of</text>
  <text x="150" y="1793" fill="#59685f" font-family="Arial,sans-serif" font-size="24">trumpet blowing and holy</text>
  <text x="150" y="1823" fill="#59685f" font-family="Arial,sans-serif" font-size="24">assembly.</text>
  <path d="M335 1873V1923" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2056" x2="120" y2="2056" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1933" width="430" height="246" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2056" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1976" fill="#172d27" font-family="Georgia,serif" font-size="30">The Day of Atonement</text>
  <text x="150" y="2015" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 23:26–32</text>
  <text x="150" y="2049" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The seventh month's tenth day</text>
  <text x="150" y="2079" fill="#59685f" font-family="Arial,sans-serif" font-size="24">is a solemn day of</text>
  <text x="150" y="2109" fill="#59685f" font-family="Arial,sans-serif" font-size="24">self-affliction, offering,</text>
  <text x="150" y="2139" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and complete rest from work.</text>
  <path d="M335 2189V2239" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2390" x2="120" y2="2390" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2249" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2390" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2292" fill="#172d27" font-family="Georgia,serif" font-size="30">The feast of booths</text>
  <text x="150" y="2328" fill="#172d27" font-family="Georgia,serif" font-size="30">announced</text>
  <text x="150" y="2367" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 23:33–38</text>
  <text x="150" y="2401" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The seventh month's fifteenth</text>
  <text x="150" y="2431" fill="#59685f" font-family="Arial,sans-serif" font-size="24">day begins seven days of the</text>
  <text x="150" y="2461" fill="#59685f" font-family="Arial,sans-serif" font-size="24">feast of booths, followed by</text>
  <text x="150" y="2491" fill="#59685f" font-family="Arial,sans-serif" font-size="24">an eighth-day assembly.</text>
  <path d="M335 2541V2591" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2757" x2="120" y2="2757" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2601" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2757" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2644" fill="#172d27" font-family="Georgia,serif" font-size="30">Booths and branches at</text>
  <text x="150" y="2680" fill="#172d27" font-family="Georgia,serif" font-size="30">harvest</text>
  <text x="150" y="2719" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 23:39–44</text>
  <text x="150" y="2753" fill="#59685f" font-family="Arial,sans-serif" font-size="24">At ingathering, Israel</text>
  <text x="150" y="2783" fill="#59685f" font-family="Arial,sans-serif" font-size="24">celebrates seven days,</text>
  <text x="150" y="2813" fill="#59685f" font-family="Arial,sans-serif" font-size="24">carries tree branches, dwells</text>
  <text x="150" y="2843" fill="#59685f" font-family="Arial,sans-serif" font-size="24">in booths, and remembers the</text>
  <text x="150" y="2873" fill="#59685f" font-family="Arial,sans-serif" font-size="24">wilderness.</text>
  <text x="120" y="2973" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
