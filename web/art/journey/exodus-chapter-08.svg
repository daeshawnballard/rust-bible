<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="3486" viewBox="0 0 1536 3486" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 8 · Chapter outline</title>
  <desc id="desc">A vertical column of 9 text cards partitions all 32 verses in Exodus 8. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="3486" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 8 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 8:1–32 · 9 source-based reading stages</text>
  <line x1="88" y1="386" x2="120" y2="386" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="386" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Frogs are announced</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">and cover Egypt</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 8:1–6</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Frogs are announced;</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron’s rod brings them</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">across Egypt, into houses</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and kneading troughs.</text>
  <path d="M335 537V587" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="738" x2="120" y2="738" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="597" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="738" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="640" fill="#172d27" font-family="Georgia,serif" font-size="30">Magicians bring frogs;</text>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh asks relief</text>
  <text x="150" y="715" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 8:7–8</text>
  <text x="150" y="749" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The magicians bring up</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">frogs, and Pharaoh calls</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses and Aaron to ask the</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">LORD for relief.</text>
  <path d="M335 889V939" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1108" x2="120" y2="1108" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="949" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1108" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="992" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh appoints</text>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">tomorrow for the frogs</text>
  <text x="150" y="1064" fill="#172d27" font-family="Georgia,serif" font-size="30">to depart</text>
  <text x="150" y="1103" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 8:9–11</text>
  <text x="150" y="1137" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh asks Moses to</text>
  <text x="150" y="1167" fill="#59685f" font-family="Arial,sans-serif" font-size="24">appoint when the frogs</text>
  <text x="150" y="1197" fill="#59685f" font-family="Arial,sans-serif" font-size="24">should leave; Moses says it</text>
  <text x="150" y="1227" fill="#59685f" font-family="Arial,sans-serif" font-size="24">will be tomorrow.</text>
  <path d="M335 1277V1327" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1481" x2="120" y2="1481" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1337" width="430" height="288" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1481" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1380" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses cries unto the</text>
  <text x="150" y="1416" fill="#172d27" font-family="Georgia,serif" font-size="30">LORD because of the</text>
  <text x="150" y="1452" fill="#172d27" font-family="Georgia,serif" font-size="30">frogs</text>
  <text x="150" y="1491" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 8:12</text>
  <text x="150" y="1525" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses cries to the LORD</text>
  <text x="150" y="1555" fill="#59685f" font-family="Arial,sans-serif" font-size="24">about the frogs, as Pharaoh</text>
  <text x="150" y="1585" fill="#59685f" font-family="Arial,sans-serif" font-size="24">had asked.</text>
  <path d="M335 1635V1685" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1836" x2="120" y2="1836" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1695" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1836" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1738" fill="#172d27" font-family="Georgia,serif" font-size="30">Frogs die and are</text>
  <text x="150" y="1774" fill="#172d27" font-family="Georgia,serif" font-size="30">gathered in heaps</text>
  <text x="150" y="1813" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 8:13–14</text>
  <text x="150" y="1847" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The frogs die in houses,</text>
  <text x="150" y="1877" fill="#59685f" font-family="Arial,sans-serif" font-size="24">villages, and fields, and</text>
  <text x="150" y="1907" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the people gather them in</text>
  <text x="150" y="1937" fill="#59685f" font-family="Arial,sans-serif" font-size="24">heaps.</text>
  <path d="M335 1987V2037" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2173" x2="120" y2="2173" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2047" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2173" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2090" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh hardens his</text>
  <text x="150" y="2126" fill="#172d27" font-family="Georgia,serif" font-size="30">heart after respite</text>
  <text x="150" y="2165" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 8:15</text>
  <text x="150" y="2199" fill="#59685f" font-family="Arial,sans-serif" font-size="24">When Pharaoh sees relief,</text>
  <text x="150" y="2229" fill="#59685f" font-family="Arial,sans-serif" font-size="24">he hardens his heart and</text>
  <text x="150" y="2259" fill="#59685f" font-family="Arial,sans-serif" font-size="24">refuses to listen.</text>
  <path d="M335 2309V2359" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2510" x2="120" y2="2510" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2369" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2510" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2412" fill="#172d27" font-family="Georgia,serif" font-size="30">Dust becomes lice;</text>
  <text x="150" y="2448" fill="#172d27" font-family="Georgia,serif" font-size="30">magicians fail</text>
  <text x="150" y="2487" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 8:16–19</text>
  <text x="150" y="2521" fill="#59685f" font-family="Arial,sans-serif" font-size="24">At the LORD’s command Aaron</text>
  <text x="150" y="2551" fill="#59685f" font-family="Arial,sans-serif" font-size="24">strikes the dust, which</text>
  <text x="150" y="2581" fill="#59685f" font-family="Arial,sans-serif" font-size="24">becomes lice; the magicians</text>
  <text x="150" y="2611" fill="#59685f" font-family="Arial,sans-serif" font-size="24">cannot reproduce the sign.</text>
  <path d="M335 2661V2711" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2862" x2="120" y2="2862" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2721" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2862" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2764" fill="#172d27" font-family="Georgia,serif" font-size="30">Swarms enter Egypt;</text>
  <text x="150" y="2800" fill="#172d27" font-family="Georgia,serif" font-size="30">Goshen is set apart</text>
  <text x="150" y="2839" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 8:20–24</text>
  <text x="150" y="2873" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD announces a</text>
  <text x="150" y="2903" fill="#59685f" font-family="Arial,sans-serif" font-size="24">division between Goshen and</text>
  <text x="150" y="2933" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Egypt; swarms come into</text>
  <text x="150" y="2963" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Egypt’s houses and land.</text>
  <path d="M335 3013V3063" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3232" x2="120" y2="3232" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3073" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3232" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3116" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh bargains;</text>
  <text x="150" y="3152" fill="#172d27" font-family="Georgia,serif" font-size="30">swarms depart; refusal</text>
  <text x="150" y="3188" fill="#172d27" font-family="Georgia,serif" font-size="30">resumes</text>
  <text x="150" y="3227" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 8:25–32</text>
  <text x="150" y="3261" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh offers limits on</text>
  <text x="150" y="3291" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sacrifice; Moses prays, the</text>
  <text x="150" y="3321" fill="#59685f" font-family="Arial,sans-serif" font-size="24">LORD removes the flies, and</text>
  <text x="150" y="3351" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh refuses again.</text>
  <text x="120" y="3451" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
