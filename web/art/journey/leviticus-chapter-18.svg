<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2646" viewBox="0 0 1536 2646" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 18 · Chapter outline</title>
  <desc id="desc">A vertical column of 6 text cards partitions all 30 verses in Leviticus 18. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2646" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 18 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Boundaries for Israel's conduct · Leviticus 18:1–30 · 6 source-based</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">units</text>
  <line x1="88" y1="401" x2="120" y2="401" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="401" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">General covenant</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">instruction</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 18:1–5</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD contrasts Egypt and</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Canaan's practices with his</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">statutes, which Israel is</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">told to keep; the passage</text>
  <text x="150" y="517" fill="#59685f" font-family="Arial,sans-serif" font-size="24">links keeping them with life.</text>
  <path d="M335 567V617" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="780" x2="120" y2="780" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="627" width="430" height="306" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="780" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="670" fill="#172d27" font-family="Georgia,serif" font-size="30">Close-kin prohibitions</text>
  <text x="150" y="709" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 18:6–11</text>
  <text x="150" y="743" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The passage prohibits sexual</text>
  <text x="150" y="773" fill="#59685f" font-family="Arial,sans-serif" font-size="24">relations with specified</text>
  <text x="150" y="803" fill="#59685f" font-family="Arial,sans-serif" font-size="24">immediate family members and</text>
  <text x="150" y="833" fill="#59685f" font-family="Arial,sans-serif" font-size="24">distinguishes relationships</text>
  <text x="150" y="863" fill="#59685f" font-family="Arial,sans-serif" font-size="24">by parentage and household</text>
  <text x="150" y="893" fill="#59685f" font-family="Arial,sans-serif" font-size="24">ties.</text>
  <path d="M335 943V993" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1174" x2="120" y2="1174" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1003" width="430" height="342" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1174" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1046" fill="#172d27" font-family="Georgia,serif" font-size="30">Further kin and in-law</text>
  <text x="150" y="1082" fill="#172d27" font-family="Georgia,serif" font-size="30">prohibitions</text>
  <text x="150" y="1121" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 18:12–18</text>
  <text x="150" y="1155" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Rules address aunts, an</text>
  <text x="150" y="1185" fill="#59685f" font-family="Arial,sans-serif" font-size="24">uncle's wife, a</text>
  <text x="150" y="1215" fill="#59685f" font-family="Arial,sans-serif" font-size="24">daughter-in-law, a brother's</text>
  <text x="150" y="1245" fill="#59685f" font-family="Arial,sans-serif" font-size="24">wife, related generations,</text>
  <text x="150" y="1275" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and taking sisters as wives</text>
  <text x="150" y="1305" fill="#59685f" font-family="Arial,sans-serif" font-size="24">together.</text>
  <path d="M335 1355V1405" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1586" x2="120" y2="1586" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1415" width="430" height="342" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1586" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1458" fill="#172d27" font-family="Georgia,serif" font-size="30">Other sexual and</text>
  <text x="150" y="1494" fill="#172d27" font-family="Georgia,serif" font-size="30">worship prohibitions</text>
  <text x="150" y="1533" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 18:19–23</text>
  <text x="150" y="1567" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Further prohibitions cover</text>
  <text x="150" y="1597" fill="#59685f" font-family="Arial,sans-serif" font-size="24">contact during the stated</text>
  <text x="150" y="1627" fill="#59685f" font-family="Arial,sans-serif" font-size="24">separation, adultery,</text>
  <text x="150" y="1657" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offering offspring to Molech,</text>
  <text x="150" y="1687" fill="#59685f" font-family="Arial,sans-serif" font-size="24">male-male intercourse as</text>
  <text x="150" y="1717" fill="#59685f" font-family="Arial,sans-serif" font-size="24">worded, and sex with animals.</text>
  <path d="M335 1767V1817" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1983" x2="120" y2="1983" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1827" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1983" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1870" fill="#172d27" font-family="Georgia,serif" font-size="30">Defilement and land</text>
  <text x="150" y="1906" fill="#172d27" font-family="Georgia,serif" font-size="30">response</text>
  <text x="150" y="1945" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 18:24–25</text>
  <text x="150" y="1979" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The text warns Israel not to</text>
  <text x="150" y="2009" fill="#59685f" font-family="Arial,sans-serif" font-size="24">follow these practices and</text>
  <text x="150" y="2039" fill="#59685f" font-family="Arial,sans-serif" font-size="24">says the land was defiled and</text>
  <text x="150" y="2069" fill="#59685f" font-family="Arial,sans-serif" font-size="24">vomited out prior</text>
  <text x="150" y="2099" fill="#59685f" font-family="Arial,sans-serif" font-size="24">inhabitants.</text>
  <path d="M335 2149V2199" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2380" x2="120" y2="2380" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2209" width="430" height="342" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2380" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2252" fill="#172d27" font-family="Georgia,serif" font-size="30">Command, penalty, and</text>
  <text x="150" y="2288" fill="#172d27" font-family="Georgia,serif" font-size="30">warning</text>
  <text x="150" y="2327" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 18:26–30</text>
  <text x="150" y="2361" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israelites and resident</text>
  <text x="150" y="2391" fill="#59685f" font-family="Arial,sans-serif" font-size="24">strangers are told to keep</text>
  <text x="150" y="2421" fill="#59685f" font-family="Arial,sans-serif" font-size="24">these statutes; the text</text>
  <text x="150" y="2451" fill="#59685f" font-family="Arial,sans-serif" font-size="24">warns of exclusion for</text>
  <text x="150" y="2481" fill="#59685f" font-family="Arial,sans-serif" font-size="24">transgression and repeats the</text>
  <text x="150" y="2511" fill="#59685f" font-family="Arial,sans-serif" font-size="24">command.</text>
  <text x="120" y="2611" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
