<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2120" viewBox="0 0 1536 2120" role="img" aria-labelledby="title desc">
  <title id="title">Leviticus 6 · Chapter outline</title>
  <desc id="desc">A vertical column of 5 text cards partitions all 30 verses in Leviticus 6. The diagram follows source ranges and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="2120" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Leviticus 6 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="26">Restitution and Priestly Offering Laws · Leviticus 6:1–30 · 5</text>
  <text x="120" y="174" fill="#59685f" font-family="Arial,sans-serif" font-size="26">source-based units</text>
  <line x1="88" y1="401" x2="120" y2="401" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="401" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Fraud, repayment, and</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">a guilt offering</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 6:1–7</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A person who defrauds a</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">neighbor restores the</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">property, adds a fifth, and</text>
  <text x="150" y="487" fill="#59685f" font-family="Arial,sans-serif" font-size="24">brings a ram for a guilt</text>
  <text x="150" y="517" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offering.</text>
  <path d="M335 567V617" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="783" x2="120" y2="783" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="627" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="783" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="670" fill="#172d27" font-family="Georgia,serif" font-size="30">The burnt offering and</text>
  <text x="150" y="706" fill="#172d27" font-family="Georgia,serif" font-size="30">altar fire</text>
  <text x="150" y="745" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 6:8–13</text>
  <text x="150" y="779" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The priest tends the burnt</text>
  <text x="150" y="809" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offering overnight, removes</text>
  <text x="150" y="839" fill="#59685f" font-family="Arial,sans-serif" font-size="24">ashes safely, and keeps the</text>
  <text x="150" y="869" fill="#59685f" font-family="Arial,sans-serif" font-size="24">altar fire burning</text>
  <text x="150" y="899" fill="#59685f" font-family="Arial,sans-serif" font-size="24">continually.</text>
  <path d="M335 949V999" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1150" x2="120" y2="1150" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1009" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1150" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1052" fill="#172d27" font-family="Georgia,serif" font-size="30">The priests’ grain</text>
  <text x="150" y="1088" fill="#172d27" font-family="Georgia,serif" font-size="30">offering</text>
  <text x="150" y="1127" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 6:14–18</text>
  <text x="150" y="1161" fill="#59685f" font-family="Arial,sans-serif" font-size="24">A memorial portion is burned;</text>
  <text x="150" y="1191" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron and his sons eat the</text>
  <text x="150" y="1221" fill="#59685f" font-family="Arial,sans-serif" font-size="24">remainder unleavened in the</text>
  <text x="150" y="1251" fill="#59685f" font-family="Arial,sans-serif" font-size="24">holy place.</text>
  <path d="M335 1301V1351" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1502" x2="120" y2="1502" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1361" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1502" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1404" fill="#172d27" font-family="Georgia,serif" font-size="30">The daily offering of</text>
  <text x="150" y="1440" fill="#172d27" font-family="Georgia,serif" font-size="30">the anointed priest</text>
  <text x="150" y="1479" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 6:19–23</text>
  <text x="150" y="1513" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The anointed priest presents</text>
  <text x="150" y="1543" fill="#59685f" font-family="Arial,sans-serif" font-size="24">a grain offering morning and</text>
  <text x="150" y="1573" fill="#59685f" font-family="Arial,sans-serif" font-size="24">evening; the whole offering</text>
  <text x="150" y="1603" fill="#59685f" font-family="Arial,sans-serif" font-size="24">is burned and not eaten.</text>
  <path d="M335 1653V1703" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1869" x2="120" y2="1869" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1713" width="430" height="312" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1869" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1756" fill="#172d27" font-family="Georgia,serif" font-size="30">The law of the sin</text>
  <text x="150" y="1792" fill="#172d27" font-family="Georgia,serif" font-size="30">offering</text>
  <text x="150" y="1831" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Leviticus 6:24–30</text>
  <text x="150" y="1865" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The priest eats the sin</text>
  <text x="150" y="1895" fill="#59685f" font-family="Arial,sans-serif" font-size="24">offering in the holy court,</text>
  <text x="150" y="1925" fill="#59685f" font-family="Arial,sans-serif" font-size="24">except an offering whose</text>
  <text x="150" y="1955" fill="#59685f" font-family="Arial,sans-serif" font-size="24">blood is brought into the</text>
  <text x="150" y="1985" fill="#59685f" font-family="Arial,sans-serif" font-size="24">sanctuary.</text>
  <text x="120" y="2085" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; this diagram is a reading outline, not a scene or map.</text>
</svg>
