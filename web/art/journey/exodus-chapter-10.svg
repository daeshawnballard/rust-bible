<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="4936" viewBox="0 0 1536 4936" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 10 · Chapter outline</title>
  <desc id="desc">A vertical column of 13 text cards partitions all 29 verses in Exodus 10. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="4936" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 10 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 10:1–29 · 13 source-based reading stages</text>
  <line x1="88" y1="404" x2="120" y2="404" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="404" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">The signs are to be</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">told to later</text>
  <text x="150" y="360" fill="#172d27" font-family="Georgia,serif" font-size="30">generations</text>
  <text x="150" y="399" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 10:1–2</text>
  <text x="150" y="433" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses recounts Egypt’s</text>
  <text x="150" y="463" fill="#59685f" font-family="Arial,sans-serif" font-size="24">signs to his children and</text>
  <text x="150" y="493" fill="#59685f" font-family="Arial,sans-serif" font-size="24">grandchildren so they may</text>
  <text x="150" y="523" fill="#59685f" font-family="Arial,sans-serif" font-size="24">know the LORD.</text>
  <path d="M335 573V623" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="774" x2="120" y2="774" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="633" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="774" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="676" fill="#172d27" font-family="Georgia,serif" font-size="30">Locusts are announced</text>
  <text x="150" y="712" fill="#172d27" font-family="Georgia,serif" font-size="30">if Pharaoh refuses</text>
  <text x="150" y="751" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 10:3–6</text>
  <text x="150" y="785" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD warns that locusts</text>
  <text x="150" y="815" fill="#59685f" font-family="Arial,sans-serif" font-size="24">will cover Egypt and</text>
  <text x="150" y="845" fill="#59685f" font-family="Arial,sans-serif" font-size="24">consume what the hail left</text>
  <text x="150" y="875" fill="#59685f" font-family="Arial,sans-serif" font-size="24">if Pharaoh refuses again.</text>
  <path d="M335 925V975" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1144" x2="120" y2="1144" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="985" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1144" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1028" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh’s servants</text>
  <text x="150" y="1064" fill="#172d27" font-family="Georgia,serif" font-size="30">urge him to let the</text>
  <text x="150" y="1100" fill="#172d27" font-family="Georgia,serif" font-size="30">people go</text>
  <text x="150" y="1139" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 10:7</text>
  <text x="150" y="1173" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh’s servants urge him</text>
  <text x="150" y="1203" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to release the people to</text>
  <text x="150" y="1233" fill="#59685f" font-family="Arial,sans-serif" font-size="24">serve the LORD, saying</text>
  <text x="150" y="1263" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Egypt is destroyed.</text>
  <path d="M335 1313V1363" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1499" x2="120" y2="1499" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1373" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1499" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1416" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh asks who may</text>
  <text x="150" y="1452" fill="#172d27" font-family="Georgia,serif" font-size="30">go, then limits them</text>
  <text x="150" y="1491" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 10:8–11</text>
  <text x="150" y="1525" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh limits release to</text>
  <text x="150" y="1555" fill="#59685f" font-family="Arial,sans-serif" font-size="24">men; Moses says all Israel</text>
  <text x="150" y="1585" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and their flocks must go.</text>
  <path d="M335 1635V1685" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1854" x2="120" y2="1854" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1695" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1854" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1738" fill="#172d27" font-family="Georgia,serif" font-size="30">Locusts cover Egypt</text>
  <text x="150" y="1774" fill="#172d27" font-family="Georgia,serif" font-size="30">and consume what hail</text>
  <text x="150" y="1810" fill="#172d27" font-family="Georgia,serif" font-size="30">left</text>
  <text x="150" y="1849" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 10:12–15</text>
  <text x="150" y="1883" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD commands locusts;</text>
  <text x="150" y="1913" fill="#59685f" font-family="Arial,sans-serif" font-size="24">an east wind brings them,</text>
  <text x="150" y="1943" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and they cover Egypt and</text>
  <text x="150" y="1973" fill="#59685f" font-family="Arial,sans-serif" font-size="24">consume what the hail left.</text>
  <path d="M335 2023V2073" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2242" x2="120" y2="2242" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2083" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2242" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2126" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh confesses and</text>
  <text x="150" y="2162" fill="#172d27" font-family="Georgia,serif" font-size="30">asks Moses to forgive</text>
  <text x="150" y="2198" fill="#172d27" font-family="Georgia,serif" font-size="30">him</text>
  <text x="150" y="2237" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 10:16–17</text>
  <text x="150" y="2271" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh confesses his sin</text>
  <text x="150" y="2301" fill="#59685f" font-family="Arial,sans-serif" font-size="24">and asks Moses to forgive</text>
  <text x="150" y="2331" fill="#59685f" font-family="Arial,sans-serif" font-size="24">him and entreat the LORD to</text>
  <text x="150" y="2361" fill="#59685f" font-family="Arial,sans-serif" font-size="24">remove this death.</text>
  <path d="M335 2411V2461" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2582" x2="120" y2="2582" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2471" width="430" height="222" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2582" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2514" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses entreats the</text>
  <text x="150" y="2550" fill="#172d27" font-family="Georgia,serif" font-size="30">LORD</text>
  <text x="150" y="2589" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 10:18</text>
  <text x="150" y="2623" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses leaves Pharaoh and</text>
  <text x="150" y="2653" fill="#59685f" font-family="Arial,sans-serif" font-size="24">entreats the LORD.</text>
  <path d="M335 2703V2753" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="2922" x2="120" y2="2922" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="2763" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="2922" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="2806" fill="#172d27" font-family="Georgia,serif" font-size="30">A west wind carries</text>
  <text x="150" y="2842" fill="#172d27" font-family="Georgia,serif" font-size="30">the locusts into the</text>
  <text x="150" y="2878" fill="#172d27" font-family="Georgia,serif" font-size="30">Red sea</text>
  <text x="150" y="2917" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 10:19</text>
  <text x="150" y="2951" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD sends a strong</text>
  <text x="150" y="2981" fill="#59685f" font-family="Arial,sans-serif" font-size="24">west wind that carries</text>
  <text x="150" y="3011" fill="#59685f" font-family="Arial,sans-serif" font-size="24">every locust into the Red</text>
  <text x="150" y="3041" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Sea.</text>
  <path d="M335 3091V3141" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3292" x2="120" y2="3292" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3151" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3292" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3194" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh’s heart is</text>
  <text x="150" y="3230" fill="#172d27" font-family="Georgia,serif" font-size="30">hardened again</text>
  <text x="150" y="3269" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 10:20</text>
  <text x="150" y="3303" fill="#59685f" font-family="Arial,sans-serif" font-size="24">After the locusts depart,</text>
  <text x="150" y="3333" fill="#59685f" font-family="Arial,sans-serif" font-size="24">the LORD hardens Pharaoh’s</text>
  <text x="150" y="3363" fill="#59685f" font-family="Arial,sans-serif" font-size="24">heart and he refuses to let</text>
  <text x="150" y="3393" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Israel go.</text>
  <path d="M335 3443V3493" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3644" x2="120" y2="3644" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3503" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3644" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3546" fill="#172d27" font-family="Georgia,serif" font-size="30">Darkness in Egypt;</text>
  <text x="150" y="3582" fill="#172d27" font-family="Georgia,serif" font-size="30">Israel has light</text>
  <text x="150" y="3621" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 10:21–23</text>
  <text x="150" y="3655" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Darkness covers Egypt three</text>
  <text x="150" y="3685" fill="#59685f" font-family="Arial,sans-serif" font-size="24">days, while all the</text>
  <text x="150" y="3715" fill="#59685f" font-family="Arial,sans-serif" font-size="24">children of Israel have</text>
  <text x="150" y="3745" fill="#59685f" font-family="Arial,sans-serif" font-size="24">light in their dwellings.</text>
  <path d="M335 3795V3845" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="3996" x2="120" y2="3996" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="3855" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="3996" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="3898" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh offers release</text>
  <text x="150" y="3934" fill="#172d27" font-family="Georgia,serif" font-size="30">but keeps livestock</text>
  <text x="150" y="3973" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 10:24</text>
  <text x="150" y="4007" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh offers release but</text>
  <text x="150" y="4037" fill="#59685f" font-family="Arial,sans-serif" font-size="24">commands Israel to leave</text>
  <text x="150" y="4067" fill="#59685f" font-family="Arial,sans-serif" font-size="24">its flocks and herds</text>
  <text x="150" y="4097" fill="#59685f" font-family="Arial,sans-serif" font-size="24">behind.</text>
  <path d="M335 4147V4197" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="4348" x2="120" y2="4348" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="4207" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="4348" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="4250" fill="#172d27" font-family="Georgia,serif" font-size="30">Moses says the cattle</text>
  <text x="150" y="4286" fill="#172d27" font-family="Georgia,serif" font-size="30">must go for sacrifice</text>
  <text x="150" y="4325" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 10:25–26</text>
  <text x="150" y="4359" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Moses says Israel’s cattle</text>
  <text x="150" y="4389" fill="#59685f" font-family="Arial,sans-serif" font-size="24">must go because they do not</text>
  <text x="150" y="4419" fill="#59685f" font-family="Arial,sans-serif" font-size="24">know which animals they</text>
  <text x="150" y="4449" fill="#59685f" font-family="Arial,sans-serif" font-size="24">will use to serve the LORD.</text>
  <path d="M335 4499V4549" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="4700" x2="120" y2="4700" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="4559" width="430" height="282" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="4700" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="4602" fill="#172d27" font-family="Georgia,serif" font-size="30">Pharaoh forbids Moses</text>
  <text x="150" y="4638" fill="#172d27" font-family="Georgia,serif" font-size="30">to see him again</text>
  <text x="150" y="4677" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 10:27–29</text>
  <text x="150" y="4711" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Pharaoh orders Moses never</text>
  <text x="150" y="4741" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to see him again; Moses</text>
  <text x="150" y="4771" fill="#59685f" font-family="Arial,sans-serif" font-size="24">agrees they will not meet</text>
  <text x="150" y="4801" fill="#59685f" font-family="Arial,sans-serif" font-size="24">again.</text>
  <text x="120" y="4901" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
