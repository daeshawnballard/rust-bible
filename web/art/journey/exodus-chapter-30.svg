<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1946" viewBox="0 0 1536 1946" role="img" aria-labelledby="title desc">
  <title id="title">Exodus 30 · Chapter outline</title>
  <desc id="desc">A vertical column of 5 text cards partitions all 38 verses in Exodus 30. The diagram separates reading stages and does not depict one scene or a geographic route.</desc>
  <rect width="1536" height="1946" fill="#f7f5ee"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#29664d"/></marker></defs>
  <text x="120" y="90" fill="#172d27" font-family="Georgia,serif" font-size="40">Exodus 30 · Chapter outline</text>
  <text x="120" y="142" fill="#59685f" font-family="Arial,sans-serif" font-size="28">Exodus 30:1–38 · 5 source-based reading stages</text>
  <line x1="88" y1="371" x2="120" y2="371" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="245" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="371" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="288" fill="#172d27" font-family="Georgia,serif" font-size="30">Golden incense altar</text>
  <text x="150" y="324" fill="#172d27" font-family="Georgia,serif" font-size="30">and service rules</text>
  <text x="150" y="363" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 30:1–10</text>
  <text x="150" y="397" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Aaron is to burn incense</text>
  <text x="150" y="427" fill="#59685f" font-family="Arial,sans-serif" font-size="24">morning and evening at the</text>
  <text x="150" y="457" fill="#59685f" font-family="Arial,sans-serif" font-size="24">gold altar before the veil.</text>
  <path d="M335 507V557" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="726" x2="120" y2="726" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="567" width="430" height="318" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="726" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="610" fill="#172d27" font-family="Georgia,serif" font-size="30">Equal half-shekel</text>
  <text x="150" y="646" fill="#172d27" font-family="Georgia,serif" font-size="30">offering for the</text>
  <text x="150" y="682" fill="#172d27" font-family="Georgia,serif" font-size="30">numbered people</text>
  <text x="150" y="721" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 30:11–16</text>
  <text x="150" y="755" fill="#59685f" font-family="Arial,sans-serif" font-size="24">Each counted man aged</text>
  <text x="150" y="785" fill="#59685f" font-family="Arial,sans-serif" font-size="24">twenty or older gives the</text>
  <text x="150" y="815" fill="#59685f" font-family="Arial,sans-serif" font-size="24">same half-shekel, rich or</text>
  <text x="150" y="845" fill="#59685f" font-family="Arial,sans-serif" font-size="24">poor.</text>
  <path d="M335 895V945" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1081" x2="120" y2="1081" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="955" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1081" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="998" fill="#172d27" font-family="Georgia,serif" font-size="30">Laver placement and</text>
  <text x="150" y="1034" fill="#172d27" font-family="Georgia,serif" font-size="30">washing duty</text>
  <text x="150" y="1073" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 30:17–21</text>
  <text x="150" y="1107" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The laver is placed between</text>
  <text x="150" y="1137" fill="#59685f" font-family="Arial,sans-serif" font-size="24">tent and altar for priests</text>
  <text x="150" y="1167" fill="#59685f" font-family="Arial,sans-serif" font-size="24">to wash before service.</text>
  <path d="M335 1217V1267" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1403" x2="120" y2="1403" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1277" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1403" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1320" fill="#172d27" font-family="Georgia,serif" font-size="30">Holy anointing oil and</text>
  <text x="150" y="1356" fill="#172d27" font-family="Georgia,serif" font-size="30">restrictions</text>
  <text x="150" y="1395" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 30:22–33</text>
  <text x="150" y="1429" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD prescribes holy</text>
  <text x="150" y="1459" fill="#59685f" font-family="Arial,sans-serif" font-size="24">anointing oil and restricts</text>
  <text x="150" y="1489" fill="#59685f" font-family="Arial,sans-serif" font-size="24">its use.</text>
  <path d="M335 1539V1589" fill="none" stroke="#29664d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="88" y1="1725" x2="120" y2="1725" stroke="#29664d" stroke-width="3"/>
  <rect x="120" y="1599" width="430" height="252" rx="18" fill="#eceee4" stroke="#b8cbbb" stroke-width="2"/>
  <circle cx="88" cy="1725" r="10" fill="#29664d" stroke="#f7f5ee" stroke-width="3"/>
  <text x="150" y="1642" fill="#172d27" font-family="Georgia,serif" font-size="30">Holy incense mixture</text>
  <text x="150" y="1678" fill="#172d27" font-family="Georgia,serif" font-size="30">and restrictions</text>
  <text x="150" y="1717" fill="#29664d" font-family="Arial,sans-serif" font-size="22">Exodus 30:34–38</text>
  <text x="150" y="1751" fill="#59685f" font-family="Arial,sans-serif" font-size="24">The LORD prescribes incense</text>
  <text x="150" y="1781" fill="#59685f" font-family="Arial,sans-serif" font-size="24">for the testimony tent and</text>
  <text x="150" y="1811" fill="#59685f" font-family="Arial,sans-serif" font-size="24">forbids private use.</text>
  <text x="120" y="1911" fill="#59685f" font-family="Arial,sans-serif" font-size="22">Each card follows its cited range; the diagram is a reading outline, not a scene or map.</text>
</svg>
